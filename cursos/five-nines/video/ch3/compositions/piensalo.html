<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #piensalo .two { top: 320px; left: 300px; right: 300px; }
        #piensalo .two .tc { height: 250px; }
        #piensalo .bat { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
        #piensalo .bat__tr { position: relative; flex: 1; height: 44px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1.5px solid var(--line-strong); overflow: hidden; }
        #piensalo .bat__f { position: absolute; left: 0; top: 0; bottom: 0; width: 40%; border-radius: 8px; background: var(--evt); display: block; }
        #piensalo .bat__v { flex: none; width: 130px; text-align: right; font-family: var(--mono); font-size: 44px; font-weight: 800; color: var(--text); }
        #piensalo .bat__ic { flex: none; color: var(--text2); display: grid; place-items: center; }
        #piensalo .bat__ic svg { width: 36px; height: 36px; }
        #piensalo .st { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 620; color: var(--text2); }
        #piensalo .st svg { width: 26px; height: 26px; flex: none; }
        #piensalo .st--new { color: var(--evt); }
        #piensalo .st--old { color: var(--amber); }
        #piensalo .same { position: absolute; left: 0; right: 0; top: 238px; display: flex; justify-content: center; }
        #piensalo .same .chip { position: relative; height: 52px; font-size: 24px; }
        #piensalo .ans__r--plain { border-color: #6b2a33; }
        #piensalo .ans__r--plain svg { color: var(--danger); }
        #piensalo .ans__r b { color: var(--danger); }
        #piensalo .one { position: absolute; left: 640px; top: 290px; width: 640px; height: 230px; padding: 26px 32px; display: flex; flex-direction: column; gap: 18px; border-color: var(--accent); box-shadow: 0 0 0 1px rgba(255, 122, 69, 0.25), 0 0 60px rgba(255, 122, 69, 0.24), 0 22px 50px rgba(0, 0, 0, 0.5); }
        #piensalo .one__hd { display: flex; align-items: center; gap: 16px; }
        #piensalo .one__hd span { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--cmp-soft); color: var(--cmp); }
        #piensalo .one__hd span svg { width: 30px; height: 30px; }
        #piensalo .one__hd b { font-size: 32px; font-weight: 760; letter-spacing: -0.02em; }
        #piensalo .one__hd small { font-size: 20px; color: var(--text3); display: block; }
        #piensalo .one .bat__f { width: 8%; background: var(--danger); }
      </style>
      <div id="piensalo" class="scene" data-composition-id="piensalo" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="pi-a">
          <div class="hd pop" id="pi-h" style="top: 150px">Imagina: <span>dos copias</span> de la batería</div>
          <div class="same"><span class="chip chip--cmp pop" id="pi-sc" data-icon="scooter"></span></div>
          <div class="cards cards--2 two">
            <div class="tc tc--cmd pop" id="pi-c1">
              <div class="tc__hd"><span class="tc__ic" data-icon="route"></span><span class="tc__t">Viajes</span></div>
              <div class="bat"><span class="bat__ic" data-icon="battery"></span><div class="bat__tr"><i class="bat__f" id="pi-f1"></i></div><b class="bat__v">40 %</b></div>
              <div class="st st--old pop" id="pi-s1"><span data-icon="hourglass"></span>todavía no procesó el último mensaje</div>
            </div>
            <div class="tc tc--cmd pop" id="pi-c2">
              <div class="tc__hd"><span class="tc__ic" data-icon="wrench"></span><span class="tc__t">Mantenimiento</span></div>
              <div class="bat"><span class="bat__ic" data-icon="battery"></span><div class="bat__tr"><i class="bat__f" id="pi-f2"></i></div><b class="bat__v" id="pi-v2">40 %</b></div>
              <div class="st st--new pop" id="pi-s2"><span data-icon="mail"></span>ya procesó el último mensaje</div>
            </div>
          </div>
        </div>
        <div class="layer" id="pi-b">
          <div class="hd pop" id="pi-h2" style="top: 150px">Con <span>una sola fuente</span></div>
          <svg class="wires" id="pi-w" viewBox="0 0 1920 1080"></svg>
          <div class="card one pop" id="pi-one">
            <div class="one__hd"><span data-icon="server"></span><div><b>Fleet Service</b><small>la única copia del estado</small></div></div>
            <div class="bat"><span class="bat__ic" data-icon="batteryLow"></span><div class="bat__tr"><i class="bat__f"></i></div><b class="bat__v">8 %</b></div>
          </div>
          <div class="layer" id="pi-nodes"></div>
          <div class="sub pop" id="pi-same" style="top: 800px">Las dos decisiones miran <b>el mismo dato</b>.</div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('piensalo');
          const { W, L, LE, pop, hide, to, draw, node, wire, $, tl, think, answers, ring } = K;
          $('#pi-sc').insertAdjacentHTML('beforeend', 'el mismo scooter · 2041');
          const Q = think({ q: '¿Qué puede salir mal?', top: 700 });
          const A = answers([
            ['hardHat', 'Mantenimiento manda a un operario a cambiar una batería que, para Viajes, <b>está bien</b>', 'plain'],
            ['phone', 'La app ofrece un scooter que <b>ya no puede salir</b>', 'plain'],
          ], { top: 680 });
          $('#pi-a').appendChild(A.box);
          const glow1 = K.el('span', 'on on--danger pop', null, $('#pi-c2'));
          const glow2 = K.el('span', 'on on--danger pop', null, $('#pi-c1'));
          // the single source: both services read the same value
          const n1 = node($('#pi-nodes'), { x: 300, y: 620, w: 400, h: 100, icon: 'route', title: 'Viajes', sub: 'lee: 8 %', tone: 'user' });
          const n2 = node($('#pi-nodes'), { x: 1220, y: 620, w: 400, h: 100, icon: 'wrench', title: 'Mantenimiento', sub: 'lee: 8 %', tone: 'user' });
          const w1 = wire($('#pi-w'), [860, 520], n1.t, 'wire--evt');
          const w2 = wire($('#pi-w'), [1060, 520], n2.t, 'wire--evt');

          // two services, each with its own copy of the same scooter's battery
          pop(W(0, 'Imagina') - 0.1, '#pi-h', { y: 12 });
          pop(W(0, 'viajes') - 0.2, '#pi-c1', { y: 18 });
          pop(W(0, 'mantenimiento') - 0.2, '#pi-c2', { y: 18 });
          pop(W(0, 'scooter') - 0.2, '#pi-sc', { s: 0.85, ease: 'back.out(2)' });
          // one processed the last message, the other did not yet
          pop(W(1, 'procesó') - 0.2, '#pi-s2', { y: 8 });
          const pr = { v: 40 };
          tl.fromTo(pr, { v: 40 }, { v: 8, duration: 0.9, ease: 'power2.out', onUpdate: () => ($('#pi-v2').textContent = Math.round(pr.v) + ' %') }, W(1, 'procesó'));
          tl.fromTo('#pi-f2', { width: '40%', backgroundColor: '#3fd694' }, { width: '8%', backgroundColor: '#ff6b7a', duration: 0.9, ease: 'power2.out' }, W(1, 'procesó'));
          pop(W(1, 'todavía') - 0.2, '#pi-s1', { y: 8 });
          // what can go wrong? (the ring empties over the silence)
          pop(W(1, 'Qué') - 0.2, Q.q, { y: 14 });
          ring(LE(1), Q.arc, Math.max(1, L(2) - LE(1) - 0.4));
          // the answer: a wasted trip, a scooter that cannot leave
          hide(L(2) - 0.4, Q.box);
          pop(W(2, 'operario') - 0.3, A.rows[0], { y: 10 });
          pop(W(2, 'operario') - 0.3, glow1, { y: 0, s: 1 });
          pop(W(2, 'app') - 0.3, A.rows[1], { y: 10 });
          pop(W(2, 'app') - 0.3, glow2, { y: 0, s: 1 });
          // with one source, both decisions read the same value
          hide(L(3) - 0.4, '#pi-a');
          pop(L(3) - 0.1, '#pi-h2', { y: 12 });
          pop(W(3, 'fuente') - 0.2, '#pi-one', { y: 16 });
          pop(W(3, 'decisiones') - 0.2, [n1.e, n2.e], { y: 12, st: 0.1 });
          draw(W(3, 'decisiones'), w1.p);
          draw(W(3, 'decisiones') + 0.1, w2.p);
          pop(W(3, 'mismo') - 0.3, '#pi-same', { y: 10 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
