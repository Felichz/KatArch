<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #alcance .srca { position: absolute; left: 160px; top: 240px; }
        #alcance .four { position: absolute; left: 160px; top: 290px; }
        #alcance .blk { position: absolute; top: 340px; width: 382px; height: 320px; padding: 26px 26px; gap: 14px; }
        #alcance .blk .tc__t { font-size: 31px; }
        #alcance .blk .tc__b { font-size: 24px; }
        #alcance .blk .tc__ic { width: 58px; height: 58px; }
        #alcance .base { position: absolute; left: 160px; top: 696px; width: 1600px; height: 150px; display: flex; flex-direction: row; align-items: center; gap: 24px; padding: 0 34px; border-style: dashed; }
        #alcance .base .tc__t { font-size: 34px; }
        #alcance .base .tc__b { font-size: 22px; }
        #alcance .verbs { margin-left: auto; display: flex; gap: 14px; }
        #alcance .verbs .chip { position: relative; height: 52px; font-size: 24px; }
        #alcance .readme { position: absolute; left: 160px; top: 240px; }
        #alcance .first { position: absolute; left: 566px; top: 284px; height: 44px; font-size: 21px; }
        #alcance .prob { position: absolute; left: 0; right: 0; top: 232px; display: flex; justify-content: center; }
        #alcance .prob .chip { position: relative; height: 56px; font-size: 25px; padding: 0 24px; }
        #alcance .on--amb { border-color: var(--amber); background: rgba(255, 200, 97, 0.05); box-shadow: 0 0 46px rgba(255, 200, 97, 0.26); }
        #alcance .cons { position: absolute; left: 0; right: 0; top: 876px; display: flex; justify-content: center; gap: 20px; }
        #alcance .cons .chip { position: relative; height: 54px; font-size: 24px; }
      </style>
      <div id="alcance" class="scene" data-composition-id="alcance" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="hd pop" id="al-h" style="top: 150px">Lo que el equipo <span>iba a diseñar</span></div>
        <span class="tag pop srca" id="al-src" data-icon="file"></span>
        <span class="tag tag--accent pop four" id="al-4" data-icon="sparkles"></span>
        <div class="tc tc--accent pop blk" id="al-b1" style="left: 160px"><div class="tc__hd"><span class="tc__ic" data-icon="botMsg"></span><span class="tc__n">Área 1</span></div><span class="tc__t">Un asistente</span><span class="tc__b">dentro de la app: el chatbot del capítulo 1</span></div>
        <div class="tc tc--accent pop blk" id="al-b2" style="left: 566px"><span class="on on--amb pop" id="al-on2"></span><div class="tc__hd"><span class="tc__ic" data-icon="tag"></span><span class="tc__n">Área 2</span></div><span class="tc__t">Precios dinámicos</span><span class="tc__b">el precio cambia según la demanda, el clima o la competencia</span></div>
        <div class="tc tc--accent pop blk" id="al-b3" style="left: 972px"><span class="on on--danger pop" id="al-on3"></span><div class="tc__hd"><span class="tc__ic" data-icon="lineChart"></span><span class="tc__n">Área 3</span></div><span class="tc__t">Pronóstico de demanda</span><span class="tc__b">dónde se van a necesitar vehículos</span></div>
        <div class="tc tc--accent pop blk" id="al-b4" style="left: 1378px"><span class="on on--danger pop" id="al-on4"></span><div class="tc__hd"><span class="tc__ic" data-icon="wrench"></span><span class="tc__n">Área 4</span></div><span class="tc__t">Optimización del mantenimiento</span><span class="tc__b">las baterías, los traslados, las tareas de los operarios</span></div>
        <div class="tc tc--ext pop base" id="al-base">
          <span class="tc__ic" data-icon="key"></span>
          <div><div class="tc__t">Lo básico del alquiler</div><div class="tc__b">alguien tenía que mantenerlo funcionando</div></div>
          <div class="verbs"><span class="chip pop" id="al-v1" data-icon="calendar"></span><span class="chip pop" id="al-v2" data-icon="unlock"></span><span class="chip pop" id="al-v3" data-icon="card"></span><span class="chip pop" id="al-v4" data-icon="parking"></span></div>
        </div>
        <span class="tag pop readme" id="al-rd" data-icon="commit"></span>
        <span class="chip pop first" id="al-1st" data-icon="flag" style="border-color: rgba(255, 200, 97, 0.55); color: var(--amber)"></span>
        <div class="prob"><span class="chip chip--danger pop" id="al-p" data-icon="landmark"></span></div>
        <svg class="wires" id="al-w"></svg>
        <div class="cons"><span class="chip pop" id="al-d" data-icon="brain" style="border-color: rgba(255, 200, 97, 0.55); color: var(--amber)"></span><span class="chip chip--accent pop" id="al-c" data-icon="arrowRight"></span></div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('alcance');
          const { tl, W, L, LE, pop, hide, dim, fade, to, wire, $ } = K;
          [['#al-src', 'README del equipo · Objective'], ['#al-4', 'encima: cuatro áreas con IA'], ['#al-v1', 'reservar'], ['#al-v2', 'abrir'], ['#al-v3', 'pagar'], ['#al-v4', 'devolver'], ['#al-rd', 'página principal del repositorio · miércoles 15 · 57b8370 · tres áreas'], ['#al-1st', 'iban primero; el cliente nunca los mencionó como problema'], ['#al-p', 'El problema del monumento: sin un área propia'], ['#al-d', 'deducción nuestra, no del repositorio'], ['#al-c', 'ese lugar secundario va a tener consecuencias']].forEach(([s, t]) => $(s).insertAdjacentHTML('beforeend', t));
          // the client's biggest challenge, spread between forecasting and maintenance
          const l3 = wire($('#al-w'), [1140, 288], [1163, 340], 'wire--danger');
          const l4 = wire($('#al-w'), [1240, 288], [1569, 340], 'wire--danger');
          const blocks = ['#al-b1', '#al-b2', '#al-b3', '#al-b4'];

          // with goals and assumptions in place: what to design
          pop(L(0), '#al-h', { y: 12 });
          pop(W(0, 'diseñar') - 0.2, '#al-src', { y: 6 });
          // first, the rental basics someone had to keep running
          pop(W(0, 'basico') - 0.2, '#al-base', { y: 18 });
          pop(W(0, 'reservar') - 0.1, '#al-v1', { s: 0.9 });
          pop(W(0, 'abrir') - 0.1, '#al-v2', { s: 0.9 });
          pop(W(0, 'pagar') - 0.1, '#al-v3', { s: 0.9 });
          pop(W(0, 'devolver') - 0.1, '#al-v4', { s: 0.9 });
          // on top, four AI areas
          pop(W(1, 'cuatro') - 0.2, '#al-4', { y: 6 });
          pop(W(1, 'asistente') - 0.2, blocks[0], { y: 24 });
          pop(W(2, 'precios') - 0.2, blocks[1], { y: 24 });
          pop(W(2, 'pronostico') - 0.2, blocks[2], { y: 24 });
          pop(W(3, 'optimizacion') - 0.2, blocks[3], { y: 24 });
          // the list already had an order before the goals
          hide(W(4, 'orden') - 0.2, ['#al-src', '#al-4']);
          // Wednesday 15, the repository's main page: three areas, dynamic pricing first
          pop(W(5, 'miercoles') - 0.2, '#al-rd', { y: 6 });
          fade(W(5, 'precios') - 0.2, '#al-on2', 0.4);
          dim(W(5, 'precios') - 0.2, [blocks[0], blocks[2], blocks[3]], 0.4);
          pop(W(5, 'primero') - 0.2, '#al-1st', { y: 6 });
          // the monument problem had no area of its own: spread over forecasting and maintenance
          hide(L(6) - 0.3, ['#al-rd', '#al-1st']);
          to(L(6) - 0.3, '#al-on2', { opacity: 0, duration: 0.4 });
          to(L(6) - 0.3, [blocks[0], blocks[2], blocks[3]], { opacity: 1, duration: 0.4 });
          pop(W(6, 'monumento') - 0.3, '#al-p', { y: 10 });
          fade(W(6, 'repartido') - 0.2, [l3.p, l4.p], 0.4);
          fade(W(6, 'pronostico') - 0.2, '#al-on3', 0.4);
          fade(W(6, 'mantenimiento') - 0.2, '#al-on4', 0.4);
          dim(W(6, 'repartido') - 0.2, [blocks[0], blocks[1]], 0.4);
          // our deduction; that secondary place will have consequences
          pop(W(6, 'deducimos') - 0.2, '#al-d', { y: 8 });
          pop(W(7, 'consecuencias') - 0.3, '#al-c', { y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
