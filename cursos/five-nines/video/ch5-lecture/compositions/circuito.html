<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #circuito .person { border-color: rgba(255, 200, 97, 0.55); }
        #circuito .person .node__ic { background: var(--amber-soft); color: var(--amber); }
        #circuito .ex { position: absolute; left: 560px; top: 250px; width: 380px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
        #circuito .ex__i { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 640; color: var(--text2); }
        #circuito .ex__i svg { width: 34px; height: 34px; color: var(--text2); flex: none; }
        #circuito .ex__ai { position: relative; align-self: flex-start; font-size: 26px; font-weight: 700; color: var(--danger); padding: 0 6px; }
        #circuito .ex__ai .cross { left: 0; right: 0; }
        #circuito .ex__fix { font-size: 26px; font-weight: 720; color: var(--amber); }
        #circuito .ex__lab { align-self: flex-start; }
        #circuito .ex__lab.chip { position: relative; height: 40px; font-size: 19px; }
        #circuito .dupe { top: 470px; }
        #circuito .dupe .chip { height: 56px; font-size: 25px; padding: 0 24px; }
        #circuito .dupe .chip svg { width: 26px; height: 26px; }
        #circuito .agree { top: 570px; }
        #circuito .agree .tc { padding: 24px 30px; gap: 10px; }
        #circuito .src { top: 836px; }
      </style>
      <div id="circuito" class="scene" data-composition-id="circuito" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="ci-flow">
          <svg class="wires" id="ci-w" viewBox="0 0 1920 1080"></svg>
          <div class="card ex pop" id="ci-ex">
            <span class="ex__i"><span data-icon="image"></span>Foto de una devolución</span>
            <span class="ex__ai pop" id="ci-ai">El modelo dijo: sucia<span class="cross" id="ci-x"></span></span>
            <span class="ex__fix pop" id="ci-fix">La persona corrige: limpia</span>
            <span class="chip chip--evt ex__lab pop" id="ci-lab" data-icon="tag"></span>
          </div>
          <div class="row dupe"><span class="chip chip--cmp pop" id="ci-dupe" data-icon="trendDown"></span></div>
        </div>
        <div class="layer" id="ci-agree">
          <div class="cards cards--2 agree">
            <div class="tc tc--evt pop" id="ci-a1"><div class="tc__hd"><span class="tc__ic" data-icon="users"></span><span class="tc__t">Dos revisores coinciden</span></div><span class="tc__b">La etiqueta es <b>confiable</b>.</span></div>
            <div class="tc tc--danger pop" id="ci-a2"><div class="tc__hd"><span class="tc__ic" data-icon="alert"></span><span class="tc__t">No se ponen de acuerdo</span></div><span class="tc__b">El problema está en el <b>criterio</b>, no en el modelo.</span><span class="tc__b pop" id="ci-cf">Entrenar con esas etiquetas solo <b>enseñaría confusión</b>.</span></div>
          </div>
          <div class="src pop" id="ci-src">ADR-0016 · medir si los revisores coinciden entre sí</div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('circuito');
          const { tl, W, L, LE, pop, fade, to, hide, dim, draw, node, wire, stream, $ } = K;
          $('#ci-lab').insertAdjacentHTML('beforeend', 'ejemplo nuevo, etiquetado');
          $('#ci-dupe').insertAdjacentHTML('beforeend', 'la versión siguiente duda menos en esos casos');
          const rev = node($('#ci-flow'), { x: 140, y: 290, w: 340, h: 110, tone: 'phys', icon: 'users', title: 'Una persona', sub: 'revisa lo dudoso' });
          rev.e.classList.add('person');
          const ds = node($('#ci-flow'), { x: 1020, y: 290, w: 340, h: 110, tone: 'cmp', icon: 'db', title: 'Datos', sub: 'de entrenamiento' });
          const v2 = node($('#ci-flow'), { x: 1440, y: 290, w: 340, h: 110, tone: 'cmp', icon: 'scanEye', title: 'Modelo v2', sub: 'vuelve a entrenarse' });
          const w1 = wire($('#ci-w'), rev.r, [560, 345], 'wire--evt');
          const w2 = wire($('#ci-w'), [940, 345], ds.l, 'wire--evt');
          const w3 = wire($('#ci-w'), ds.r, v2.l, 'wire--evt');

          // each time the reviewer corrects the model
          pop(W(0, 'persona') - 0.2, rev.e, { y: 12 });
          pop(W(0, 'corrige') - 0.3, '#ci-ex', { y: 16 });
          pop(W(0, 'corrige') - 0.1, '#ci-ai', { y: 6 });
          draw(W(0, 'corrige') - 0.1, w1.p);
          // the correction is kept as a new, well-labeled example
          tl.fromTo('#ci-x', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power2.out' }, W(0, 'correccion'));
          pop(W(0, 'correccion'), '#ci-fix', { y: 6 });
          pop(W(0, 'ejemplo') - 0.1, '#ci-lab', { s: 0.85, ease: 'back.out(2)' });
          draw(W(0, 'etiquetado') - 0.1, w2.p);
          pop(W(0, 'etiquetado'), ds.e, { y: 12 });
          // those examples retrain the model: the next version doubts less there
          draw(W(1, 'entrenar') - 0.2, w3.p);
          pop(W(1, 'entrenar'), v2.e, { y: 12 });
          stream($('#ci-w'), w3, W(1, 'entrenar'), LE(1) + 0.5, { color: '#3fd694', every: 1.4, travel: 1.1 });
          pop(W(1, 'duda') - 0.1, '#ci-dupe', { s: 0.85, ease: 'back.out(2)' });
          // do the reviewers agree with each other?
          pop(W(2, 'revisores') - 0.1, '#ci-a1', { y: 18 });
          pop(W(2, 'revisores') + 0.1, '#ci-src', { y: 6 });
          pop(W(2, 'acuerdo') - 0.2, '#ci-a2', { y: 18 });
          pop(L(3) - 0.1, '#ci-cf', { y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
