<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #outro .recap { top: 200px; }
        #outro .rc__t .chip { position: relative; height: 44px; font-size: 22px; vertical-align: middle; margin: 4px 6px 4px 0; }
        #outro .rc__t .chip svg { width: 22px; height: 22px; }
        #outro .snap { position: absolute; left: 0; right: 0; top: 230px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
        #outro .snap__ic { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--surface2); border: 1.5px solid var(--line-strong); color: var(--text); box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45); }
        #outro .snap__ic svg { width: 58px; height: 58px; }
        #outro .snap__d { font-family: var(--mono); font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
        #outro .snap__t { font-size: 64px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
        #outro .snap__row { display: flex; gap: 20px; margin-top: 18px; }
        #outro .snap__row .chip { position: relative; height: 68px; font-size: 30px; padding: 0 30px; }
        #outro .snap__row .chip svg { width: 30px; height: 30px; }
      </style>
      <div id="outro" class="scene" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="snap" id="ou-snap">
          <span class="snap__ic pop" id="ou-ic" data-icon="camera"></span>
          <span class="snap__d pop" id="ou-d">23 de octubre</span>
          <span class="snap__t pop" id="ou-t">La foto del repositorio</span>
          <div class="snap__row">
            <span class="chip chip--evt pop" id="ou-s1" data-icon="award"></span>
            <span class="chip chip--accent pop" id="ou-s2" data-icon="clapper"></span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('outro');
          const { W, L, pop, hide, $, recap, next } = K;
          $('#ou-s1').insertAdjacentHTML('beforeend', 'pasó a la semifinal');
          $('#ou-s2').insertAdjacentHTML('beforeend', 'contarlo todo en 5 minutos');
          const R = recap([
            ['link', 'Atarse a un proveedor es válido, <b>si escribes su precio</b>.'],
            ['shieldAlert', 'Desde el 20 de octubre, <b>cada ADR trae su tabla de riesgos</b>.'],
            ['door', `Las salidas: <span class="chip chip--evt pop" id="ou-x1" style="position: relative">${K.IC.map}alternativas deterministas</span><span class="chip chip--evt pop" id="ou-x2" style="position: relative">${K.IC.package}modelos portables</span><span class="chip chip--accent pop" id="ou-x3" style="position: relative">${K.IC.split}un intermediario</span>`],
          ], { top: 200 });
          const N = next({ k: 'Capítulo 8', t: 'Contar la arquitectura', top: 360 });

          // the three ideas, one row each
          pop(L(0), R.k, { y: 10 });
          pop(W(0, 'Atarse') - 0.2, R.rows[0], { y: 14, s: 0.98 });
          pop(W(1, 'Desde') - 0.2, R.rows[1], { y: 14, s: 0.98 });
          pop(W(2, 'salidas') - 0.3, R.rows[2], { y: 14, s: 0.98 });
          pop(W(2, 'deterministas') - 0.3, '#ou-x1', { s: 0.9 });
          pop(W(2, 'portables') - 0.3, '#ou-x2', { s: 0.9 });
          pop(W(2, 'intermediario') - 0.3, '#ou-x3', { s: 0.9 });
          // 23 October: the repository snapshot; on to the semifinal, in 5 minutes
          hide(L(3) - 0.5, R.box, 0.5);
          pop(W(3, '23') - 0.2, '#ou-ic', { s: 0.6, ease: 'back.out(2)' });
          pop(W(3, '23'), '#ou-d', { y: 10 });
          pop(W(3, 'foto') - 0.2, '#ou-t', { y: 18 });
          pop(W(3, 'semifinal') - 0.3, '#ou-s1', { s: 0.9 });
          pop(W(3, 'contar') - 0.2, '#ou-s2', { s: 0.9 });
          // next chapter
          hide(L(4) - 0.5, '#ou-snap', 0.5);
          pop(L(4) - 0.1, N.k, { y: 16 });
          pop(W(4, 'contar') - 0.2, N.t, { y: 36, d: 0.9, ease: 'expo.out' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
