<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #salidas .hd { top: 118px; font-size: 50px; }
        #salidas .bld { position: absolute; left: 160px; top: 210px; width: 560px; height: 630px; border-radius: 24px; border: 2.5px solid var(--line-strong); background: rgba(23, 29, 38, 0.5); }
        #salidas .bld__k { position: absolute; left: 30px; top: 26px; font-family: var(--mono); font-size: 19px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
        #salidas .bld__p { position: absolute; left: 30px; right: 90px; display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 20px; border-radius: 14px; border: 1.5px dashed var(--line-strong); background: #12161c; font-size: 26px; font-weight: 650; color: var(--text2); }
        #salidas .bld__p svg { width: 28px; height: 28px; color: var(--text3); }
        #salidas .door { position: absolute; left: 690px; width: 62px; height: 120px; border-radius: 10px 10px 0 0; display: grid; place-items: center; background: var(--surface3); border: 2.5px solid var(--line-strong); color: var(--text3); }
        #salidas .door svg { width: 32px; height: 32px; }
        #salidas .door--on { background: var(--evt-soft); border-color: var(--evt); color: var(--evt); box-shadow: 0 0 40px rgba(63, 214, 148, 0.4); }
        #salidas .dc { position: absolute; left: 820px; width: 960px; min-height: 176px; }
        #salidas .dc .tc__t { font-size: 32px; }
        #salidas .dc .tc__b { font-size: 25px; }
        #salidas .dc .tc__ft { position: absolute; right: 26px; top: 26px; margin: 0; }
        #salidas .wall { position: absolute; left: 1260px; top: 300px; width: 44px; height: 440px; border-radius: 8px; background: repeating-linear-gradient(0deg, #334053 0 34px, #242d3a 34px 38px); border: 2px solid #4a5568; }
        #salidas .ptag { position: absolute; left: 400px; top: 470px; display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 28px; border-radius: 16px; background: var(--danger-soft); border: 2px solid var(--danger); color: var(--danger); font-family: var(--sans); font-size: 30px; font-weight: 720; letter-spacing: 0; text-transform: none; white-space: nowrap; }
        #salidas .ptag svg { width: 32px; height: 32px; }
        #salidas .stamp { left: 860px; top: 640px; }
      </style>
      <div id="salidas" class="scene" data-composition-id="salidas" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="hd pop" id="sa-h1">Escribir el riesgo no alcanza: <span>hay que dejar puertas</span></div>
        <div class="hd pop" id="sa-h2">Ninguna puerta es <span>gratis</span></div>
        <div class="layer" id="sa-main">
          <div class="bld pop" id="sa-bld">
            <span class="bld__k">Tu sistema, sobre Google Cloud</span>
            <div class="bld__p" style="top: 110px"><span data-icon="sparkles"></span>Gemini</div>
            <div class="bld__p" style="top: 200px"><span data-icon="map"></span>Google Maps</div>
            <div class="bld__p" style="top: 290px"><span data-icon="brain"></span>Vertex AI</div>
          </div>
          <span class="door pop" id="sa-d0" style="top: 250px" data-icon="door"></span>
          <span class="door pop" id="sa-d1" style="top: 460px" data-icon="door"></span>
          <span class="door pop" id="sa-d2" style="top: 670px" data-icon="door"></span>
          <div class="tc tc--evt dc pop" id="sa-c0" style="top: 222px">
            <div class="tc__hd"><span class="tc__ic" data-icon="map"></span><span class="tc__t">Gemini → la API tradicional de Maps</span></div>
            <span class="tc__b">Si Gemini falla o cambia, las funciones críticas de mapas vuelven a ella. <b>Es determinista.</b></span>
            <div class="tc__ft"><span class="chip">ADR-0004</span></div>
          </div>
          <div class="tc tc--evt dc pop" id="sa-c1" style="top: 432px">
            <div class="tc__hd"><span class="tc__ic" data-icon="messages"></span><span class="tc__t">Opiniones: Gemini → un modelo propio más chico</span></div>
            <span class="tc__b">Si Gemini <b>sube mucho de precio</b>, se cambia.</span>
            <div class="tc__ft"><span class="chip">escenario de opiniones</span></div>
          </div>
          <div class="tc tc--evt dc pop" id="sa-c2" style="top: 642px">
            <div class="tc__hd"><span class="tc__ic" data-icon="package"></span><span class="tc__t">Modelos propios: exportables y portables</span></div>
            <span class="tc__b">Para poder <b>llevarlos a otra plataforma</b>.</span>
            <div class="tc__ft"><span class="chip">ADR-0003 · ADR-0014</span></div>
          </div>
        </div>
        <div class="layer" id="sa-none">
          <span class="wall pop" id="sa-wall"></span>
          <span class="ptag pop" id="sa-tag"></span>
          <span class="stamp stamp--danger pop" id="sa-st" data-icon="ban"></span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('salidas');
          const { tl, W, L, pop, to, hide, dim, $ } = K;
          $('#sa-tag').innerHTML = `${K.IC.trendUp}El proveedor sube el precio`;
          $('#sa-st').insertAdjacentHTML('beforeend', 'Sin opciones');
          const doors = ['#sa-d0', '#sa-d1', '#sa-d2'], cards = ['#sa-c0', '#sa-c1', '#sa-c2'];
          const lit = (t, k) => { to(t, doors[k], { backgroundColor: '#11342a', borderColor: '#3fd694', color: '#3fd694', boxShadow: '0 0 40px rgba(63,214,148,0.4)', duration: 0.4 }); pop(t + 0.1, cards[k], { y: 16 }); };

          // write the risk, then leave doors
          pop(L(0), '#sa-h1', { y: 12 });
          pop(W(0, 'riesgo') - 0.1, '#sa-bld', { y: 16, s: 0.98 });
          pop(W(0, 'puertas') - 0.2, doors, { st: 0.12, y: 10 });
          // one door per line
          lit(W(1, 'Primera') - 0.1, 0);
          lit(W(2, 'Segunda') - 0.1, 1);
          lit(W(3, 'Tercera') - 0.1, 2);
          // none is free; without them, a price rise hits a wall
          hide(L(4) - 0.4, '#sa-h1', 0.4);
          pop(L(4) - 0.1, '#sa-h2', { y: 12 });
          dim(W(4, 'sin') - 0.3, '#sa-main', 0.1);
          pop(W(4, 'sin') - 0.1, '#sa-wall', { y: 0, s: 0.9 });
          pop(W(4, 'suba') - 0.2, '#sa-tag', { y: 0, s: 0.95 });
          tl.to('#sa-tag', { x: 340, duration: 1.1, ease: 'power2.in' }, W(4, 'suba') + 0.2);
          tl.to('#sa-tag', { x: 316, duration: 0.3, ease: 'power2.out' }, W(4, 'suba') + 1.3);
          pop(W(4, 'opciones') - 0.4, '#sa-st', { s: 0.6, ease: 'back.out(2)' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
