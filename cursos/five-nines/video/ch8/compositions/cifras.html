<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #cifras .sa { left: 200px; top: 270px; width: 840px; }
        #cifras .sb { left: 880px; top: 420px; width: 840px; border-color: rgba(255, 122, 69, 0.55); }
        #cifras .sb .sheet__bar { color: var(--accent-text); }
        #cifras .mr { position: relative; display: flex; align-items: center; gap: 18px; min-height: 70px; padding: 8px 20px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); font-size: 28px; font-weight: 640; }
        #cifras .mr > svg { width: 30px; height: 30px; flex: none; color: var(--text2); }
        #cifras .mr__v { margin-left: auto; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 28px; font-weight: 800; color: var(--text3); }
        #cifras .blank { display: inline-block; width: 74px; height: 38px; border-radius: 8px; border: 2px dashed var(--line-strong); }
        #cifras .mr--hi .mr__v { color: var(--accent); font-size: 34px; }
        #cifras .stw { position: absolute; left: 1080px; top: 640px; }
        #cifras .stw .stamp { position: relative; }
        #cifras .mt { top: 270px; }
        #cifras .vc { position: absolute; top: 370px; width: 600px; height: 240px; padding: 30px 34px; display: flex; flex-direction: column; gap: 18px; }
        #cifras .vc__k { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 19px; color: var(--text2); }
        #cifras .vc__k svg { width: 24px; height: 24px; color: var(--text3); }
        #cifras .vc__v { font-family: var(--mono); font-size: 52px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); white-space: nowrap; }
        #cifras .vc__s { font-size: 24px; color: var(--text3); font-weight: 540; }
        #cifras .neq { position: absolute; left: 960px; top: 490px; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; display: grid; place-items: center; background: var(--danger-soft); border: 2.5px solid var(--danger); color: var(--danger); }
        #cifras .neq svg { width: 52px; height: 52px; }
        #cifras .k2 { left: 140px; top: 170px; }
        #cifras .dr { top: 230px; }
        #cifras .dr .tc { height: 330px; }
        #cifras .dr .tc__t { font-size: 34px; }
        #cifras .dr .tc__b { font-size: 24px; }
        #cifras .tc--amber { border-color: rgba(255, 200, 97, 0.55); }
        #cifras .tc--amber .tc__ic { background: var(--amber-soft); color: var(--amber); }
        #cifras .dr .tc__ft { flex-direction: column; align-items: flex-start; gap: 8px; }
        #cifras .dr .tc__ft .chip { font-family: var(--mono); font-weight: 700; }
        #cifras .pres { position: absolute; left: 1290px; top: 590px; }
        #cifras .pres .stamp { position: relative; font-size: 22px; }
        #cifras .gt { position: absolute; left: 410px; top: 700px; width: 1100px; padding: 26px 32px; }
        #cifras .gt .tc__t { font-size: 34px; }
      </style>
      <div id="cifras" class="scene" data-composition-id="cifras" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="hd pop" id="ci-h" style="top: 150px">Un punto para mirar <span>con cuidado</span></div>
        <div class="layer" id="ci-a">
          <div class="sheet sa pop" id="ci-sa" data-layout-allow-overlap>
            <div class="sheet__bar"><span data-icon="clapper"></span>video/video-scenario-business-management-5min.md<i>8 nov</i></div>
            <div class="sheet__body">
              <div class="mr pop" id="ci-a1"><span data-icon="car"></span>Utilización<span class="mr__v"><span class="blank"></span>%<span>→</span><span class="blank"></span>%</span></div>
              <div class="mr pop" id="ci-a2"><span data-icon="wrench"></span>Costo por vehículo<span class="mr__v"><span class="blank"></span>€<span>→</span><span class="blank"></span>€</span></div>
            </div>
          </div>
          <div class="sheet sb pop" id="ci-sb" data-layout-allow-overlap>
            <div class="sheet__bar"><span data-icon="msgText"></span>video/narrative.md<i>9 nov</i></div>
            <div class="sheet__body">
              <div class="mr mr--hi pop" id="ci-b1"><span data-icon="car"></span>Utilización<span class="mr__v">+32 %</span></div>
              <div class="mr mr--hi pop" id="ci-b2"><span data-icon="euro"></span>Ingresos por mes<span class="mr__v">+240.000 €</span></div>
            </div>
          </div>
          <div class="stw pop" id="ci-st" data-layout-allow-overlap><span class="stamp stamp--danger" id="ci-stx" data-icon="calculator"></span></div>
        </div>
        <div class="layer" id="ci-b">
          <div class="sub pop mt" id="ci-mt">El mismo dato: <b>costo de mantenimiento por vehículo</b></div>
          <div class="card vc pop" id="ci-v1" style="left: 300px">
            <span class="vc__k"><span data-icon="msgText"></span>texto del video · narrative.md</span>
            <span class="vc__v">78 € → 60 €</span>
            <span class="vc__s">por vehículo</span>
          </div>
          <div class="card vc pop" id="ci-v2" style="left: 1020px">
            <span class="vc__k"><span data-icon="presentation"></span>diapositivas · presentación final</span>
            <span class="vc__v">117,1 € → 79,08 €</span>
            <span class="vc__s">por vehículo y por mes</span>
          </div>
          <span class="neq pop" id="ci-neq" data-icon="notEqual"></span>
        </div>
        <div class="layer" id="ci-c">
          <span class="tag pop k2" id="ci-k2"><span data-icon="history"></span>Capítulo 2 · de dónde sale un número</span>
          <div class="cards cards--3 dr">
            <div class="tc tc--cmd pop" id="ci-d1"><div class="tc__hd"><span class="tc__ic" data-icon="building"></span><span class="tc__t">Dado</span></div><span class="tc__b">lo pone el cliente en el pliego</span></div>
            <div class="tc tc--evt pop" id="ci-d2"><div class="tc__hd"><span class="tc__ic" data-icon="calculator"></span><span class="tc__t">Calculado</span></div><span class="tc__b">sale de una cuenta que cualquiera rehace</span></div>
            <div class="tc tc--amber pop" id="ci-d3"><div class="tc__hd"><span class="tc__ic" data-icon="help"></span><span class="tc__t">Supuesto</span></div><span class="tc__b">se da por cierto para avanzar</span>
              <div class="tc__ft"><span class="chip chip--accent pop" id="ci-f1">+32 % de utilización</span><span class="chip chip--accent pop" id="ci-f2">+240.000 € por mes</span></div>
            </div>
          </div>
          <div class="pres pop" id="ci-pr"><span class="stamp" id="ci-prx" data-icon="presentation"></span></div>
          <div class="tc tc--evt gt pop" id="ci-gt">
            <div class="tc__hd"><span class="tc__ic" data-icon="unlock"></span><span class="tc__t">Las compuertas, en cambio, se sostienen</span></div>
            <span class="tc__b pop" id="ci-gtb">Son <b>reglas</b> que cualquiera puede verificar.</span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('cifras');
          const { W, L, LE, pop, hide, dim, $ } = K;
          $('#ci-stx').insertAdjacentHTML('beforeend', 'sin el cálculo en el repositorio');
          $('#ci-prx').insertAdjacentHTML('beforeend', 'presentados como resultados');

          // a point to look at carefully
          pop(L(0), '#ci-h', { y: 14 });
          // 8 Nov: the script had the figures blank
          pop(L(1) + 0.2, '#ci-sa', { y: 18, s: 0.98 });
          pop(W(1, 'utilización') - 0.3, '#ci-a1', { y: 8 });
          pop(W(1, 'Costo') - 0.3, '#ci-a2', { y: 8 });
          // the next day they appeared
          pop(W(2, 'siguiente') - 0.2, '#ci-sb', { y: 18, s: 0.98 });
          pop(W(2, '32') - 0.3, '#ci-b1', { y: 8 });
          pop(W(2, '240') - 0.3, '#ci-b2', { y: 8 });
          // no calculation behind them
          pop(W(3, 'cálculo') - 0.2, '#ci-st', { s: 1.25, ease: 'back.out(2)' });
          // and the video text and the slides disagree
          hide(W(3, 'texto') - 0.4, ['#ci-a', '#ci-h']);
          pop(W(3, 'texto') - 0.1, '#ci-v1', { y: 16 });
          pop(W(3, 'diapositivas') - 0.1, '#ci-v2', { y: 16 });
          pop(W(3, 'distintas') - 0.1, '#ci-neq', { s: 0.6, ease: 'back.out(2)' });
          pop(W(3, 'mismo') - 0.1, '#ci-mt', { y: 10 });
          // chapter 2's three drawers: given, calculated, assumed
          hide(L(4) - 0.4, '#ci-b');
          pop(L(4) - 0.1, '#ci-k2', { y: 8 });
          pop(W(4, 'dado') - 0.2, '#ci-d1', { y: 16 });
          pop(W(4, 'calculado') - 0.2, '#ci-d2', { y: 16 });
          pop(W(4, 'supuesto') - 0.2, '#ci-d3', { y: 16 });
          pop(W(4, 'Estos') - 0.1, ['#ci-f1', '#ci-f2'], { y: -40, st: 0.25 });
          pop(W(4, 'presentados') - 0.1, '#ci-pr', { s: 1.2, ease: 'back.out(2)' });
          // the gates, by contrast, hold
          dim(L(5) - 0.2, ['#ci-d1', '#ci-d2'], 0.35);
          pop(W(5, 'compuertas') - 0.2, '#ci-gt', { y: 16 });
          pop(W(5, 'reglas') - 0.2, '#ci-gtb', { y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
