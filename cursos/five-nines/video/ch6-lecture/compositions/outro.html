<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #outro .city { position: absolute; left: 330px; width: 1260px; top: 150px; height: 400px; border-radius: 26px; border: 1.5px solid var(--line-strong); background: rgba(17, 22, 29, 0.7); overflow: hidden; }
        #outro .city__grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.04) 2px, transparent 2px); background-size: 90px 90px; }
        #outro .city__k { position: absolute; left: 26px; top: 20px; font-family: var(--mono); font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
        #outro .mon { position: absolute; left: 260px; top: 130px; width: 120px; height: 120px; border-radius: 28px; display: grid; place-items: center; background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent-text); }
        #outro .mon svg { width: 64px; height: 64px; }
        #outro .bk { position: absolute; width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; background: var(--cmp-soft); border: 1.5px solid #4a3f73; color: var(--cmp); z-index: 1; }
        #outro .bk svg { width: 28px; height: 28px; }
        #outro .tg { position: absolute; left: 940px; top: 120px; width: 170px; height: 170px; border-radius: 50%; border: 3px dashed var(--accent); background: rgba(255, 122, 69, 0.06); }
        #outro .tgl { position: absolute; left: 860px; top: 304px; width: 330px; text-align: center; font-family: var(--mono); font-size: 21px; font-weight: 700; color: var(--accent-text); }
        #outro .van { position: absolute; left: 120px; top: 300px; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--cmd-soft); border: 2px solid #2c4677; color: var(--cmd); z-index: 2; }
        #outro .van svg { width: 40px; height: 40px; }
        #outro .vanl { position: absolute; left: 60px; top: 260px; font-size: 20px; font-weight: 600; color: var(--cmd); white-space: nowrap; }
        #outro .cond { position: absolute; left: 330px; width: 1260px; top: 600px; padding: 24px 30px; display: flex; align-items: center; gap: 22px; }
        #outro .cond__ic { flex: none; width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #outro .cond__ic svg { width: 40px; height: 40px; }
        #outro .cond__t { font-size: 32px; font-weight: 680; line-height: 1.3; }
        #outro .cond__t b { font-family: var(--mono); color: var(--accent-text); font-weight: 700; }
        #outro .p1 { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; }
        #outro .p1 .chip { position: relative; height: 56px; font-size: 26px; padding: 0 26px; }
        #outro .meth { top: 430px; font-size: 64px; line-height: 1.15; }
        #outro .gc { position: absolute; left: 560px; width: 800px; top: 300px; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
        #outro .gc__ic { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--cmd-soft); border: 2px solid #2c4677; color: var(--cmd); }
        #outro .gc__ic svg { width: 66px; height: 66px; }
        #outro .gc b { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; }
        #outro .gc small { font-size: 26px; color: var(--text2); font-weight: 560; }
      </style>
      <div id="outro" class="scene" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <!-- A · back to the bikes at the monument -->
        <div class="layer" id="ou-a">
          <div class="city pop" id="ou-city" data-layout-allow-overlap>
            <div class="city__grid"></div>
            <span class="city__k">Las bicicletas del monumento</span>
            <span class="mon" data-icon="landmark"></span>
            <span class="tg pop" id="ou-tg"></span>
            <span class="tgl pop" id="ou-tgl">harán falta mañana temprano</span>
            <div id="ou-bikes"></div>
            <span class="vanl pop" id="ou-vl">cambio de baterías</span>
            <span class="van pop" id="ou-van" data-icon="van"></span>
          </div>
          <div class="card cond pop" id="ou-cond"><span class="cond__ic" data-icon="lock"></span><span class="cond__t">Si el pronóstico falla: error a 24 h <b>&gt; 30 %</b>, <b>4 semanas</b> seguidas → se cambia de modelo</span></div>
        </div>
        <!-- B · the same method as the rest -->
        <div class="layer" id="ou-b">
          <div class="p1"><span class="chip chip--accent pop" id="ou-p1" data-icon="history"></span></div>
          <div class="hd meth pop" id="ou-m">Empezar por lo simple,<br /><span>y escribir cuándo dejar de serlo</span></div>
        </div>
        <!-- C · every piece rests on Google -->
        <div class="layer" id="ou-c">
          <div class="card gc pop" id="ou-gc"><span class="gc__ic" data-icon="cloud"></span><b>Cada pieza, sobre Google</b><small>Google Cloud · Vertex AI · Gemini · Maps</small></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('outro');
          const { W, L, LE, pop, fade, to, hide, el, IC, $, next } = K;
          $('#ou-p1').insertAdjacentHTML('beforeend', 'El problema del monumento · diseñado al final');
          // the pile at the monument; three of them will travel
          const PILE = [[200, 110], [200, 170], [220, 236], [300, 266], [370, 250], [400, 190], [400, 120], [250, 60], [320, 54], [380, 66]];
          const bikes = PILE.map(([x, y]) => { const b = el('span', 'bk pop', IC.bike, $('#ou-bikes')); b.style.left = x + 'px'; b.style.top = y + 'px'; return b; });
          const MOVE = [[3, 950, 228], [4, 1005, 236], [5, 1058, 224]];
          const N = next({ k: 'Próximo · Capítulo 7', t: 'Cuando el proveedor cambia las reglas', q: 'El anfitrión lo había advertido: los precios de la IA iban a subir', top: 300 });

          // the bikes piled at the monument now have a way out
          pop(L(0), '#ou-city', { y: 16, s: 0.98 });
          pop(L(0) + 0.3, bikes, { st: 0.04, s: 0.6, y: 0, ease: 'back.out(2)' });
          // the forecast says where they will be needed early tomorrow
          pop(W(0, 'pronóstico') - 0.2, '#ou-tg', { s: 0.7, y: 0, ease: 'back.out(2)' });
          pop(W(0, 'mañana') - 0.2, '#ou-tgl', { y: 8 });
          // the operator who comes to swap batteries takes them along
          pop(W(0, 'operario') - 0.2, ['#ou-van', '#ou-vl'], { y: 10, st: 0.1 });
          to(W(0, 'operario') + 0.4, '#ou-van', { x: 200, y: -40, duration: 1 });
          to(W(0, 'lleva') - 0.2, '#ou-vl', { opacity: 0, duration: 0.3 });
          to(W(0, 'lleva') - 0.1, '#ou-van', { x: 870, y: -170, duration: 1.4 });
          MOVE.forEach(([i, x, y], k) => to(W(0, 'lleva') + k * 0.12, bikes[i], { x: x - PILE[i][0], y: y - PILE[i][1], duration: 1.4 }));
          // if the forecast starts failing, a written condition decides
          pop(W(1, 'condición') - 0.3, '#ou-cond', { y: 14 });
          // designed last, with the same method as the rest
          hide(L(2) - 0.4, '#ou-a');
          pop(W(2, 'final') - 0.2, '#ou-p1', { y: 10 });
          pop(W(2, 'simple') - 0.3, '#ou-m', { y: 16 });
          // every piece rests on the same provider
          hide(L(3) - 0.4, '#ou-b');
          pop(W(3, 'proveedor') - 0.2, '#ou-gc', { y: 18, s: 0.97 });
          // next chapter: the host had warned that AI prices would go up
          hide(W(3, 'anfitrión') - 0.5, '#ou-c');
          pop(W(3, 'anfitrión') - 0.1, N.k, { y: 16 });
          pop(W(3, 'anfitrión') + 0.2, N.t, { y: 36, d: 0.9, ease: 'expo.out' });
          pop(W(3, 'precios') - 0.2, N.q, { y: 14 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
