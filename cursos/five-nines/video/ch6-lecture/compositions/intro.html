<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #intro .cm { left: 330px; top: 150px; width: 1260px; }
        #intro .cm__b { display: flex; align-items: center; gap: 26px; padding: 30px 34px; }
        #intro .cm__h { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--amber); flex: none; }
        #intro .cm__m { font-family: var(--mono); font-size: 34px; white-space: nowrap; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
        #intro .cm__t { margin-left: auto; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent-text); flex: none; }
        #intro .cm__t svg { width: 28px; height: 28px; }
        #intro .tl { position: absolute; left: 330px; width: 1260px; top: 470px; height: 420px; }
        #intro .tl__k { position: absolute; left: 0; top: 0; font-family: var(--mono); font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
        #intro .tl__bar { position: absolute; left: 0; right: 0; top: 250px; height: 4px; border-radius: 2px; background: var(--line-strong); }
        #intro .tl__d { position: absolute; top: 240px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--surface3); border: 3px solid var(--line-strong); }
        #intro .tl__l { position: absolute; top: 284px; font-family: var(--mono); font-size: 20px; color: var(--text3); transform: translateX(-50%); white-space: nowrap; }
        #intro .span { position: absolute; top: 244px; height: 16px; border-radius: 8px; background: var(--cmp); box-shadow: 0 0 22px rgba(182, 155, 255, 0.45); }
        #intro .spl { position: absolute; top: 330px; width: 420px; text-align: center; font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--cmp); }
        #intro .scs { position: absolute; top: 70px; width: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        #intro .scs .chip { position: relative; justify-content: center; }
        #intro .mk { position: absolute; top: 236px; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 26px rgba(255, 122, 69, 0.7); }
        #intro .mk--adr { border-radius: 8px; }
        #intro .mkl { position: absolute; top: 330px; width: 160px; margin-left: -80px; text-align: center; font-family: var(--mono); font-size: 19px; font-weight: 700; line-height: 1.3; color: var(--accent-text); }
        #intro .last { position: absolute; top: 166px; left: 952px; width: 300px; display: flex; justify-content: center; }
        #intro .last .chip { position: relative; }
        #intro .cam { position: absolute; top: 70px; right: -40px; }
        #intro .city { position: absolute; left: 330px; width: 1260px; top: 150px; height: 400px; border-radius: 26px; border: 1.5px solid var(--line-strong); background: rgba(17, 22, 29, 0.7); overflow: hidden; }
        #intro .city__grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.04) 2px, transparent 2px); background-size: 90px 90px; }
        #intro .mon { position: absolute; left: 560px; top: 120px; width: 130px; height: 130px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent-text); }
        #intro .mon svg { width: 70px; height: 70px; }
        #intro .mong { position: absolute; left: 560px; top: 120px; width: 130px; height: 130px; border-radius: 30px; box-shadow: 0 0 70px rgba(255, 122, 69, 0.6); }
        #intro .bk { position: absolute; width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; background: var(--cmp-soft); border: 1.5px solid #4a3f73; color: var(--cmp); }
        #intro .bk svg { width: 28px; height: 28px; }
        #intro .empty { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 2px dashed var(--line-strong); display: grid; place-items: center; font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--text3); }
        #intro .p1 { position: absolute; left: 0; right: 0; top: 590px; display: flex; justify-content: center; }
        #intro .p1 .chip { position: relative; height: 62px; font-size: 30px; padding: 0 30px; }
        #intro .p1 .chip svg { width: 30px; height: 30px; }
        #intro .jq { top: 720px; font-size: 50px; }
      </style>
      <div id="intro" class="scene" data-composition-id="intro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <!-- A · the last scenario in the history -->
        <div class="layer" id="in-a">
          <div class="sheet cm pop" id="in-cm">
            <div class="sheet__bar"><span data-icon="commit"></span>git log · hld/scenarios<i>commit 34760da</i></div>
            <div class="cm__b">
              <span class="cm__h">34760da</span>
              <span class="cm__m pop" id="in-msg">Add demand forecasting scenario</span>
              <span class="cm__t pop" id="in-when" data-icon="clock"></span>
            </div>
          </div>
          <div class="tl pop" id="in-tl" data-layout-allow-overlap>
            <span class="tl__k">El historial del repositorio · 15 al 23 de octubre</span>
            <span class="tl__bar"></span>
            <div id="in-days"></div>
            <span class="span pop" id="in-span"></span>
            <span class="spl pop" id="in-spl">vie 17 → dom 19</span>
            <div class="scs" id="in-scs"></div>
            <span class="mk pop" id="in-m22"></span>
            <span class="mkl pop" id="in-l22">pronóstico<br />19:57</span>
            <span class="mk mk--adr pop" id="in-m23"></span>
            <span class="mkl pop" id="in-l23">ADR-0022<br />00:03</span>
            <div class="last"><span class="chip chip--accent pop" id="in-last" data-icon="lineChart"></span></div>
            <span class="chip pop cam" id="in-cam" data-icon="camera"></span>
          </div>
        </div>
        <!-- B · the client's biggest challenge: the pile at the monument -->
        <div class="layer" id="in-b">
          <div class="city pop" id="in-city">
            <div class="city__grid"></div>
            <span class="mong pop" id="in-mg"></span>
            <span class="mon" data-icon="landmark"></span>
            <div id="in-bikes"></div>
            <div id="in-empty"></div>
          </div>
          <div class="p1"><span class="chip chip--accent pop" id="in-p1" data-icon="landmark"></span></div>
          <div class="hd jq pop" id="in-jq">¿La IA resuelve <span>un problema real</span>?</div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('intro');
          const { W, L, LE, pop, fade, hide, el, IC, $, title } = K;
          $('#in-when').insertAdjacentHTML('beforeend', 'mié 22 oct · 19:57');
          $('#in-p1').insertAdjacentHTML('beforeend', 'Problema n.º 1 · el mayor desafío del cliente');
          $('#in-last').insertAdjacentHTML('beforeend', 'el último escenario');
          $('#in-cam').insertAdjacentHTML('beforeend', 'foto del repositorio · 23 oct');
          // 15 to 23 October, one dot a day
          const X = (d) => ((d - 15) / 8) * 1260;
          for (let d = 15; d <= 23; d++) {
            el('span', 'tl__d', null, $('#in-days')).style.left = X(d) + 'px';
            const l = el('span', 'tl__l', `${d} oct`, $('#in-days')); l.style.left = X(d) + 'px';
          }
          const sp = $('#in-span'); sp.style.left = X(17) - 8 + 'px'; sp.style.width = X(19) - X(17) + 16 + 'px';
          $('#in-spl').style.left = (X(17) + X(19)) / 2 - 210 + 'px';
          const scs = $('#in-scs'); scs.style.left = (X(17) + X(19)) / 2 - 280 + 'px';
          const SC = [['message', 'comentarios', 'análisis'], ['route', 'rutas', 'rutas'], ['tag', 'precios', 'precios'], ['batteryLow', 'baterías', 'baterías']]
            .map(([ic, t, w]) => ({ e: el('span', 'chip chip--cmp pop', `${IC[ic]}${t}`, scs), w }));
          [['#in-m22', 22], ['#in-l22', 22], ['#in-m23', 23], ['#in-l23', 23]].forEach(([s, d]) => ($(s).style.left = X(d) + 'px'));
          // the pile at the monument, and the empty rest of the city
          const PILE = [[480, 130], [480, 190], [505, 252], [565, 268], [625, 270], [695, 258], [705, 195], [705, 135], [540, 64], [610, 56], [670, 68], [420, 160], [760, 170]];
          const bikes = PILE.map(([x, y]) => { const b = el('span', 'bk pop', IC.bike, $('#in-bikes')); b.style.left = x + 'px'; b.style.top = y + 'px'; return b; });
          const EMPTY = [[90, 60], [140, 250], [960, 70], [1080, 240], [290, 120], [880, 270]];
          const empties = EMPTY.map(([x, y]) => { const e = el('span', 'empty pop', '0', $('#in-empty')); e.style.left = x + 'px'; e.style.top = y + 'px'; return e; });
          const T = title({ k: 'Capítulo 6', h: 'El vehículo correcto, en el lugar correcto', s: 'Five Nines · el problema n.º 1 del cliente' });
          T.h.style.fontSize = '96px';

          // Wednesday 22, a little before eight in the evening: a new file, a short message
          pop(W(0, 'miércoles') - 0.2, '#in-cm', { y: 18, s: 0.98 });
          pop(W(0, 'ocho') - 0.2, '#in-when', { y: 8 });
          pop(W(0, 'agregar') - 0.2, '#in-msg', { y: 8 });
          // one day before the judges' snapshot
          pop(L(1) - 0.1, '#in-tl', { y: 14 });
          pop(W(1, 'día') - 0.1, ['#in-m22', '#in-l22'], { s: 0.6, y: 0, ease: 'back.out(2)' });
          pop(W(1, 'foto') - 0.2, '#in-cam', { y: 8 });
          // the other AI scenarios, drawn between Friday 17 and Sunday 19
          SC.forEach((s) => pop(W(2, s.w) - 0.2, s.e, { y: 8, s: 0.9 }));
          pop(W(2, 'viernes') - 0.2, ['#in-span', '#in-spl'], { y: 0, s: 0.9 });
          // this one came last; its ADR after midnight
          pop(W(3, 'último') - 0.2, '#in-last', { y: 10 });
          pop(W(3, 'medianoche') - 0.2, ['#in-m23', '#in-l23'], { s: 0.6, y: 0, ease: 'back.out(2)' });
          // the client's biggest challenge: everyone leaves the bikes at the monument
          hide(L(4) - 0.4, '#in-a');
          pop(L(4), '#in-city', { y: 16, s: 0.98 });
          pop(W(4, 'desafío') - 0.2, '#in-p1', { s: 0.9, ease: 'back.out(2)' });
          pop(W(4, 'bicicletas') - 0.1, bikes, { st: 0.05, s: 0.6, y: 0, ease: 'back.out(2)' });
          fade(W(4, 'monumento') - 0.1, '#in-mg', 0.5);
          pop(W(4, 'resto') - 0.1, empties, { st: 0.08, s: 0.7, y: 0 });
          // the jury's first question, now against the problem the client put first
          pop(W(5, 'pregunta') - 0.2, '#in-jq', { y: 12 });
          hide(W(5, 'ahora') - 0.5, '#in-b');
          T.show(W(5, 'ahora') - 0.1, LE(5) - 0.6);
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
