<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #intro { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #intro .kata { position: absolute; left: 0; right: 0; top: 170px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
        #intro .kata__k { font-family: var(--mono); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-text); }
        #intro .kata__h { font-size: 96px; font-weight: 820; letter-spacing: -0.04em; line-height: 1; }
        #intro .kdef { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 38px; font-weight: 640; color: var(--text2); }
        #intro .kdef b { color: var(--text); }
        #intro .arch { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 56px; font-weight: 790; letter-spacing: -0.03em; }
        #intro .arch b { color: var(--accent-text); }
        #intro .lbl { position: absolute; font-family: var(--mono); font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); }
        #intro .win { position: absolute; left: 0; right: 0; top: 190px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
        #intro .win__ic { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); border: 2px solid rgba(255, 122, 69, 0.6); color: var(--accent-text); box-shadow: 0 0 60px rgba(255, 122, 69, 0.3); }
        #intro .win__ic svg { width: 60px; height: 60px; }
        #intro .win__t { font-size: 92px; font-weight: 820; letter-spacing: -0.04em; }
        #intro .ppl { display: flex; gap: 14px; }
        #intro .pp { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--cmd-soft); border: 1.5px solid #2c4677; color: var(--cmd); }
        #intro .pp svg { width: 32px; height: 32px; }
        #intro .strip { position: absolute; left: 260px; width: 1400px; top: 640px; height: 70px; }
        #intro .strip__line { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--line-strong); }
        #intro .dot { position: absolute; top: 27px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--evt); box-shadow: 0 0 12px rgba(63, 214, 148, 0.5); }
        #intro .tick { position: absolute; top: 58px; font-family: var(--mono); font-size: 18px; color: var(--text3); transform: translateX(-50%); white-space: nowrap; }
      </style>
      <div id="intro" data-composition-id="intro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <!-- the kata, and what a kata is -->
        <div class="layer" id="in-a">
          <div class="kata">
            <span class="kata__k pop" id="in-k">O'Reilly · invierno de 2024</span>
            <span class="kata__h pop" id="in-h">Architecture Kata</span>
          </div>
          <div class="kdef pop" id="in-def"><b>Kata:</b> un ejercicio de práctica</div>
          <svg class="wires" id="in-w1" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="in-flow"></div>
        </div>
        <!-- architecture: the shape of the system -->
        <div class="layer" id="in-b">
          <div class="arch pop" id="in-arch">La arquitectura es <b>la forma del sistema</b></div>
          <svg class="wires" id="in-w2" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="in-boxes"></div>
          <span class="lbl pop" id="in-l1" style="left: 380px; top: 720px">qué piezas tiene</span>
          <span class="lbl pop" id="in-l2" style="left: 1180px; top: 720px">cómo se hablan</span>
        </div>
        <!-- the winner, and the method of the course -->
        <div class="layer" id="in-c">
          <div class="win">
            <span class="win__ic pop" id="in-wi" data-icon="trophy"></span>
            <span class="win__t pop" id="in-wt">BluzBrothers</span>
            <div class="ppl" id="in-ppl"></div>
          </div>
          <div class="strip pop" id="in-strip"><span class="strip__line"></span></div>
        </div>
        <div class="title">
          <span class="title__k pop" id="in-tk">Capítulo 1</span>
          <span class="title__h pop" id="in-th">El caso MonitorMe</span>
          <span class="title__s pop" id="in-ts">StayHealthy, Inc. · vigilar pacientes internados</span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('intro');
          const { tl, W, L, pop, to, draw, el, $, node, wire, stamp, IC } = K;
          // what a kata is: a company hands over a brief, each team designs the architecture
          const F = $('#in-flow'), Y = 520;
          const co = node(F, { x: 150, y: Y, w: 330, icon: 'building', title: 'Una empresa', tone: 'ext' });
          const br = node(F, { x: 590, y: Y, w: 330, icon: 'file', title: 'El pliego', sub: 'lo que necesita', tone: 'phys' });
          const te = node(F, { x: 1030, y: Y, w: 330, icon: 'users', title: 'Cada equipo', tone: 'user' });
          const ar = node(F, { x: 1470, y: Y, w: 300, icon: 'boxes', title: 'Arquitectura', tone: 'built' });
          const fw = [[co, br], [br, te], [te, ar]].map(([a, b]) => wire($('#in-w1'), a.r, b.l, 'wire--accent', true));
          // architecture: which pieces, and how they talk
          const B = $('#in-boxes');
          const bx = [[300, 400], [300, 590], [860, 495], [1420, 400], [1420, 590]].map(([x, y], i) => node(B, { x, y, w: 240, h: 90, icon: 'box', title: 'Pieza ' + (i + 1), tone: 'cmp' }));
          const bw = [[0, 2], [1, 2], [2, 3], [2, 4]].map(([a, b]) => wire($('#in-w2'), bx[a].r, bx[b].l, 'wire--cmd'));
          // four people, and their repository: 184 commits from Feb 13 to Mar 7, 2024
          const ppl = [0, 1, 2, 3].map(() => el('span', 'pp pop', IC.user, $('#in-ppl')));
          const S = $('#in-strip'), day = (d) => (d / 23) * 1400; // day 0 = Feb 13, day 23 = Mar 7
          // one dot per day with commits (HISTORIA.md, section 3): Feb 13, 15, 16, 17, 19, 20, 21, 22; Mar 4, 5, 7
          const DAYS = [0, 2, 3, 4, 6, 7, 8, 9, 20, 21, 23];
          const dots = DAYS.map((d) => { const e = el('span', 'dot pop', null, S); e.style.left = day(d) + 'px'; return e; });
          [['13 feb', 0], ['22 feb', 9], ['4 mar', 20], ['7 mar', 23]].forEach(([t, d]) => { const e = el('span', 'tick', t, S); e.style.left = day(d) + 'px'; });
          const st = stamp($('#in-c'), { x: 760, y: 560, icon: 'git', text: '<b>184 commits</b> en su repositorio' });

          pop(W(0, 'invierno') - 0.2, '#in-k', { y: 12 });
          pop(W(0, 'Architecture') - 0.2, '#in-h', { y: 30, d: 0.8, ease: 'expo.out' });
          pop(W(1, 'ejercicio') - 0.2, '#in-def', { y: 12 });
          pop(W(1, 'empresa') - 0.15, co.e, { y: 14 });
          draw(W(1, 'pliego') - 0.4, fw[0].p, 0.4);
          pop(W(1, 'pliego') - 0.15, br.e, { y: 14 });
          draw(W(1, 'equipo') - 0.4, fw[1].p, 0.4);
          pop(W(1, 'equipo') - 0.15, te.e, { y: 14 });
          draw(W(1, 'arquitectura') - 0.4, fw[2].p, 0.4);
          pop(W(1, 'arquitectura') - 0.15, ar.e, { y: 14, s: 0.9, ease: 'back.out(1.8)' });
          // the shape of the system
          to(L(2) - 0.4, '#in-a', { opacity: 0, y: -30, duration: 0.5 });
          pop(L(2) - 0.1, '#in-arch', { y: 16 });
          pop(W(2, 'piezas') - 0.2, bx.map((b) => b.e), { st: 0.1, y: 12 });
          pop(W(2, 'piezas'), '#in-l1', { y: 8 });
          bw.forEach((w, k) => draw(W(2, 'hablan') - 0.3 + k * 0.1, w.p, 0.5));
          pop(W(2, 'hablan'), '#in-l2', { y: 8 });
          // the winner: four people
          to(L(3) - 0.4, '#in-b', { opacity: 0, y: -30, duration: 0.5 });
          pop(L(3), '#in-wi', { s: 0.6, ease: 'back.out(2)' });
          pop(W(3, 'cuatro') - 0.1, ppl, { st: 0.1, s: 0.6, y: 0, ease: 'back.out(2)' });
          pop(W(3, 'BluzBrothers') - 0.2, '#in-wt', { y: 24, d: 0.8, ease: 'expo.out' });
          // day by day, from the commits of their own repository
          pop(W(3, 'día') - 0.2, '#in-strip', { y: 10 });
          pop(W(3, 'día') - 0.1, dots, { st: 0.05, s: 0.3, y: 0 });
          pop(W(3, 'commits') - 0.2, st, { y: 10 });
          // the chapter
          to(L(4) - 0.4, '#in-c', { opacity: 0, y: -30, duration: 0.5 });
          pop(L(4) - 0.1, '#in-tk', { y: 16 });
          pop(W(4, 'caso') - 0.2, '#in-th', { y: 40, d: 0.9, ease: 'expo.out' });
          pop(W(4, 'MonitorMe') + 0.4, '#in-ts', { y: 12 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
