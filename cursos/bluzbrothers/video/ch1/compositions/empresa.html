<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #empresa { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #empresa .zone { position: absolute; border-radius: 24px; border: 2px dashed var(--line-strong); background: rgba(23, 29, 38, 0.35); }
        #empresa .zone b { position: absolute; left: 24px; top: 18px; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
        #empresa .zone b svg { width: 22px; height: 22px; }
        #empresa .node--ext { border-style: dashed; }
        #empresa .new { position: absolute; left: 1080px; top: 330px; width: 640px; height: 400px; border-radius: 24px; border: 2px dashed rgba(255, 122, 69, 0.55); background: rgba(255, 122, 69, 0.04); }
        #empresa .new b { position: absolute; left: 24px; top: 18px; font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-text); }
        #empresa .devs { position: absolute; left: 1140px; top: 400px; display: flex; gap: 16px; }
        #empresa .dv { width: 84px; height: 84px; border-radius: 20px; display: grid; place-items: center; background: var(--cmp-soft); border: 1.5px solid #4a3f73; color: var(--cmp); }
        #empresa .dv svg { width: 40px; height: 40px; }
        #empresa .only { position: absolute; left: 1150px; top: 660px; }
      </style>
      <div id="empresa" data-composition-id="empresa" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <svg class="wires" id="em-w" viewBox="0 0 1920 1080"></svg>
        <div class="zone pop" id="em-cloud" style="left: 180px; top: 400px; width: 760px; height: 330px"><b><span data-icon="cloud"></span>En la nube</b></div>
        <div class="new pop" id="em-new"><b>Mercado nuevo · pacientes internados</b></div>
        <div class="devs" id="em-devs"></div>
        <div class="layer" id="em-n"></div>
        <span class="chip chip--accent only pop" id="em-only" data-icon="target"></span>
      </div>
      <script>
        (() => {
          const K = KIT.scene('empresa');
          const { W, pop, to, draw, el, $, node, wire, IC } = K;
          const N = $('#em-n');
          const sh = node(N, { x: 380, y: 190, w: 400, h: 110, icon: 'heart', title: 'StayHealthy, Inc.', sub: 'software médico', tone: 'user' });
          const m1 = node(N, { x: 220, y: 490, w: 330, h: 120, icon: 'chart', title: 'MonitorThem', sub: 'analiza datos de hospitales', tone: 'ext' });
          const m2 = node(N, { x: 580, y: 490, w: 330, h: 120, icon: 'file', title: 'MyMedicalData', sub: 'la historia clínica', tone: 'ext' });
          const mm = node(N, { x: 1160, y: 530, w: 480, h: 110, icon: 'monitor', title: 'MonitorMe', sub: 'el sistema nuevo', tone: 'built' });
          const devs = ['bed', 'heart', 'temp', 'ecg', 'oxygen', 'sleep'].map((ic) => el('span', 'dv pop', IC[ic], $('#em-devs')));
          const w1 = wire($('#em-w'), sh.b, m1.t, 'wire--cmd'), w2 = wire($('#em-w'), sh.b, m2.t, 'wire--cmd');
          const w3 = wire($('#em-w'), sh.r, [1080, 400], 'wire--accent');
          $('#em-only').insertAdjacentHTML('beforeend', 'lo único que el equipo diseña');

          // the company and its two cloud products
          pop(W(0, 'StayHealthy') - 0.2, sh.e, { y: 16 });
          pop(W(0, 'nube') - 0.4, '#em-cloud', { y: 12, s: 0.98 });
          draw(W(0, 'productos') - 0.2, w1.p, 0.5);
          draw(W(0, 'productos') - 0.1, w2.p, 0.5);
          pop(W(1, 'MonitorThem') - 0.15, m1.e, { y: 14 });
          pop(W(1, 'MyMedicalData') - 0.15, m2.e, { y: 14 });
          // a new market: patients in hospital, with devices it builds itself
          draw(W(2, 'mercado') - 0.3, w3.p, 0.6);
          pop(W(2, 'mercado') - 0.1, '#em-new', { y: 12, s: 0.98 });
          pop(W(2, 'aparatos') - 0.2, devs, { st: 0.1, s: 0.7, y: 0, ease: 'back.out(2)' });
          // the new system: the only thing to design
          pop(W(3, 'MonitorMe') - 0.2, mm.e, { y: 16, s: 0.94, ease: 'back.out(1.6)' });
          to(W(3, 'único') - 0.2, ['#em-cloud', m1.e, m2.e, sh.e], { opacity: 0.4, duration: 0.5 });
          pop(W(3, 'único') - 0.1, '#em-only', { s: 0.85, ease: 'back.out(2)' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
