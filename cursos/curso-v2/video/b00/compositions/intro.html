<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="intro" class="scene" data-composition-id="intro" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 1: el concurso, quién lo presenta y quién juzga, y los doce ganadores
          const K = KIT.scene('intro');
          const { W, L } = K;
          const T = TZ(K), C = T.C;

          T.aqui(0, L(0) - 0.3, 'Un sistema entero, antes de explicarlo');

          // el concurso: cuatro piezas de la gramática al fondo y el nombre al centro
          const fondo = [
            T.box(170, 220, 260, 120, null, { r: 16, c: '#8b938c' }), T.cyl(1640, 290, 200, 170, { c: '#8b938c' }),
            T.arrow(220, 860, 480, 800, { c: '#8b938c', sw: 4 }), T.X(1620, 840, 60, 50, { c: '#8b938c', sw: 5 }),
          ];
          const nombre = T.label(960, 400, 'Architecture Katas', { size: 120, style: 'font-weight:820;letter-spacing:-.03em' });
          const sub = T.note(960, 490, 'un concurso de diseño · O’Reilly', { size: 52, anchor: 'c', c: '#c9c3b4' });
          T.draw(L(0), fondo, { d: 0.6, st: 0.12 });
          T.dim(L(0) + 0.9, fondo, 0.35);
          T.draw(L(0) + 0.2, nombre, { d: 0.5 });
          T.draw(W(0, 'organiza'), sub);
          const pres = [T.label(640, 660, 'presentan', { size: 30, c: '#a9b0a8' }), T.label(640, 720, 'Neal Ford · Mark Richards', { size: 48 })];
          const jur = [T.label(1360, 660, 'jurado', { size: 30, c: '#a9b0a8' }), T.label(1360, 720, 'Jacqui Read', { size: 48 })];
          T.draw(W(0, 'presentan'), pres, { d: 0.5, st: 0.15 });
          T.draw(W(0, 'jurado'), jur, { d: 0.5, st: 0.15 });

          // una edición: el caso de un negocio, equipos pequeños, poco tiempo
          T.erase(L(1) - 0.2, [...fondo, nombre, sub, ...pres, ...jur]);
          const tarjeta = (x, ic, t) => T.join(T.box(x - 180, 330, 360, 260, null, { r: 18 }), T.icon(ic, x, 430, 110, { sw: 4.5 }), T.label(x, 540, t, { size: 34 }));
          const cosas = [tarjeta(460, 'building', 'el caso de un negocio'), tarjeta(960, 'users', 'equipos pequeños'), tarjeta(1460, 'clock', 'poco tiempo')];
          T.draw(W(1, 'caso') - 0.1, cosas[0], { d: 0.6 });
          T.draw(W(1, 'equipos') - 0.1, cosas[1], { d: 0.6 });
          T.draw(W(1, 'tiempo') - 0.2, cosas[2], { d: 0.6 });

          // lo que entregan: tres hojas que se reconocen
          T.erase(W(1, 'entregan') - 0.2, cosas);
          const req = T.join(T.card(330, 300, 260, 320), T.label(460, 680, 'requisitos', { size: 36 }));
          const diag = T.join(
            T.box(830, 300, 260, 320, null, { r: 14, sw: 3.5 }),
            T.box(870, 340, 80, 56, null, { r: 8, sw: 3 }), T.box(970, 340, 80, 56, null, { r: 8, sw: 3 }), T.cyl(960, 540, 110, 90, { sw: 3 }),
            T.line(910, 396, 940, 495, { sw: 3, c: '#c9c3b4' }), T.line(1010, 396, 980, 495, { sw: 3, c: '#c9c3b4' }),
            T.label(960, 680, 'diagramas', { size: 36 }),
          );
          const dec = T.join(T.card(1330, 300, 260, 320, { c: C.or }), T.label(1460, 680, 'decisiones escritas', { size: 36 }));
          T.draw(W(1, 'requisitos') - 0.1, req, { d: 0.5 });
          T.draw(W(1, 'diagramas') - 0.1, diag, { d: 0.5 });
          T.draw(W(1, 'decisiones') - 0.1, dec, { d: 0.5 });

          // TheKataLog: los doce ganadores
          T.erase(W(1, 'catalogo') - 0.2, [req, diag, dec]);
          const nombres = ['MobilityCorp', 'Certifiable', 'ClearView', 'ShopWise', 'MonitorMe', 'Road Warrior', 'Wildlife Watcher', 'Hey Blue!', 'Spotlight', 'Farmacy Family', 'Sysops Squad', 'Farmacy Food'];
          const titulo = T.note(155, 170, 'TheKataLog', { size: 64, c: '#c9c3b4' });
          const grilla = nombres.map((t, i) => T.box(155 + (i % 4) * 410, 300 + Math.floor(i / 4) * 200, 380, 160, t, { size: 34, r: 16 }));
          T.draw(W(1, 'catalogo'), titulo);
          T.draw(W(1, 'catalogo') + 0.2, grilla, { d: 0.45, st: 0.07 });
          const doce = T.label(1700, 190, '12', { size: 120, c: C.or, style: 'font-weight:820' });
          T.draw(W(1, 'doce') - 0.1, doce, { d: 0.4 });
          // al final, ClearView: el resto se apaga
          T.dim(W(1, 'doce') + 0.8, grilla.filter((_, i) => i !== 2), 0.3);
          T.color(W(1, 'doce') + 0.8, grilla[2], C.or);
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
