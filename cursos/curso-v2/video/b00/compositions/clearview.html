<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="clearview" class="scene" data-composition-id="clearview" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 2: el recorrido de una persona por ClearView, y después el sistema entero
          const K = KIT.scene('clearview');
          const { W, L } = K;
          const T = TZ(K), C = T.C;

          T.mundo(L(0), 'clearview', W(0, 'persona') - 0.4);
          T.seal(W(0, 'persona'), 'ClearView', 'file');

          // la persona y su currículum
          const per = (x, y, t) => T.join(T.circle(x, y - 60, 46, { sw: 5 }), T.path(`M${x - 70} ${y + 70} q70 -110 140 0`, { sw: 5 }), T.label(x, y + 110, t, { size: 34, c: '#c9c3b4' }));
          const cand = per(220, 420, 'candidato');
          const foto = T.circle(450, 340, 34, { c: C.or, sw: 4.5 });
          const nom = T.join(T.line(500, 325, 600, 325, { sw: 5 }), T.line(500, 355, 570, 355, { sw: 4 }));
          const cv = T.join(T.box(400, 280, 240, 300, null, { r: 14, sw: 4 }), ...[0, 1, 2].map((i) => T.line(430, 430 + i * 40, 610 - (i % 2) * 40, 430 + i * 40, { sw: 3.5, c: '#a9b0a8' })));
          const cvL = T.label(520, 620, 'currículum', { size: 32, c: '#c9c3b4' });
          T.draw(W(0, 'persona'), cand, { d: 0.6 });
          T.draw(W(0, 'sube'), [cv, foto, nom, cvL], { d: 0.6, st: 0.1 });

          // el sistema le quita lo que la identifica: queda una historia sin nombre
          const flecha = T.arrow(660, 430, 830, 430, { c: C.or, sw: 5 });
          const hist = T.join(T.box(850, 280, 240, 300, null, { r: 14, sw: 4, c: C.or }), T.circle(900, 340, 34, { c: '#8b938c', dash: '8 8', sw: 3.5 }), ...[0, 1, 2].map((i) => T.line(880, 430 + i * 40, 1060 - (i % 2) * 40, 430 + i * 40, { sw: 3.5, c: '#a9b0a8' })));
          const histL = T.note(970, 620, 'historia anónima', { size: 46, anchor: 'c', c: C.or });
          T.dim(W(0, 'quita'), [foto, nom], 0.25);
          T.draw(W(0, 'quita') + 0.3, flecha, { d: 0.4 });
          T.draw(W(0, 'escribe'), [hist, histL], { d: 0.6 });

          // una empresa publica un puesto, y el sistema propone qué historias encajan
          const emp = per(1700, 420, 'empresa');
          const puesto = T.join(T.box(1300, 280, 240, 300, null, { r: 14, sw: 4 }), T.icon('card', 1420, 360, 80, { sw: 4 }), ...[0, 1].map((i) => T.line(1330, 460 + i * 40, 1510 - i * 40, 460 + i * 40, { sw: 3.5, c: '#a9b0a8' })));
          const puestoL = T.label(1420, 620, 'puesto', { size: 32, c: '#c9c3b4' });
          T.draw(W(0, 'empresa'), [emp, puesto, puestoL], { d: 0.6, st: 0.15 });
          const enlace = T.line(1100, 430, 1290, 430, { c: C.gr, sw: 8 });
          T.draw(W(0, 'encajan') - 0.2, enlace, { d: 0.4 });

          // la empresa ve solo la historia: el currículum queda con candado
          const cand0 = T.icon('lock', 520, 470, 90, { c: C.or, sw: 5 });
          T.draw(W(1, 'solo'), cand0, { d: 0.4 });
          const abierto = T.icon('unlock', 520, 470, 90, { c: C.gr, sw: 5 });
          T.erase(W(1, 'desbloquea'), cand0, { d: 0.2 });
          T.draw(W(1, 'desbloquea') + 0.15, abierto, { d: 0.4 });
          T.dim(W(1, 'desbloquea'), [foto, nom], 1);
          // el currículum completo viaja a los RR. HH. de esa empresa
          const rrhh = T.join(T.box(1240, 760, 400, 150, null, { r: 16, dash: '10 10' }), T.label(1440, 835, 'RR. HH. de la empresa', { size: 34 }));
          const viaje = T.arrow(520, 600, 1230, 830, { c: C.gr, sw: 5, bend: [0, 160] });
          T.draw(W(1, 'viaja') - 0.2, viaje, { d: 0.9 });
          T.draw(W(1, 'recursos'), rrhh, { d: 0.6 });

          // así se ve el sistema: el dibujo de ClearView, que se enciende por partes
          const recorrido = [cand, cv, foto, nom, cvL, flecha, hist, histL, emp, puesto, puestoL, enlace, abierto, rrhh, viaje];
          T.erase(L(2) - 0.3, recorrido, { d: 0.4 });
          const X = (x) => 60 + x * 0.92, Y = (y) => 70 + y * 0.92, S = (v) => v * 0.92, fs = 28;
          const persona = (x, y, t) => T.join(T.circle(X(x + 50), Y(y), S(30), { sw: 4 }), T.path(`M${X(x + 10)} ${Y(y + 85)} q${S(40)} ${S(-65)} ${S(80)} 0`, { sw: 4 }), T.label(X(x + 50), Y(y + 115), t, { size: fs, c: '#c9c3b4' }));
          const svc = (x, y, w, t) => T.box(X(x), Y(y), S(w), S(100), t, { size: fs, r: 14 });
          const P = [persona(70, 170, 'candidato'), persona(70, 720, 'empresa')];
          const Sv = [svc(470, 170, 300, 'Candidatos'), svc(830, 170, 300, 'Historia'), svc(470, 760, 300, 'Empresas'), svc(830, 760, 300, 'Emparejamiento')];
          const base = T.join(T.cyl(X(800), Y(520), S(370), S(200), {}), T.label(X(800), Y(540), 'base compartida', { size: fs }));
          const centro = [...[[620, 280], [980, 280]].map(([x, y]) => T.line(X(x), Y(y), X(x < 800 ? 720 : 880), Y(420), { sw: 3, c: '#8b938c' })), ...[[620, 760], [980, 760]].map(([x, y]) => T.line(X(x), Y(y), X(x < 800 ? 720 : 880), Y(620), { sw: 3, c: '#8b938c' }))];
          const izq = [T.line(X(190), Y(200), X(460), Y(220), { sw: 3, c: '#8b938c' }), T.line(X(190), Y(750), X(460), Y(810), { sw: 3, c: '#8b938c' })];
          const model = T.join(T.box(X(1400), Y(150), S(380), S(110), null, { r: 14, sw: 4, c: '#c8b6ff', dash: '10 8' }), T.label(X(1590), Y(205), 'modelos de IA', { size: fs, c: '#c8b6ff' }), T.line(X(1130), Y(220), X(1390), Y(205), { sw: 3, c: '#8b938c', dash: '8 8' }));
          const hr = T.join(svc(1310, 640, 330, 'Integración RR. HH.'), T.path(`M${X(770)} ${Y(270)} C ${X(1200)} ${Y(330)}, ${X(1400)} ${Y(500)}, ${X(1470)} ${Y(630)}`, { sw: 3, c: '#8b938c', dash: '8 8' }));
          const ext = [560, 670, 780].map((y) => T.join(T.box(X(1700), Y(y), S(160), S(76), 'RR. HH.', { size: 22, r: 10, dash: '8 8' }), T.line(X(1645), Y(690), X(1690), Y(y + 38), { sw: 3, c: '#8b938c', dash: '8 8' })));
          const cien = T.label(X(1780), Y(500), '× 100', { size: 56, c: C.or, style: 'font-weight:800' });
          const todo = [...P, ...Sv, base, ...centro, ...izq, model, hr, ...ext];
          T.draw(L(2), todo, { d: 0.45, st: 0.03 });
          T.dim(L(2) + 1.2, todo, 0.3);
          T.dim(W(2, 'personas') - 0.2, [...P, ...izq], 1);
          T.dim(W(2, 'servicios') - 0.2, [...Sv, base, ...centro], 1);
          T.color(W(2, 'comparten'), [base, ...centro], C.or);
          T.color(W(2, 'modelos') - 0.2, base, C.ch);
          T.color(W(2, 'modelos') - 0.2, centro, '#8b938c');
          T.dim(W(2, 'modelos') - 0.2, model, 1);
          T.dim(W(2, 'recursos') - 0.2, [hr, ...ext], 1);
          T.draw(W(2, 'cien') - 0.1, cien, { d: 0.4 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
