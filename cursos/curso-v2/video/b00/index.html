<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KatArch · Un sistema entero, antes de explicarlo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- generated: the narration's timing (tools/timing.mjs) and the Lucide icons (tools/icons.mjs) -->
    <script src="timing.js"></script>
    <script src="assets/textos.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/kit.js"></script>
    <script src="assets/dg.js"></script>
    <script src="assets/casos.js"></script>
    <script src="assets/clearview.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <link rel="stylesheet" href="assets/dg.css" />
    <style>
      @font-face {
        font-family: 'Inter KA';
        src: url('assets/fonts/inter-latin-opsz-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'JetBrains KA';
        src: url('assets/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07090d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter KA', 'Segoe UI', sans-serif; color: #e8ecf2; -webkit-font-smoothing: antialiased; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="130.92" data-width="1920" data-height="1080" data-fps="30">
      <!-- the scene slots and the voice clips are laid out by tools/timing.mjs -->
      <!-- film -->
      <div id="el-intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="38.36" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-clearview" data-composition-id="clearview" data-composition-src="compositions/clearview.html" data-start="37.66" data-duration="54.04" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-preguntas" data-composition-id="preguntas" data-composition-src="compositions/preguntas.html" data-start="91" data-duration="39.92" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio id="vo-intro-0" src="assets/voice/intro-0.mp3" data-start="3.2" data-duration="17.13" data-track-index="10"></audio>
      <audio id="vo-intro-1" src="assets/voice/intro-1.mp3" data-start="20.83" data-duration="16.63" data-track-index="10"></audio>
      <audio id="vo-clearview-0" src="assets/voice/clearview-0.mp3" data-start="38.36" data-duration="21.4" data-track-index="10"></audio>
      <audio id="vo-clearview-1" src="assets/voice/clearview-1.mp3" data-start="60.26" data-duration="11.035" data-track-index="10"></audio>
      <audio id="vo-clearview-2" src="assets/voice/clearview-2.mp3" data-start="71.795" data-duration="18.925" data-track-index="10"></audio>
      <audio id="vo-preguntas-0" src="assets/voice/preguntas-0.mp3" data-start="91.7" data-duration="25.58" data-track-index="10"></audio>
      <audio id="vo-preguntas-1" src="assets/voice/preguntas-1.mp3" data-start="117.78" data-duration="9.86" data-track-index="10"></audio>
      <!-- /film -->

      <div id="chrome" class="clip" data-start="0" data-duration="130.92" data-track-index="8">
        <div class="progress"><span class="progress__fill" id="progress"></span></div>
        <div class="brand"><span class="brand__mark"></span>KatArch <span class="brand__ch">· Apertura</span></div>
        <div class="kickers" id="kickers"></div>
      </div>
      <div id="captions" class="clip" data-start="0" data-duration="130.92" data-track-index="9"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      KIT.film(tl);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
