<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="familias" class="scene" data-composition-id="familias" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 2: el tramo del mapa con las cuatro familias; cada una contesta una pregunta distinta
          const K = KIT.scene('familias');
          const { W, L } = K;
          const T = TZ(K), C = T.C;
          const sp = (t) => `<span style="text-align:center;line-height:1.1">${t}</span>`;
          const FAMS = [
            { t: 'registros', g: 'el detalle<br>de qué pasó', p: 'volumen;<br>saber buscar' },
            { t: 'métricas', g: 'la tendencia<br>de un vistazo', p: 'dicen que cambió,<br>no por qué' },
            { t: 'trazas', g: 'dónde se demoró<br>o falló', p: 'pasar la marca<br>al siguiente' },
            { t: sp('salud del<br>negocio'), g: 've lo que<br>ve el cliente', p: 'pruebas que<br>construir y mantener' },
          ];
          T.sweep(L(0) - 0.6);
          const R = T.region(12, FAMS, { cy: 380, ch: 400 });
          T.show(L(0), R.regiones, { op: 0.45 });
          T.draw(L(0) + 0.2, R.aqui, { d: 0.6 });
          // cada tarjeta con un dibujo chico de lo que mira, antes de sus palabras
          const show3 = (i, tName, tG, tP) => {
            const c = R.cards[i];
            T.draw(tName, [c.frame, { s: [], ht: [c.ht[0]] }], { d: 0.5 });
            T.draw(tG, { s: [], ht: [c.ht[1]] }, { d: 0.4 });
            T.draw(tP, { s: [], ht: [c.ht[2]] }, { d: 0.4 });
          };
          const q = T.note(960, 840, 'cada una contesta una pregunta distinta', { size: 48, anchor: 'c', c: '#c9c3b4' });
          T.draw(W(0, 'pregunta') - 0.3, q, { d: 0.5 });
          T.erase(W(1, 'registros') - 0.3, q, { d: 0.3 });
          show3(0, W(1, 'registros') - 0.2, W(1, 'Ganan') - 0.1, W(1, 'Pagan') - 0.1);
          show3(1, W(2, 'métricas') - 0.2, W(2, 'Ganan') - 0.1, W(2, 'Pagan') - 0.1);
          show3(2, W(3, 'trazas') - 0.2, W(3, 'Ganan') - 0.1, W(3, 'Pagan') - 0.1);
          show3(3, W(4, 'salud') - 0.2, W(4, 'Gana') - 0.1, W(4, 'Paga') - 0.1);
          const cx = (i) => R.cards[i].x + R.cards[i].w / 2;
          T.draw(W(2, 'alertas') - 0.2, T.note(cx(1), 810, '+ alertas', { size: 46, anchor: 'c', c: '#c9c3b4' }), { d: 0.4 });
          T.draw(W(4, 'Farmacy') - 0.1, T.note(cx(3), 810, 'Farmacy Food', { size: 46, anchor: 'c', c: C.or }), { d: 0.5 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
