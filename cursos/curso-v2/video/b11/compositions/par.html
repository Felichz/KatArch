<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="par" class="scene" data-composition-id="par" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 4: impedir que se lea contra volverlo ilegible; los dos antes del primer dato
          const K = KIT.scene('par');
          const { W, L } = K;
          const T = TZ(K), C = T.C;
          // la tarjeta sensible: foto, nombre, dirección
          const tarjeta = (x, y, k = 1, c = C.ch) => T.join(T.box(x, y, 200 * k, 130 * k, null, { r: 12 * k, sw: 4, c }), T.circle(x + 45 * k, y + 50 * k, 26 * k, { sw: 4, c }),
            T.line(x + 85 * k, y + 40 * k, x + 180 * k, y + 40 * k, { sw: 5, c }), T.line(x + 85 * k, y + 72 * k, x + 160 * k, y + 72 * k, { sw: 4, c }), T.line(x + 20 * k, y + 105 * k, x + 180 * k, y + 105 * k, { sw: 3, c: '#a9b0a8' }));
          // la misma tarjeta, ilegible
          const ilegible = (x, y, k = 1, c = '#8b938c') => T.join(T.box(x, y, 200 * k, 130 * k, null, { r: 12 * k, sw: 4, c }), ...[0, 1, 2].map((i) => T.line(x + 20 * k, y + (35 + i * 32) * k, x + 180 * k, y + (35 + i * 32) * k, { sw: 6, c, dash: '6 8' })));
          T.sweep(L(0) - 0.6);
          const div = T.line(960, 130, 960, 600, { sw: 3, c: '#5d665f', dash: '10 14' });
          const nA = T.note(480, 110, 'ClearView', { size: 62, anchor: 'c', c: '#c9c3b4' });
          const nB = T.note(1440, 110, 'Farmacy Family', { size: 62, anchor: 'c', c: '#c9c3b4' });
          T.draw(L(0), [div, nA, nB], { d: 0.5 });
          // izquierda: el candado y la lectura que rebota
          const tA = tarjeta(300, 270, 1.2);
          const lk = T.icon('lock', 420, 230, 60, { c: C.or, sw: 2.6 });
          const rb = T.join(T.arrow(820, 340, 560, 340, { sw: 5, c: C.rd }), T.X(570, 340, 20, 20, { c: C.rd, sw: 6 }));
          const izq = T.join(tA, lk, rb);
          // derecha: tres copias grises y la llave tachada
          const der = T.join(...[0, 1, 2].map((i) => ilegible(1080 + i * 200, 280 + (i % 2) * 60, 0.8)), T.icon('key', 1700, 500, 70, { c: '#8b938c', sw: 2.4 }), T.X(1700, 500, 40, 30, { c: C.rd, sw: 5 }));
          T.draw(L(0) + 0.3, [izq, der], { d: 0.5, st: 0.2 });
          T.dim(L(0) + 0.8, [izq, der], 0.3);
          T.dim(W(0, 'impide') - 0.3, izq, 1);
          const gA = T.note(480, 520, 'impedir que lo lea', { size: 50, anchor: 'c', c: C.gr });
          T.draw(W(0, 'lea') - 0.2, gA, { d: 0.5 });
          T.dim(W(0, 'Farmacy', 1) - 0.2, der, 1);
          const gB = T.note(1440, 560, 'volverlo ilegible', { size: 50, anchor: 'c', c: C.gr });
          T.draw(W(0, 'ilegible') - 0.2, gB, { d: 0.5 });
          // la línea de tiempo
          const lt = T.arrow(200, 760, 1720, 760, { sw: 4 });
          const mk = T.join(T.line(700, 730, 700, 790, { sw: 6, c: C.or }), T.label(700, 830, 'primer dato', { size: 34, c: C.or, style: 'font-weight:800' }));
          const mecs = T.join(T.icon('lock', 440, 710, 50, { c: C.gr, sw: 2.6 }), T.icon('key', 540, 710, 50, { c: C.gr, sw: 2.6 }));
          T.draw(W(0, 'mecanismos', 1) - 0.2, [lt, mk], { d: 0.5, st: 0.15 });
          T.draw(W(0, 'antes') - 0.2, mecs, { d: 0.4 });
          const rep = T.join(...[0, 1, 2, 3, 4].map((i) => T.box(900 + i * 150, 690 + (i % 2) * 30, 90, 50, null, { r: 8, sw: 3, c: C.am })));
          T.draw(W(0, 'repartidos') - 0.3, rep, { d: 0.4, st: 0.05 });
          const lec = T.note(1250, 850, 'lectura nuestra', { size: 40, c: '#c9c3b4' });
          T.draw(W(0, 'lectura') - 0.2, lec, { d: 0.4 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
