<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="plazo" class="scene" data-composition-id="plazo" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 6: retención por niveles de MobilityCorp; la tarjeta completa solo en facturación
          const K = KIT.scene('plazo');
          const { W, L } = K;
          const T = TZ(K), C = T.C;
          T.sweep(L(0) - 0.6);
          T.seal(L(0), 'MobilityCorp', 'scooter', W(2, 'Sysops') - 0.3);
          // la foto del vehículo
          const auto = T.join(T.icon('carFront', 560, 430, 260, { sw: 2.2 }));
          const tel = T.join(T.box(900, 300, 150, 260, null, { r: 20, sw: 5 }), T.circle(975, 380, 30, { sw: 4, c: C.or }));
          const flash = T.line(890, 400, 720, 430, { sw: 3, c: '#ffd27a', dash: '8 10' });
          T.draw(L(0) + 0.1, [auto, tel, flash], { d: 0.5, st: 0.15 });
          const foto = T.join(T.box(1180, 280, 380, 280, null, { r: 14, sw: 5 }), T.box(1290, 470, 160, 50, 'AB 123', { size: 26, r: 6 }), T.circle(1480, 350, 26, { sw: 4 }), T.path('M1440 430 q40 -50 80 0', { sw: 4 }));
          T.draw(W(0, 'matrículas') - 0.3, foto, { d: 0.5 });
          const dp = T.label(1370, 620, 'datos personales', { size: 34, c: C.or, style: 'font-weight:800' });
          T.draw(W(0, 'personales') - 0.2, dp, { d: 0.4 });
          const rel = T.join(T.icon('clock', 1660, 420, 80, { sw: 2.4 }), T.label(1660, 500, 'el tiempo<br>necesario', { size: 26, c: '#c9c3b4' }));
          T.draw(W(0, 'necesario') - 0.3, rel, { d: 0.4 });
          const disp = T.join(T.icon('gavel', 1160, 740, 70, { sw: 2.4 }), T.label(1160, 810, 'disputa', { size: 28, c: '#c9c3b4' }));
          const ent = T.join(T.icon('brainCircuit', 1560, 740, 70, { sw: 2.4 }), T.label(1560, 810, 'entrenar', { size: 28, c: '#c9c3b4' }));
          T.draw(W(0, 'disputa') - 0.2, disp, { d: 0.4 });
          T.draw(W(0, 'entrenar') - 0.2, ent, { d: 0.4 });
          // tres niveles
          const tn = W(1, 'niveles') - 0.4;
          T.erase(tn, [auto, tel, flash, foto, dp, rel, disp, ent], { d: 0.35 });
          const est = (y, n) => T.join(T.line(200, y + 70, 1720, y + 70, { sw: 4, c: '#8b938c' }), T.label(330, y + 20, n, { size: 34, style: 'font-weight:800' }));
          const e1 = est(200, 'originales'), e2 = est(420, 'copias de trabajo'), e3 = est(640, 'anónimas');
          T.draw(tn + 0.1, [e1, e2, e3], { d: 0.4, st: 0.12 });
          const fotos = (y, n, blur) => T.join(...Array.from({ length: n }, (_, i) => T.join(T.box(540 + i * 110, y - 30, 90, 70, null, { r: 8, sw: 3.5 }), ...(blur ? [T.ellipse(585 + i * 110, y + 5, 28, 18, { sw: 8, c: '#5d665f' })] : []))));
          const lin = (y, w, c) => T.arrow(540, y + 110, 540 + w, y + 110, { sw: 5, c });
          const f1 = fotos(200, 4), l1 = lin(200, 640, '#c9c3b4');
          const dis = T.join(T.box(1300, 170, 90, 70, null, { r: 8, sw: 3.5, c: C.or }), T.arrow(540, 330, 1520, 330, { sw: 4, c: C.or, dash: '10 10' }), T.label(1500, 140, 'con disputa', { size: 28, c: C.or, style: 'font-weight:700' }));
          T.draw(W(1, 'originales') - 0.2, [f1, l1], { d: 0.4, st: 0.1 });
          T.draw(W(1, 'disputa') - 0.2, dis, { d: 0.5 });
          const f2 = fotos(420, 3), l2 = lin(420, 320, '#c9c3b4');
          T.draw(W(1, 'trabajo') - 0.2, [f2, l2], { d: 0.4, st: 0.1 });
          const f3 = fotos(640, 4, true);
          const dif = T.label(1240, 660, 'caras y matrículas difuminadas', { size: 30, c: C.gr, style: 'font-weight:700' });
          T.draw(W(1, 'anónimas') - 0.2, f3, { d: 0.4 });
          T.draw(W(1, 'difuminadas') - 0.3, dif, { d: 0.4 });
          // Sysops Squad: dónde vive la tarjeta completa
          const ts = W(2, 'Sysops') - 0.3;
          T.erase(ts, [e1, e2, e3, f1, l1, dis, f2, l2, f3, dif], { d: 0.35 });
          T.seal(ts + 0.1, 'Sysops Squad', 'phone');
          const cli = T.join(T.box(200, 300, 560, 360, null, { r: 18, sw: 4, dash: '12 12', fill: false }), T.note(230, 312, 'clientes', { size: 50 }));
          const fac = T.join(T.box(1160, 300, 560, 360, null, { r: 18, sw: 4, dash: '12 12', fill: false }), T.note(1190, 312, 'facturación', { size: 50 }));
          T.draw(ts + 0.2, [cli, fac], { d: 0.5, st: 0.15 });
          const cuatro = T.box(330, 450, 300, 90, '•••• 4821', { size: 40, c: C.or, r: 12 });
          T.draw(W(2, 'cuatro') - 0.2, cuatro, { d: 0.4 });
          const tarj = T.join(T.box(1280, 430, 320, 130, null, { r: 14, sw: 4 }), T.line(1280, 470, 1600, 470, { sw: 10 }), T.label(1440, 520, '4532 1188 0093 4821', { size: 26 }));
          const viaja = T.arrow(770, 480, 1150, 480, { sw: 5, c: C.gr });
          const lk = T.icon('lock', 1640, 360, 60, { c: C.or, sw: 2.6 });
          T.draw(W(2, 'completa') - 0.3, [viaja, tarj], { d: 0.4, st: 0.2 });
          T.draw(W(2, 'facturación') - 0.2, lk, { d: 0.3 });
          T.color(W(2, 'facturación') - 0.2, cuatro, C.ch);
          const aud = T.join(T.box(1130, 270, 620, 420, null, { r: 24, sw: 5, c: C.gr, dash: '16 12', fill: false }), T.label(1440, 730, 'auditoría', { size: 34, c: C.gr, style: 'font-weight:800' }));
          T.draw(W(2, 'auditoría') - 0.2, aud, { d: 0.5 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
