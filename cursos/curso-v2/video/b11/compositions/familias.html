<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="familias" class="scene" data-composition-id="familias" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 2: el dato sensible y sus cuatro preguntas; el tramo del mapa con las cuatro familias
          const K = KIT.scene('familias');
          const { W, L } = K;
          const T = TZ(K), C = T.C;
          // la tarjeta sensible: foto, nombre, dirección
          const tarjeta = (x, y, k = 1, c = C.ch) => T.join(T.box(x, y, 200 * k, 130 * k, null, { r: 12 * k, sw: 4, c }), T.circle(x + 45 * k, y + 50 * k, 26 * k, { sw: 4, c }),
            T.line(x + 85 * k, y + 40 * k, x + 180 * k, y + 40 * k, { sw: 5, c }), T.line(x + 85 * k, y + 72 * k, x + 160 * k, y + 72 * k, { sw: 4, c }), T.line(x + 20 * k, y + 105 * k, x + 180 * k, y + 105 * k, { sw: 3, c: '#a9b0a8' }));
          // la misma tarjeta, ilegible
          const ilegible = (x, y, k = 1, c = '#8b938c') => T.join(T.box(x, y, 200 * k, 130 * k, null, { r: 12 * k, sw: 4, c }), ...[0, 1, 2].map((i) => T.line(x + 20 * k, y + (35 + i * 32) * k, x + 180 * k, y + (35 + i * 32) * k, { sw: 6, c, dash: '6 8' })));
          const sp = (t) => `<span style="text-align:center;line-height:1.1">${t}</span>`;
          const FAMS = [
            { t: sp('proveedor de<br>identidad'), g: 'no construir algo<br>tan delicado', p: 'depender de lo<br>que ofrece' },
            { t: sp('permisos y<br>aislamiento'), g: 'un error en otra<br>parte no lo expone', p: 'más reglas;<br>partes que no leen' },
            { t: 'cifrar', g: 'una copia robada<br>no sirve', p: 'trabajo al leer;<br>claves que cuidar' },
            { t: 'retención', g: 'lo que no se guarda<br>no se filtra', p: 'justificar plazos;<br>borrar a tiempo' },
          ];
          T.sweep(L(0) - 0.6);
          // la tarjeta y las cuatro preguntas
          const t0 = tarjeta(760, 380, 2);
          T.draw(L(0) + 0.1, t0, { d: 0.6 });
          const marca = (ic, x, y, txt, w) => T.join(T.icon(ic, x, y, 80, { sw: 2.4 }), T.label(x, y + 75, txt, { size: 32, c: '#c9c3b4' }));
          const m1 = marca('door', 520, 330, 'quién entra'), m2 = marca('eye', 1400, 330, 'quién lo ve'), m3 = marca('lock', 520, 640, 'cómo se protege'), m4 = marca('clock', 1400, 640, 'cuánto dura');
          T.draw(W(0, 'entra') - 0.2, m1, { d: 0.4 });
          T.draw(W(0, 've') - 0.2, m2, { d: 0.4 });
          T.draw(W(0, 'protege') - 0.2, m3, { d: 0.4 });
          T.draw(W(0, 'dura') - 0.2, m4, { d: 0.4 });

          const R = T.region(11, FAMS, { cy: 380, ch: 400 });
          const tf = W(0, 'cuatro') - 0.4;
          T.erase(tf - 0.2, [t0, m1, m2, m3, m4], { d: 0.35 });
          T.show(tf, R.regiones, { op: 0.45 });
          T.draw(tf + 0.2, R.aqui, { d: 0.6 });
          const show3 = (i, tName, tG, tP) => {
            const c = R.cards[i];
            T.draw(tName, [c.frame, { s: [], ht: [c.ht[0]] }], { d: 0.5 });
            T.draw(tG, { s: [], ht: [c.ht[1]] }, { d: 0.4 });
            T.draw(tP, { s: [], ht: [c.ht[2]] }, { d: 0.4 });
          };
          show3(0, W(1, 'proveedor') - 0.2, W(1, 'Gana') - 0.1, W(1, 'Paga') - 0.1);
          show3(1, W(2, 'permisos') - 0.2, W(2, 'Gana') - 0.1, W(2, 'Paga') - 0.1);
          show3(2, W(3, 'cifrar') - 0.2, W(3, 'Gana') - 0.1, W(3, 'Paga') - 0.1);
          show3(3, W(4, 'retención') - 0.2, W(4, 'Gana') - 0.1, W(4, 'Paga') - 0.1);
          const cx = (i) => R.cards[i].x + R.cards[i].w / 2;
          T.draw(W(2, 'ClearView') - 0.1, T.note(cx(1), 810, 'ClearView', { size: 46, anchor: 'c', c: C.or }), { d: 0.5 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
