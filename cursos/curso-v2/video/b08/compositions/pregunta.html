<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="pregunta" class="scene" data-composition-id="pregunta" data-width="1920" data-height="1080"></div>
      <script>
        (() => {
          // IDEAL.md, escena 6: el tramo del mapa; dónde tiene que estar el cómputo; cuánto controlar y operar
          const K = KIT.scene('pregunta');
          const { W, L } = K;
          const T = TZ(K), C = T.C;
          T.sweep(L(0) - 0.6);

          const R = T.region(8, [
            { t: 'máquinas', g: 'simples;<br>controlo todo', p: 'capacidad y reposición<br>a mi cargo' },
            { t: 'contenedores', g: 'copias que<br>se reponen solas', p: 'un orquestador<br>que operar' },
            { t: 'plataforma', g: 'nada<br>que operar', p: 'menos control;<br>atado al proveedor' },
            { t: 'en el aparato', g: 'funciona<br>sin red', p: 'muchos aparatos<br>que actualizar' },
          ], { cy: 340, ch: 380 });
          T.show(L(0), R.regiones, { op: 0.45 });
          T.draw(L(0) + 0.1, R.aqui, { d: 0.5 });
          T.draw(L(0) + 0.3, R.cards, { d: 0.4, st: 0.1 });
          const q1 = T.label(960, 770, '¿dónde tiene que estar el cómputo?', { size: 50, c: C.or, style: 'font-weight:800' });
          T.draw(W(0, 'Dónde') - 0.2, q1, { d: 0.5 });
          const txt = T.note(960, 800, 'todo lo que controlo, lo opero', { size: 50, anchor: 'c', c: C.am });
          T.erase(W(0, 'cuánto') - 0.3, q1, { d: 0.3 });
          T.draw(W(0, 'cuánto') - 0.1, txt, { d: 0.6 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
