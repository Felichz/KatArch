<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #duplicado .node__tx b { font-size: 34px; }
        #duplicado .node__tx small { font-size: 26px; }
        #duplicado .node__ic { width: 72px; height: 72px; }
        #duplicado .node__ic svg { width: 40px; height: 40px; }
        #duplicado .chip { height: 58px; font-size: 28px; padding: 0 24px; }
        #duplicado .row { top: 778px; }
        #duplicado .row .chip { height: 70px; font-size: 32px; padding: 0 32px; }
        #duplicado .hdl { top: 698px; font-size: 58px; }
        #duplicado .src { font-size: 22px; }
        #duplicado .sheet { left: 680px; top: 280px; width: 1120px; }
        #duplicado .sheet .ln { min-height: 112px; font-size: 38px; padding: 12px 28px; gap: 22px; }
        #duplicado .sheet .ln b { font-size: 24px; width: 130px; }
        #duplicado .sheet .ln span.mono { font-family: var(--mono); font-size: 36px; color: var(--cmd); }
        #duplicado .sheet .ln small { margin-left: auto; font-size: 26px; text-align: right; }
        #duplicado .sheet .ln .v { font-family: var(--mono); color: var(--accent-text); font-size: 44px; font-weight: 800; }
        #duplicado .chk { position: absolute; border-radius: 22px; padding: 0 36px; height: 180px; left: 900px; width: 890px; display: flex; align-items: center; gap: 28px; font-size: 36px; font-weight: 700; line-height: 1.22; }
        #duplicado .chk__ic { flex: none; width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; background: var(--cmd-soft); color: var(--cmd); }
        #duplicado .chk__ic svg { width: 42px; height: 42px; }
        #duplicado .chk small { display: block; margin-top: 6px; font-size: 26px; color: var(--text3); font-weight: 560; }
        #duplicado .chk--b { border-color: #6b2a33; } #duplicado .chk--b .chk__ic { background: var(--danger-soft); color: var(--danger); }
        #duplicado .chk--b .tx { max-width: 450px; }
        #duplicado .stamp { left: 1500px; top: 578px; font-size: 30px; }
        #duplicado .qt { position: absolute; left: 200px; right: 200px; top: 330px; padding: 46px 56px; font-size: 56px; font-weight: 640; font-style: italic; line-height: 1.28; border-color: #4a3f73; }
        #duplicado .qs { top: 596px; }
        #duplicado .zap { position: absolute; left: 1225px; top: 500px; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: var(--danger-soft); border: 2.5px solid var(--danger); color: var(--danger); }
        #duplicado .zap svg { width: 44px; height: 44px; }
        #duplicado .big { position: absolute; left: 160px; right: 160px; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
        #duplicado .big__ic { width: 150px; height: 150px; border-radius: 38px; display: grid; place-items: center; }
        #duplicado .big__ic svg { width: 84px; height: 84px; }
        #duplicado .big__t { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
        #duplicado .big__s { font-size: 40px; font-weight: 580; color: var(--text2); }
        #duplicado .big__ic { background: var(--cmd-soft); color: var(--cmd); }
      </style>
      <div id="duplicado" class="scene" data-composition-id="duplicado" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="d-a">
          <svg class="wires" id="d-w" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="d-n"></div>
          <span class="chip chip--cmd pop" id="d-ack" style="left: 1010px; top: 526px" data-icon="mail"></span>
          <span class="chip chip--danger pop" id="d-lost" style="left: 1090px; top: 600px" data-icon="x"></span>
          <span class="chip chip--accent pop" id="d-again" style="left: 740px; top: 172px" data-icon="repeat"></span>
          <span class="chip chip--evt pop" id="d-done" style="left: 1350px; top: 172px" data-icon="check"></span>
          <div class="hd hdl pop" id="d-hd">Entrega <span>al menos una vez</span></div>
          <div class="row"><span class="chip chip--accent pop" id="d-dup" data-icon="layers"></span></div>
        </div>
        <div class="layer" id="d-h">
          <div class="big pop" id="d-hb"><span class="big__ic" data-icon="shieldCheck"></span><span class="big__t">Farmacy Food propone resolver el duplicado</span><span class="big__s">con dos datos que viajan con el pedido</span></div>
        </div>
        <div class="layer" id="d-b">
          <svg class="wires" id="d-w2" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="d-n2"></div>
          <div class="sheet pop" id="d-sh">
            <div class="sheet__bar"><span data-icon="receipt"></span>pedido · listo para pagar<i>ilustrativo</i></div>
            <div class="sheet__body">
              <div class="ln" id="d-l0"><b>pedido</b><span class="pop" id="d-l0v">Cliente confirma su pedido</span></div>
              <div class="ln" id="d-l1"><b>id único</b><span class="mono pop" id="d-l1v">7f3a-91c2-e04b</span><small class="pop" id="d-l1s">lo genera el teléfono del cliente</small></div>
              <div class="ln" id="d-l2"><b>versión</b><span class="v pop" id="d-l2v">3</span><small class="pop" id="d-l2s">viaja con el pedido</small></div>
            </div>
          </div>
        </div>
        <div class="layer" id="d-c">
          <svg class="wires" id="d-w3" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="d-n3"></div>
          <div class="card chk pop" id="d-ca" style="top: 290px"><span class="chk__ic" data-icon="search"></span><span class="tx">¿Ya existe un pedido con ese identificador?<small>se comprueba al procesar</small></span></div>
          <div class="card chk chk--b pop" id="d-cb" style="top: 530px"><span class="chk__ic" data-icon="layers"></span><span class="tx">Un evento con una versión ya vista<small>llega repetido</small></span></div>
          <div class="stamp stamp--danger pop" id="d-st" data-icon="x"></div>
        </div>
        <div class="layer" id="d-d">
          <div class="tag tag--accent pop" id="d-tg" style="left: 0; right: 0; top: 230px; justify-content: center; font-size: 24px" data-icon="scale"></div>
          <div class="card qt pop" id="d-q">“It will slightly decrease performance, but we get data integrity.”</div>
          <div class="src qs pop" id="d-qs">ArchColider · 4.ADRs/008 At least once delivery for ready to pay order.md</div>
          <div class="row" style="top: 710px">
            <span class="chip chip--danger pop" id="d-k1" data-icon="trendDown"></span>
            <span class="chip chip--evt pop" id="d-k2" data-icon="shieldCheck"></span>
          </div>
          <div class="row" style="top: 806px"><span class="chip chip--evt pop" id="d-k3" data-icon="circleCheck"></span></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('duplicado');
          const { tl, W, L, pop, fade, hide, dim, draw, node, wire, stream, sv, $ } = K;
          const S = (s, t) => $(s).insertAdjacentHTML('beforeend', t);
          S('#d-ack', 'acuse de recibo'); S('#d-lost', 'el aviso se pierde'); S('#d-again', 'se entrega otra vez');
          S('#d-done', 'el trabajo ya se hizo'); S('#d-dup', 'trae los duplicados de regalo'); S('#d-st', 'se descarta');
          S('#d-tg', 'el costo, escrito en una línea');
          S('#d-k1', 'baja un poco el rendimiento'); S('#d-k2', 'se gana integridad de los datos'); S('#d-k3', 'datos correctos y que no se pierden');

          // ── the queue and its receipt
          const svg = $('#d-w');
          const prod = node($('#d-n'), { x: 130, y: 240, w: 440, h: 150, icon: 'receipt', title: 'Pedido', sub: 'se envía', tone: 'user' });
          const cola = node($('#d-n'), { x: 740, y: 240, w: 440, h: 150, icon: 'mail', title: 'Cola', sub: 'espera el acuse', tone: 'phys' });
          const srv = node($('#d-n'), { x: 1350, y: 240, w: 440, h: 150, icon: 'server', title: 'Quien procesa', sub: 'hace el trabajo', tone: 'evt' });
          const w1 = wire(svg, prod.r, cola.l, 'wire--evt', true);
          const w2 = wire(svg, cola.r, srv.l, 'wire--evt', true);
          const ack = sv('path', { d: 'M1570 392 V500 H960 V406', class: 'wire wire--cmd', pathLength: 1, 'stroke-dasharray': '1', 'stroke-dashoffset': 1 }, svg);
          const head = sv('polygon', { points: '946,412 974,412 960,388', fill: '#6ea2ff', opacity: 0 }, svg);
          const ackx = sv('path', { d: 'M1570 392 V500 H960 V406', class: 'wire wire--danger', opacity: 0 }, svg);

          pop(L(0), prod.e, { y: 14 });
          draw(W(0, 'mensaje'), w1.p, 0.5);
          stream(svg, w1, W(0, 'mensaje') + 0.1, W(0, 'mensaje') + 1.5, { every: 5, travel: 1.3 });
          pop(W(0, 'pierda') - 0.1, cola.e, { y: 14 });
          pop(W(0, 'acuse') - 0.2, '#d-ack', { s: 0.9 });
          pop(W(0, 'espera') - 0.2, srv.e, { y: 14 });
          draw(W(0, 'espera') - 0.2, w2.p, 0.5);
          stream(svg, w2, W(0, 'espera') - 0.1, W(0, 'espera') + 1.3, { every: 5, travel: 1.2 });
          draw(W(0, 'recibo') - 0.2, ack, 0.9);
          fade(W(0, 'recibo') + 0.5, head, 0.3);
          // no notice: the queue delivers it again
          tl.to([ack, head], { opacity: 0, duration: 0.3 }, W(0, 'avisa') - 0.3);
          fade(W(0, 'avisa') - 0.3, ackx, 0.4);
          pop(W(0, 'entregar') - 0.4, '#d-again', { s: 0.9 });
          stream(svg, w1, W(0, 'vuelve'), W(0, 'vuelve') + 1.4, { every: 5, travel: 1.2, color: '#ff9366' });
          stream(svg, w2, W(0, 'vuelve') + 1.1, W(0, 'vuelve') + 2.5, { every: 5, travel: 1.2, color: '#ff9366' });
          // the notice can be lost even if the work was done
          pop(W(1, 'perder') - 0.4, '#d-lost', { s: 0.9 });
          pop(W(1, 'trabajo') - 0.2, '#d-done', { s: 0.9 });
          pop(W(1, 'garantía') - 0.3, '#d-hd', { y: 14 });
          pop(W(1, 'duplicados') - 0.3, '#d-dup', { s: 0.9 });
          hide(L(2) - 0.4, '#d-a');
          pop(L(2) - 0.2, '#d-hb', { y: 18, s: 0.97 });
          hide(W(2, 'datos') - 0.4, '#d-hb');

          // ── the two data that travel with the order
          const phone = node($('#d-n2'), { x: 120, y: 434, w: 420, h: 150, icon: 'phone', title: 'Teléfono', sub: 'del cliente', tone: 'user' });
          const wp = wire($('#d-w2'), phone.r, [680, 509], 'wire--cmd', true);
          pop(W(2, 'datos') - 0.2, '#d-sh', { y: 18, s: 0.98 });
          pop(W(2, 'viajan') - 0.2, '#d-l0v', { y: 8 });
          pop(W(2, 'identificador') - 0.3, '#d-l1v', { y: 8 });
          pop(W(2, 'teléfono') - 0.4, phone.e, { y: 14 });
          draw(W(2, 'teléfono') - 0.2, wp.p, 0.6);
          pop(W(2, 'teléfono') + 0.2, '#d-l1s', { y: 6 });
          pop(W(2, 'número') - 0.2, ['#d-l2v', '#d-l2s'], { y: 8, st: 0.15 });
          hide(L(3) - 0.4, '#d-b');

          // ── what the processing checks
          const proc = node($('#d-n3'), { x: 130, y: 425, w: 500, h: 150, icon: 'server', title: 'Servicio de pedidos', sub: 'al procesar', tone: 'evt' });
          const wa = wire($('#d-w3'), proc.r, [900, 380], 'wire--cmd');
          const wb = wire($('#d-w3'), proc.r, [900, 620], 'wire--danger');
          pop(L(3), proc.e, { y: 14 });
          draw(W(3, 'comprueba') - 0.1, wa.p, 0.6);
          pop(W(3, 'comprueba') + 0.1, '#d-ca', { y: 16, s: 0.98 });
          fade(W(3, 'evento') - 0.3, wb.p, 0.5);
          pop(W(3, 'evento') - 0.2, '#d-cb', { y: 16, s: 0.98 });
          pop(W(3, 'descarta') - 0.1, '#d-st', { s: 0.8, ease: 'back.out(2)' });
          // ── the cost, in one line
          hide(W(4, 'costo') - 0.6, '#d-c');
          pop(W(4, 'costo') - 0.3, '#d-tg', { y: 8 });
          pop(W(4, 'costo') - 0.1, '#d-q', { y: 16, s: 0.98 });
          pop(W(4, 'línea') - 0.2, '#d-qs', { y: 6 });
          pop(W(4, 'rendimiento') - 0.4, '#d-k1', { s: 0.9 });
          pop(W(4, 'integridad') - 0.4, '#d-k2', { s: 0.9 });
          pop(W(4, 'correctos') - 0.4, '#d-k3', { s: 0.9 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
