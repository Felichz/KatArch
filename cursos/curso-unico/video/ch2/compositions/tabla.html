        (() => {
          const K = KIT.scene('tabla');
          const { tl, W, L, LE, pop, hide, dim, el, IC, $, $$, wire, draw, to } = K;

          // the same limit, in two repositories
          pop(L(0) + 0.1, '#tb-h0', { y: 14 });
          pop(W(0, 'ClearView') - 0.3, '#tb-hc1', { y: 18, s: 0.97 });
          pop(W(0, 'mismo') - 0.2, '#tb-hm', { y: 6 });
          pop(W(0, 'MonitorMe') - 0.3, '#tb-hc2', { y: 18, s: 0.97 });
          hide(W(1, 'Bajó') - 0.6, '#tb-h');

          // ClearView's ADR: one of its reasons is the tool
          pop(W(1, 'Bajó') - 0.3, '#tb-adr', { y: 20, s: 0.98 });
          pop(W(1, 'prioridad') - 0.2, '#tb-tt', { y: 8 });
          pop(W(1, 'integridad') - 0.2, '#tb-r1', { y: 10 });
          pop(W(1, 'cualidad') - 0.4, '#tb-r2', { y: 10 });
          pop(W(1, 'figura') - 0.2, '#tb-on', { y: 0, s: 1 });
          // the sheet slides left to make room for the quote
          to(W(1, 'aporta') - 0.9, '#tb-adr', { left: 130, duration: 0.8 });
          pop(W(1, 'aporta') - 0.5, '#tb-qc', { y: 16, s: 0.98 });

          // a worksheet with fixed rows; what has no row stays outside
          // (the ADR stays up while "fíjate en lo que eso significa" is said)
          hide(W(2, 'tabla') - 0.7, '#tb-a');
          pop(W(2, 'tabla') - 0.2, '#tb-ws', { y: 20, s: 0.98 });
          pop(W(2, 'filas') - 0.2, $$('.tb-wr'), { y: 10, st: 0.15 });
          pop(W(2, 'fila', 1) - 0.3, '#tb-out', { y: 14, s: 0.97 });
          pop(W(2, 'pesa') - 0.3, '#tb-stw', { y: 10, s: 0.9, ease: 'back.out(1.6)' });

          // the rule
          hide(L(3) - 0.4, '#tb-b');
          pop(L(3) + 0.1, '#tb-s1', { y: 14 });
          pop(W(3, 'decidir') - 0.3, '#tb-s2', { y: 14 });

          // both teams wrote it down
          hide(W(3, 'Los') - 0.5, '#tb-d');
          pop(W(3, 'Los') - 0.3, '#tb-c1', { y: 20, s: 0.97 });
          pop(W(3, 'dos') - 0.1, '#tb-c2', { y: 20, s: 0.97 });
          pop(W(3, 'dejaron') - 0.2, $$('.tb-ch'), { y: 6, s: 0.85, st: 0.12 });
          pop(W(3, 'eso') - 0.5, '#tb-cm', { y: 12 });
          K.done();
        })();
