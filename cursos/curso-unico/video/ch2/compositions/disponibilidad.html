<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #disponibilidad .nw { position: absolute; }
        #disponibilidad .stk { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 6px; font-weight: 800; letter-spacing: -0.02em; color: #231704; background: #ffc861; box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45); transform: rotate(2.5deg); }
        #disponibilidad .ctr { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
        #disponibilidad .ctr .chip { position: relative; height: 88px; font-size: 42px; padding: 0 44px; }
        #disponibilidad .ctr .stamp { position: relative; font-size: 44px; padding: 18px 40px; }
        #disponibilidad .node__tx b { font-size: 36px; }
        #disponibilidad .node__tx small { font-size: 24px; }
        #disponibilidad .sheet__bar { font-size: 22px; }
        #disponibilidad .qc { position: absolute; left: 160px; right: 160px; top: 160px; padding: 36px 48px 32px; }
        #disponibilidad .qc__t { font-family: var(--mono); font-size: 38px; font-weight: 600; line-height: 1.45; color: var(--text); }
        #disponibilidad .qc__t em { font-style: normal; color: var(--accent-text); }
        #disponibilidad .qc .src { position: relative; text-align: left; margin-top: 18px; font-size: 20px; }
        #disponibilidad .ws { left: 470px; top: 190px; width: 980px; }
        #disponibilidad .ws .sheet__body { padding: 22px 30px; gap: 12px; }
        #disponibilidad .wr { position: relative; display: flex; align-items: center; gap: 0; height: 104px; padding: 0 18px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font-size: 36px; font-weight: 650; }
        #disponibilidad .wr__n { width: 320px; flex: none; }
        #disponibilidad .wc { width: 130px; flex: none; display: grid; place-items: center; }
        #disponibilidad .wc i { display: grid; place-items: center; width: 76px; height: 52px; border-radius: 10px; background: var(--surface3); }
        #disponibilidad .wc i svg { width: 26px; height: 26px; color: var(--amber); fill: var(--amber); }
        #disponibilidad .wh { display: flex; align-items: center; height: 40px; padding: 0 18px; font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text3); }
        #disponibilidad .wh span:first-child { width: 320px; flex: none; }
        #disponibilidad .wh .wc { color: var(--text3); }
        #disponibilidad .wr--no { border-style: dashed; border-color: rgba(255, 107, 122, 0.65); background: var(--danger-soft); color: var(--danger); }
        #disponibilidad .wr--no .wr__t { margin-left: auto; font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        #disponibilidad .adr { left: 1150px; top: 290px; width: 650px; padding: 34px 38px; display: flex; flex-direction: column; gap: 16px; }
        #disponibilidad .adr__k { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
        #disponibilidad .adr__k svg { width: 24px; height: 24px; }
        #disponibilidad .adr__q { font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1.4; }
        #disponibilidad .adr__s { font-size: 30px; font-weight: 580; color: var(--text2); line-height: 1.3; }
      </style>
      <div id="disponibilidad" class="scene" data-composition-id="disponibilidad" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="dp-a">
          <div class="nw pop" id="dp-n" style="left:620px;top:390px;width:680px;height:210px"><div class="stk" style="font-size:84px">Disponibilidad</div></div>
          <div class="ctr pop" id="dp-c2" style="top:530px"><div class="stamp stamp--danger"><span data-icon="x"></span>No salió por tener pocas menciones</div></div>
          <div class="ctr pop" id="dp-c1" style="top:680px"><span class="chip chip--cmp">tenía más menciones que dos de las elegidas</span></div>
        </div>
        <div class="layer" id="dp-b">
          <div class="card qc pop" id="dp-qc">
            <div class="qc__t">“Availability is contingent upon both <em>Performance</em> and <em>Elasticity</em>… If both are satisfactory, the system should remain available.”</div>
            <div class="src">BluzBrothers · ArchitectureCharacteristics/Characteristics.md</div>
          </div>
          <svg class="wires" id="dp-w" viewBox="0 0 1920 1080"></svg>
          <div class="tag tag--amber pop" id="dp-cons" style="left:1060px;top:765px;font-size:26px"><span data-icon="link"></span>una consecuencia de las otras dos</div>
        </div>
        <div class="layer" id="dp-t">
          <div class="hd pop" id="dp-lim" style="top:440px;font-size:92px">Un límite de <span>la herramienta</span></div>
        </div>
        <div class="layer" id="dp-c">
          <div class="sheet ws pop" id="dp-ws">
            <div class="sheet__bar"><span data-icon="table"></span>Tabla de estilos<i>puntos por estilo y por cualidad</i></div>
            <div class="sheet__body">
              <div class="wh pop" id="dp-wh"><span>cualidad</span><span class="wc">estilo</span><span class="wc">estilo</span><span class="wc">estilo</span><span class="wc">estilo</span></div>
              <div class="wr pop dp-r"><span class="wr__n">Evolutividad</span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span></div>
              <div class="wr pop dp-r"><span class="wr__n">Rendimiento</span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span></div>
              <div class="wr pop dp-r"><span class="wr__n">Elasticidad</span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span><span class="wc"><i></i></span></div>
              <div class="wr wr--no pop" id="dp-no"><span class="wr__n">Disponibilidad</span><span class="wr__t">sin fila</span></div>
            </div>
          </div>
          <div class="card adr pop" id="dp-adr">
            <div class="adr__k"><span data-icon="gavel"></span>ADR-010 · BluzBrothers</div>
            <div class="adr__q">“… may overlook potential architectural optimizations&nbsp;…”</div>
            <div class="adr__s pop" id="dp-adrs">El costo de dejarla fuera, escrito por el propio equipo.</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('disponibilidad');
          const { tl, W, L, LE, pop, hide, dim, to, el, IC, $, $$, node, wire, draw } = K;
          $$('.wr:not(.wr--no) .wc i').forEach((i) => (i.innerHTML = IC.star));

          // ── not for having few mentions: it had more than two of the chosen ones
          pop(W(0, 'disponibilidad') - 0.2, '#dp-n', { y: 14, s: 0.85, ease: 'back.out(2)' });
          // the sticker sits centred, then moves up to make room for the two lines under it
          to(W(0, 'pocas') - 0.9, '#dp-n', { top: 240, duration: 0.8 });
          pop(W(0, 'pocas') - 0.3, '#dp-c2', { y: 14, s: 0.9, ease: 'back.out(1.6)' });
          pop(W(0, 'tenía') - 0.3, '#dp-c1', { y: 10 });

          // ── the team's written argument
          hide(W(0, 'razonamiento') - 0.6, '#dp-a');
          pop(W(0, 'razonamiento') - 0.3, '#dp-qc', { y: 16, s: 0.98 });
          const P = node($('#dp-b'), { x: 220, y: 490, w: 480, h: 140, tone: 'user', icon: 'gauge', title: 'Rendimiento', sub: 'responde rápido' });
          const E = node($('#dp-b'), { x: 220, y: 670, w: 480, h: 140, tone: 'evt', icon: 'trendUp', title: 'Elasticidad', sub: 'aguanta la carga' });
          const A = node($('#dp-b'), { x: 1060, y: 575, w: 560, h: 150, tone: 'built', icon: 'shieldCheck', title: 'Disponibilidad', sub: 'sigue disponible' });
          const w1 = wire($('#dp-w'), P.r, A.l, 'wire--accent');
          const w2 = wire($('#dp-w'), E.r, A.l, 'wire--accent');
          pop(W(1, 'responde') - 0.2, P.e, { y: 14, s: 0.97 });
          pop(W(1, 'aguanta') - 0.2, E.e, { y: 14, s: 0.97 });
          draw(W(1, 'seguir') - 0.5, w1.p);
          draw(W(1, 'seguir') - 0.4, w2.p);
          pop(W(1, 'seguir') - 0.1, A.e, { y: 14, s: 0.97 });
          pop(W(1, 'consecuencia') - 0.2, '#dp-cons', { y: 8 });

          // ── the tool's limit: a worksheet with fixed rows
          hide(L(2) - 0.4, '#dp-b');
          pop(L(2) + 0.2, '#dp-lim', { y: 14 });
          hide(W(2, 'tabla') - 0.5, '#dp-lim');
          pop(W(2, 'tabla') - 0.2, '#dp-ws', { y: 20, s: 0.98 });
          pop(W(2, 'tabla') + 0.3, '#dp-wh', { y: 8 });
          pop(W(2, 'estilos') - 0.1, $$('.dp-r'), { y: 10, st: 0.3 });

          // ── the row it does not have, and the cost written down
          pop(W(2, 'fila') - 0.2, '#dp-no', { y: 10 });
          // the worksheet slides left to make room for the decision
          to(W(3, 'decisión') - 1.1, '#dp-ws', { left: 130, duration: 0.8 });
          pop(W(3, 'decisión') - 0.3, '#dp-adr', { y: 20, s: 0.98 });
          pop(W(3, 'costo') - 0.2, '#dp-adrs', { y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
