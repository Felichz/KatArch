<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #cierre .tag0 { left: 150px; top: 150px; font-size: 26px; }
        #cierre .tbl { left: 150px; top: 205px; width: 1620px; grid-template-columns: 420px 700px 500px; gap: 12px; }
        #cierre .tbl__c { font-size: 34px; min-height: 104px; }
        #cierre .tbl__c svg { width: 38px; height: 38px; }
        #cierre .tbl__c small { font-size: 26px; font-weight: 560; color: var(--text2); }
        #cierre .tbl__c b { font-weight: 800; }
        #cierre .tbl__c--price { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
        #cierre .tbl__c--top { border-color: rgba(255, 122, 69, 0.6); background: var(--accent-soft); }
        #cierre .tbl__c--top b { font-size: 42px; color: var(--accent-text); }
        #cierre .tbl__c--hid { border-style: dashed; border-color: rgba(255, 200, 97, 0.6); background: var(--amber-soft); color: var(--amber); font-weight: 720; }
        #cierre .tbl__c--none { background: transparent; border-color: var(--line); color: var(--text3); }
        #cierre .tbl__h { height: 40px; display: flex; align-items: center; font-size: 24px; }
        #cierre .tbl__h--hid { color: var(--amber); }
        #cierre .on { border-radius: 14px; }
        #cierre .src { top: 846px; font-size: 22px; }
        #cierre .hand { left: 150px; right: 150px; text-align: center; top: 770px; font-size: 42px; }
        #cierre .stmt { top: 400px; font-size: 100px; }
        #cierre .sub { top: 610px; font-size: 56px; }
        #cierre .lead { position: absolute; left: 160px; right: 160px; top: 450px; text-align: center; font-size: 96px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.08; color: var(--text); }
        #cierre .lead span { color: var(--accent-text); }
        #cierre .lead__ic { position: absolute; left: 50%; margin-left: -60px; top: 300px; width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #cierre .lead__ic svg { width: 70px; height: 70px; }
      </style>
      <div id="cierre" class="scene" data-composition-id="cierre" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>

        <div class="layer" id="ci-a">
          <span class="tag tag--accent tag0 pop" id="ci-tg"><span data-icon="file"></span>la tabla del ADR · Farmacy Food</span>
          <div class="tbl pop" id="ci-tbl">
            <div class="tbl__h">Opción</div>
            <div class="tbl__h">Precio</div>
            <div class="tbl__h tbl__h--hid"><span class="pop" id="ci-hh">Tiempo de una persona</span></div>

            <div class="tbl__c"><span data-icon="code"></span>Código abierto</div>
            <div class="tbl__c tbl__c--price">Gratis</div>
            <div class="tbl__c tbl__c--hid pop" id="ci-x1">0,2 a 0,5 de una persona</div>

            <div class="tbl__c"><span data-icon="code"></span>Código abierto</div>
            <div class="tbl__c tbl__c--price">Gratis</div>
            <div class="tbl__c tbl__c--hid pop" id="ci-x2">0,2 a 0,5 de una persona</div>

            <div class="tbl__c"><span data-icon="cloud"></span>De pago</div>
            <div class="tbl__c tbl__c--price">0,30 USD<small>primeras 10.000 métricas</small></div>
            <div class="tbl__c tbl__c--none">—</div>

            <div class="tbl__c" id="ci-dd"><span data-icon="activity"></span>DataDog</div>
            <div class="tbl__c tbl__c--price tbl__c--top" id="ci-dp"><b>15 USD por servidor al mes</b><div class="on pop" id="ci-on"></div></div>
            <div class="tbl__c tbl__c--none">—</div>
          </div>
          <div class="hand pop" id="ci-hand">hubo que escribirlo para poder compararlo</div>
          <div class="src pop" id="ci-src">ArchColider · 4.ADRs/003 Tracing and Monitoring Sytem.md</div>
        </div>

        <div class="layer" id="ci-b">
          <span class="lead__ic pop" id="ci-lic" data-icon="scale"></span>
          <div class="lead pop" id="ci-ld">El hábito <span>que atraviesa el curso</span></div>
          <div class="stmt pop" id="ci-st">Poner a la vista <span>lo que cuesta cada opción</span></div>
          <div class="sub pop" id="ci-sb">incluido <b>lo que no aparece en ninguna lista de precios</b></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('cierre');
          const { tl, W, L, LE, pop, hide, dim, to, fade, IC, $, next } = K;
          const N = next({ k: 'Próxima lección · 2', t: 'Del pedido a tres cualidades', q: 'Cómo se sacan del pedido del cliente las pocas cualidades que deciden la forma del sistema', top: 340 });

          // the ADR's table: DataDog's price in bold
          pop(L(0) - 0.1, ['#ci-tg', '#ci-tbl'], { y: 16, s: 0.99, st: 0.1 });
          pop(W(0, 'negrita') - 0.2, '#ci-on', { y: 0, s: 1.01 });
          // the free option's price, hidden in a person's time
          dim(W(1, 'opción') - 0.2, ['#ci-dd', '#ci-dp'], 0.4);
          pop(W(1, 'escondido') - 0.3, '#ci-hh', { y: 6 });
          pop(W(1, 'tiempo') - 0.2, ['#ci-x1', '#ci-x2'], { y: 10, st: 0.15 });
          pop(W(1, 'escribirlo') - 0.3, '#ci-hand', { y: 10 });
          pop(W(1, 'escribirlo') + 0.2, '#ci-src', { y: 6 });

          // what this architecture does: put every cost in view
          hide(L(2) - 0.4, '#ci-a');
          pop(L(2) + 0.1, '#ci-lic', { y: 14, s: 0.9 });
          pop(L(2) + 0.2, '#ci-ld', { y: 16 });
          hide(W(2, 'Poner') - 0.5, ['#ci-lic', '#ci-ld'], 0.4);
          pop(W(2, 'Poner') - 0.2, '#ci-st', { y: 16 });
          to(W(2, 'incluido') - 1.0, '#ci-st', { y: -120, duration: 0.8 });
          pop(W(2, 'incluido') - 0.2, '#ci-sb', { y: 12 });

          // next lesson
          // the card follows the last words: label and title together, the description right after
          hide(LE(2) + 0.1, '#ci-b');
          pop(LE(2) + 0.5, N.k, { y: 16 });
          pop(LE(2) + 0.7, N.t, { y: 36, d: 0.9, ease: 'expo.out' });
          pop(LE(2) + 1.4, N.q, { y: 16 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
