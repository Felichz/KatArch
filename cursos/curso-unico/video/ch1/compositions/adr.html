<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #adr .sheet { left: 120px; top: 170px; width: 1250px; }
        #adr .sheet__bar { height: 64px; font-size: 24px; }
        #adr .sheet__bar svg { width: 26px; height: 26px; }
        #adr .sheet__body { padding: 20px 26px 24px; gap: 12px; }
        #adr .sec { position: relative; display: grid; grid-template-columns: 330px 1fr; gap: 22px; align-items: center; min-height: 132px; padding: 14px 24px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
        #adr .sec__l { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 720; letter-spacing: -0.01em; }
        #adr .sec__l svg { width: 40px; height: 40px; flex: none; color: var(--text2); }
        #adr .sec__c { padding-right: 56px; font-size: 28px; font-weight: 580; line-height: 1.3; color: var(--text); }
        #adr .sec__c .chip { position: relative; display: inline-flex; margin: 3px 8px 3px 0; height: 52px; font-size: 26px; }
        #adr .sec__c b { color: var(--accent-text); font-weight: 760; }
        #adr .sec__c i { display: block; margin-top: 8px; font-style: italic; color: var(--amber); font-weight: 620; }
        #adr .sec { opacity: 0.4; }
        #adr .hint { font-size: 26px; color: var(--text3); font-weight: 560; }
        #adr .team { left: 120px; top: 124px; font-size: 24px; }
        #adr .side { position: absolute; left: 1410px; width: 390px; top: 170px; padding: 34px 32px 38px; }
        #adr .side b { display: block; font-family: var(--mono); font-size: 130px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
        #adr .side span { display: block; margin-top: 16px; font-size: 32px; font-weight: 700; line-height: 1.2; }
        #adr .side small { display: block; margin-top: 12px; font-size: 26px; font-weight: 560; color: var(--text2); line-height: 1.3; }
        #adr .hero { position: absolute; left: 120px; right: 120px; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
        #adr .hero__a { font-size: 56px; font-weight: 700; color: var(--text2); display: flex; align-items: center; gap: 22px; }
        #adr .hero__a svg { width: 56px; height: 56px; }
        #adr .hero__b { font-size: 150px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: var(--accent); display: flex; align-items: center; gap: 30px; }
        #adr .hero__b svg { width: 120px; height: 120px; }
        #adr .hero__c { font-size: 84px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; display: flex; align-items: center; gap: 24px; }

        #adr .mid { position: absolute; left: 0; right: 0; top: 310px; display: flex; justify-content: center; gap: 40px; padding: 0 120px; }
        #adr .mid .card { position: relative; width: 780px; min-height: 380px; padding: 48px 52px; display: flex; flex-direction: column; justify-content: center; }
        #adr .fmt { align-items: flex-start; gap: 28px; font-size: 54px; font-weight: 740; letter-spacing: -0.025em; line-height: 1.15; }
        #adr .fmt svg { width: 96px; height: 96px; color: var(--cmp); }
        #adr .acr b { display: block; font-family: var(--mono); font-size: 190px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
        #adr .acr span { display: block; margin-top: 20px; font-size: 46px; font-weight: 700; line-height: 1.2; }
        #adr .acr small { display: block; margin-top: 14px; font-size: 32px; font-weight: 560; color: var(--text2); line-height: 1.3; }
      </style>
      <div id="adr" class="scene" data-composition-id="adr" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <span class="tag tag--accent team pop" id="ad-team"><span data-icon="thermometer"></span>el ADR de Farmacy Food</span>
        <div class="hero" id="ad-hero">
          <div class="hero__a pop" id="ad-h1"><span data-icon="file"></span>La elección de DataDog, por escrito</div>
          <div class="hero__c pop" id="ad-h3">en un documento corto</div>
          <div class="hero__b pop" id="ad-h2"><span data-icon="file"></span>de una página</div>
        </div>
        <div class="mid" id="ad-mid">
          <div class="card fmt pop" id="ad-fmt"><span data-icon="users"></span>Un formato que usan todos los ganadores</div>
          <div class="card acr pop" id="ad-acr"><b>ADR</b><span>architecture decision record</span><small>el registro de una decisión de arquitectura</small></div>
        </div>
        <div class="card side pop" id="ad-side"><b>ADR</b><span>architecture decision record</span><small>el registro de una decisión de arquitectura</small></div>
        <div class="sheet pop" id="ad-sheet">
          <div class="sheet__bar"><span data-icon="file"></span>003 Tracing and Monitoring Sytem.md<i>ArchColider</i></div>
          <div class="sheet__body">
            <div class="sec sec--1" id="ad-s1"><span class="sec__l"><span data-icon="target"></span>Por qué decidir</span><span class="sec__c pop" id="ad-c1">El sistema iba a crecer rápido, y agregar servidores a tiempo dependía de saber qué pasaba en cada uno.</span></div>
            <div class="sec sec--2" id="ad-s2"><span class="sec__l"><span data-icon="split"></span>Alternativas</span><span class="sec__c"><span class="chip pop" id="ad-a1">Código abierto · gratis</span><span class="chip pop" id="ad-a2">Código abierto · gratis</span><span class="chip pop" id="ad-a3">De pago · 0,30 USD / 10.000 métricas</span></span></div>
            <div class="sec sec--3" id="ad-s3"><span class="sec__l"><span data-icon="coins"></span>Costo de lo elegido</span><span class="sec__c"><span class="pop" id="ad-p"><b>DataDog</b> · 15 USD por servidor al mes</span><i class="pop" id="ad-q">“the price might increase”</i></span></div>
            <div class="sec sec--4" id="ad-s4"><span class="sec__l"><span data-icon="clipCheck"></span>Requisito</span><span class="sec__c"><span class="hint pop" id="ad-h">el requisito del cliente que pide esta decisión</span><span class="chip chip--cmd pop" id="ad-v" style="margin-top: 10px"><span data-icon="searchCheck"></span>para comprobar si se cumple</span></span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('adr');
          const { tl, W, L, LE, pop, hide, dim, to, fade, IC, $ } = K;

          // the team's one-page document of the DataDog choice
          pop(L(0), '#ad-h1', { y: 14 });
          pop(W(0, 'documento') - 0.2, '#ad-h3', { y: 14 });
          pop(W(0, 'página') - 0.4, '#ad-h2', { y: 16, s: 0.97 });
          // the format every winner uses, and its name
          hide(W(0, 'formato') - 0.8, '#ad-hero', 0.4);
          pop(W(0, 'formato') - 0.2, '#ad-fmt', { y: 14 });
          pop(W(0, 'ADR') - 0.2, '#ad-acr', { y: 14 });
          // the sheet itself, with its four parts in view from "cuatro cosas" (dimmed, label only); each part lights up when the voice reaches it
          hide(W(1, 'cuatro') - 0.6, '#ad-mid', 0.4);
          pop(W(1, 'cuatro') - 0.5, '#ad-team', { y: 8 });
          pop(W(1, 'cuatro') - 0.4, '#ad-sheet', { y: 20, s: 0.99 });
          pop(W(1, 'cuatro') - 0.3, '#ad-side', { y: 14 });
          dim(W(1, 'cuatro') + 0.5, '#ad-side', 0.3);
          to(W(2, 'Dice') - 0.2, '#ad-s1', { opacity: 1, duration: 0.4 });
          pop(W(2, 'crecer') - 0.2, '#ad-c1', { y: 8 });
          to(W(3, 'Dice') - 0.2, '#ad-s2', { opacity: 1, duration: 0.4 });
          pop(W(3, 'precio') - 0.2, '#ad-a1', { s: 0.85, y: 6 });
          pop(W(3, 'tres') - 0.2, '#ad-a2', { s: 0.85, y: 6 });
          pop(W(3, 'perdieron') - 0.2, '#ad-a3', { s: 0.85, y: 6 });
          to(W(3, 'Dice', 1) - 0.2, '#ad-s3', { opacity: 1, duration: 0.4 });
          pop(W(3, 'elegido') - 0.2, '#ad-p', { y: 8 });
          pop(W(3, 'admite') - 0.1, '#ad-q', { y: 8 });
          to(W(4, 'cuarta') - 0.2, '#ad-s4', { opacity: 1, duration: 0.4 });
          pop(W(4, 'requisito') - 0.1, '#ad-h', { y: 8 });
          pop(W(4, 'comprobar') - 0.2, '#ad-v', { s: 0.85, y: 6 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
