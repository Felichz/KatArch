<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #pregunta .hd { top: 430px; font-size: 68px; }
        #pregunta .tc__n { font-size: 26px; }
        #pregunta .row3 { position: absolute; left: 140px; right: 140px; top: 400px; display: flex; align-items: stretch; gap: 30px; }
        #pregunta .row3 .tc { flex: 1; min-height: 400px; justify-content: center; gap: 22px; }
        #pregunta .row3 .tc__ic { width: 84px; height: 84px; border-radius: 22px; }
        #pregunta .row3 .tc__ic svg { width: 46px; height: 46px; }
        #pregunta .row3 .tc__t { font-size: 46px; }
        #pregunta .row3 .tc__b { font-size: 28px; }
        #pregunta .arr { align-self: center; flex: none; width: 150px; text-align: center; font-family: var(--mono); font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); line-height: 1.4; }
        #pregunta .arr i { display: block; font-style: normal; font-size: 64px; color: var(--accent-text); letter-spacing: 0; }
        #pregunta .ft { display: flex; flex-wrap: wrap; gap: 12px; }
        #pregunta .ft .chip { position: relative; height: 52px; font-size: 26px; padding: 0 20px; }
        #pregunta .ttl { top: 130px; gap: 20px; }
        #pregunta .ttl__h { font-size: 112px; }
        #pregunta .cards { top: 640px; }
        #pregunta .cards .tc { min-height: 230px; padding: 24px 26px; gap: 12px; }
        #pregunta .cards .tc__ic { width: 56px; height: 56px; }
        #pregunta .cards .tc__t { font-size: 34px; }
      </style>
      <div id="pregunta" class="scene" data-composition-id="pregunta" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>

        <div class="layer" id="pr-a">
          <div class="hd pop" id="pr-hd">¿Qué cambia cuando una parte del sistema <span>es un modelo de inteligencia artificial</span>?</div>
          <div class="row3">
            <div class="tc tc--cmd pop" id="pr-c1"><div class="tc__hd"><span class="tc__ic" data-icon="gavel"></span></div><span class="tc__t">Las mismas decisiones del curso</span></div>
            <div class="arr pop" id="pr-ar"><i>→</i>aplicadas a</div>
            <div class="tc tc--accent pop" id="pr-c2"><div class="tc__hd"><span class="tc__ic" data-icon="dice"></span></div><span class="tc__t">Una pieza que no es determinista</span>
              <div class="ft"><span class="chip chip--accent pop" id="pr-k1"><span data-icon="repeat"></span>la misma entrada</span><span class="chip chip--danger pop" id="pr-k2"><span data-icon="notEqual"></span>respuestas distintas</span></div>
            </div>
          </div>
        </div>

        <div class="layer" id="pr-b">
          <div class="cards cards--4">
            <div class="tc tc--danger pop" id="pr-d1"><div class="tc__hd"><span class="tc__ic" data-icon="ban"></span><span class="tc__n">1</span></div><span class="tc__t">Qué no puede decidir el modelo</span></div>
            <div class="tc tc--accent pop" id="pr-d2"><div class="tc__hd"><span class="tc__ic" data-icon="help"></span><span class="tc__n">2</span></div><span class="tc__t">Qué pasa cuando duda</span></div>
            <div class="tc tc--cmd pop" id="pr-d3"><div class="tc__hd"><span class="tc__ic" data-icon="ruler"></span><span class="tc__n">3</span></div><span class="tc__t">Cómo se mide antes de confiar</span></div>
            <div class="tc tc--evt pop" id="pr-d4"><div class="tc__hd"><span class="tc__ic" data-icon="refresh"></span><span class="tc__n">4</span></div><span class="tc__t">Cómo se cambia</span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('pregunta');
          const { tl, W, L, LE, pop, hide, dim, to, fade, IC, $, title } = K;
          const T = title({ k: 'Lección 10', h: 'Cuando una parte del sistema es un modelo', s: 'KatArch · el curso de los ganadores de las Architecture Katas', top: 130 });

          // the question: the same decisions, applied to a piece that does not always answer the same
          pop(L(0), '#pr-hd', { y: 14 });
          // the question sits alone in the middle until the first card arrives, then moves up to make room
          to(W(1, 'decisiones') - 0.6, '#pr-hd', { y: -240, duration: 0.8 });
          pop(W(1, 'decisiones') - 0.3, '#pr-c1', { y: 20, s: 0.98 });
          pop(W(1, 'aplicadas') - 0.2, '#pr-ar', { y: 10 });
          pop(W(1, 'pieza') - 0.3, '#pr-c2', { y: 20, s: 0.98 });
          pop(W(1, 'entrada') - 0.5, '#pr-k1', { y: 8, s: 0.85 });
          pop(W(1, 'siempre') - 0.2, '#pr-k2', { y: 8, s: 0.85 });

          // the lesson's title closes the opening, and under it the four questions it will answer
          hide(LE(1) + 0.05, '#pr-a');
          T.show(LE(1) + 0.3, LE(1) + 1.3);
          pop(W(2, 'puede') - 0.3, '#pr-d1', { y: 20, s: 0.98 });
          pop(W(2, 'pasa') - 0.3, '#pr-d2', { y: 20, s: 0.98 });
          pop(W(2, 'mide') - 0.3, '#pr-d3', { y: 20, s: 0.98 });
          pop(W(2, 'cambia') - 0.3, '#pr-d4', { y: 20, s: 0.98 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
