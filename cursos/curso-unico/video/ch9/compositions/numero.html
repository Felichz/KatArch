<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #numero .node__tx b { font-size: 33px; }
        #numero .node__tx small { font-size: 24px; }
        #numero .sheet__bar { font-size: 22px; }
        #numero .node__ic { width: 70px; height: 70px; }
        #numero .node__ic svg { width: 38px; height: 38px; }
        #numero .mc { position: absolute; left: 900px; top: 250px; width: 880px; height: 520px; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        #numero .mc__h { display: flex; align-items: center; gap: 28px; }
        #numero .mc__ic { flex: none; width: 112px; height: 112px; border-radius: 28px; display: grid; place-items: center; background: var(--cmp-soft); color: var(--cmp); }
        #numero .mc__ic svg { width: 62px; height: 62px; }
        #numero .mc__t { font-size: 76px; font-weight: 820; letter-spacing: -0.04em; }
        #numero .mc .chip { position: relative; height: 68px; font-size: 30px; padding: 0 28px; align-self: flex-start; }
        #numero .mc .chip svg { width: 32px; height: 32px; }
        #numero .gr { position: absolute; left: 120px; width: 740px; top: 860px; height: 4px; border-radius: 2px; background: var(--line-strong); }
        #numero .step { position: absolute; width: 360px; padding: 24px 26px; gap: 12px; border-radius: 22px 22px 0 0; border-bottom: none; }
        #numero .step .tc__t { font-size: 32px; }
        #numero .step .tc__b { font-size: 26px; }
        #numero .step .tc__n { font-size: 24px; letter-spacing: 0.04em; }
        #numero .step .tc__ic { width: 60px; height: 60px; }
        #numero .lk { position: absolute; right: 22px; top: 22px; width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; }
        #numero .lk svg { width: 46px; height: 46px; }
        #numero .lk--c { background: var(--surface3); border: 2px solid var(--line-strong); color: var(--text2); }
        #numero .lk--o { background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent-text); box-shadow: 0 0 40px rgba(255, 122, 69, 0.4); }
        #numero svg.up { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #numero .up path { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
        #numero .cond { left: 900px; top: 200px; width: 880px; }
        #numero .cond .sheet__body { gap: 14px; padding: 24px 28px; }
        #numero .cnd { position: relative; display: flex; align-items: center; gap: 26px; height: 112px; padding: 0 26px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); }
        #numero .cnd__ic { flex: none; width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #numero .cnd__ic svg { width: 40px; height: 40px; }
        #numero .cnd__v { font-family: var(--mono); font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
        #numero .cnd__d { font-size: 25px; font-weight: 580; color: var(--text2); margin-top: 4px; }
        #numero .cnd__en { font-family: var(--mono); font-size: 24px; color: var(--text3); margin-top: 6px; }
        #numero .rej { position: absolute; left: 900px; top: 300px; width: 880px; height: 340px; border-style: dashed; padding: 40px 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
        #numero .rej__t { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 780; letter-spacing: -0.025em; line-height: 1.12; position: relative; color: var(--text2); }
        #numero .rej__t svg { width: 64px; height: 64px; flex: none; color: var(--text3); }
        #numero .rej .stamp { right: 40px; bottom: 34px; font-size: 32px; padding: 16px 30px; }
        #numero .rej .en { font-family: var(--mono); font-size: 24px; color: var(--text3); }
        #numero .jsn { left: 750px; top: 320px; width: 420px; height: 270px; padding: 28px 32px; gap: 12px; }
        #numero .jsn .tc__t { font-size: 34px; }
        #numero .qt { position: absolute; left: 160px; right: 160px; top: 740px; text-align: center; font-size: 36px; font-style: italic; font-weight: 600; line-height: 1.3; }
        #numero .qsrc { top: 806px; font-size: 22px; }
        #numero .nse { left: 1280px; top: 580px; height: 56px; font-size: 24px; }
        #numero .hd { top: 128px; font-size: 64px; }
        #numero .hd span { color: var(--accent-text); }
        #numero .cl4 { position: absolute; left: 330px; right: 330px; top: 240px; display: flex; flex-direction: column; gap: 20px; }
        #numero .rw { position: relative; display: flex; align-items: center; gap: 28px; height: 144px; padding: 0 36px; border-radius: 22px; background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1.5px solid var(--line-strong); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 22px 50px rgba(0, 0, 0, 0.45); }
        #numero .rw__ic { flex: none; width: 80px; height: 80px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #numero .rw__ic svg { width: 44px; height: 44px; }
        #numero .rw__t { font-size: 42px; font-weight: 740; letter-spacing: -0.02em; line-height: 1.12; }
        #numero .rw__t small { display: block; margin-top: 6px; font-size: 26px; font-weight: 560; color: var(--text2); letter-spacing: 0; }
      </style>
      <div id="numero" class="scene" data-composition-id="numero" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <svg class="wires" id="nu-w" viewBox="0 0 1920 1080"></svg>
        <div class="layer" id="nu-d"></div>

        <div class="card mc pop" id="nu-mc">
          <div class="mc__h"><span class="mc__ic" data-icon="carFront"></span><span class="mc__t">MobilityCorp</span></div>
          <span class="chip chip--cmp pop" id="nu-m1"><span data-icon="calculator"></span>sí puso números</span>
          <span class="chip chip--cmp pop" id="nu-m2"><span data-icon="brainCircuit"></span>en sus modelos de inteligencia artificial</span>
          <span class="chip pop" id="nu-m3"><span data-icon="camera"></span>detectar daños en las fotos</span>
        </div>
        <!-- A · the staircase and its written condition -->
        <span class="gr pop" id="nu-gr"></span>
        <div class="tc tc--ext step pop" id="nu-s1" style="left: 120px; top: 560px; height: 300px">
          <div class="tc__hd"><span class="tc__ic" data-icon="cloud"></span><span class="tc__n">Peldaño 1</span></div>
          <span class="tc__t">Servicio gestionado</span>
          <span class="tc__b pop" id="nu-s1b">entrena el modelo casi solo</span>
        </div>
        <div class="tc tc--cmp step pop" id="nu-s2" style="left: 500px; top: 380px; height: 480px">
          <div class="tc__hd"><span class="tc__ic" data-icon="cpu"></span><span class="tc__n">Peldaño 2</span></div>
          <span class="tc__t">Modelo propio</span>
          <span class="lk lk--c pop" id="nu-lk" data-icon="lock"></span>
          <span class="lk lk--o pop" id="nu-ul" data-icon="unlock"></span>
        </div>
        <svg class="up" viewBox="0 0 1920 1080"><path id="nu-up" d="M300 546 C300 480 380 450 492 440" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></svg>
        <div class="sheet cond pop" id="nu-cond">
          <div class="sheet__bar"><span data-icon="file"></span>Five Nines · adrs/ADR-0020<i>la condición para subir</i></div>
          <div class="sheet__body">
            <div class="cnd pop" id="nu-c1"><span class="cnd__ic" data-icon="target"></span><div><div class="cnd__v">mAP &lt; 0,75</div><div class="cnd__d">a los 3 meses en producción · va de 0 a 1</div></div></div>
            <div class="cnd pop" id="nu-c2"><span class="cnd__ic" data-icon="alert"></span><div><div class="cnd__v">Falsos positivos &gt; 10 %</div><div class="cnd__d">de forma sostenida</div></div></div>
            <div class="cnd pop" id="nu-c3"><span class="cnd__ic" data-icon="clock"></span><div><div class="cnd__v">Respuesta &gt; 5 s</div><div class="cnd__d">en el 95 % de los casos, de forma sostenida</div></div></div>
            <div class="cnd pop" id="nu-c4"><span class="cnd__ic" data-icon="frown"></span><div><div class="cnd__v">Quejas de clientes</div><div class="cnd__d">que el negocio note, de forma sostenida</div></div></div>
          </div>
        </div>

        <!-- B · what they rejected -->
        <div class="card rej pop" id="nu-rej">
          <span class="rej__t"><span data-icon="cpu"></span>Modelo propio desde el primer día<span class="cross pop" id="nu-rx" style="left: 80px"></span></span>
          <span class="en">ADR-0020 · rejected</span>
          <span class="stamp stamp--danger pop" id="nu-st"><span data-icon="x"></span>optimización prematura</span>
        </div>

        <!-- C · one format, two models -->
        <div class="tc tc--accent jsn pop" id="nu-js">
          <div class="tc__hd"><span class="tc__ic" data-icon="code"></span><span class="tc__n">Mismo formato</span></div>
          <span class="tc__t">La misma respuesta, venga de donde venga</span>
        </div>
        <div class="qt pop" id="nu-qt">“All models (AutoML or custom) must output standardized JSON”</div>
        <div class="src qsrc pop" id="nu-qs">Five Nines · adrs/ADR-0020</div>
        <span class="chip nse pop" id="nu-nse"><span data-icon="eyeOff"></span>no se entera de cuál está detrás</span>

        <!-- D · what a complete condition has -->
        <div class="hd pop" id="nu-h">Una condición completa <span>tiene cuatro partes</span></div>
        <div class="cl4" id="nu-cl">
          <div class="rw pop" id="nu-k1"><span class="rw__ic" data-icon="gauge"></span><span class="rw__t">Qué se mide<small>mAP, falsos positivos, tiempo de respuesta, quejas</small></span></div>
          <div class="rw pop" id="nu-k2"><span class="rw__ic" data-icon="target"></span><span class="rw__t">Qué valor dispara el cambio<small>mAP bajo 0,75, más del 10 %, más de 5 segundos</small></span></div>
          <div class="rw pop" id="nu-k3"><span class="rw__ic" data-icon="clock"></span><span class="rw__t">En cuánto tiempo<small>a los 3 meses, o de forma sostenida</small></span></div>
          <div class="rw pop" id="nu-k4"><span class="rw__ic" data-icon="lock"></span><span class="rw__t">Qué queda fijo para que cambiar sea barato<small>el mismo formato de respuesta</small></span></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('numero');
          const { tl, W, L, LE, pop, hide, dim, to, fade, draw, IC, $, $$, node, wire } = K;
          const svg = $('#nu-w'), layer = $('#nu-d');

          // MobilityCorp starts with a managed service
          pop(W(0, 'MobilityCorp') - 0.2, '#nu-mc', { y: 18, s: 0.98 });
          pop(W(0, 'números') - 0.2, '#nu-m1', { y: 8, s: 0.92 });
          pop(W(0, 'inteligencia') - 0.3, '#nu-m2', { y: 8, s: 0.92 });
          pop(W(0, 'fotos') - 0.4, '#nu-m3', { y: 8, s: 0.92 });
          pop(W(0, 'empieza') - 0.3, ['#nu-gr', '#nu-s1'], { y: 20, s: 0.98, st: 0.15 });
          pop(W(0, 'entrena') - 0.2, '#nu-s1b', { y: 8 });
          hide(L(1) - 0.4, '#nu-mc');
          pop(W(0, 'propio') - 0.3, '#nu-s2', { y: 24, s: 0.98 });
          pop(W(0, 'propio') + 0.3, '#nu-lk', { s: 0.8 });
          draw(W(0, 'propio') - 0.1, '#nu-up', 0.9);
          // the written condition to climb: four parts, one per measure
          pop(L(1) - 0.1, '#nu-cond', { y: 18, s: 0.98 });
          // the four rows wait dimmed, and the voice lights each one
          tl.fromTo(['#nu-c1', '#nu-c2', '#nu-c3', '#nu-c4'], { opacity: 0, y: 10 }, { opacity: 0.3, y: 0, duration: 0.5, stagger: 0.12 }, L(1) + 0.3);
          to(W(1, 'mAP') - 0.3, '#nu-c1', { opacity: 1, duration: 0.4 });
          to(W(2, 'falsos') - 0.3, '#nu-c2', { opacity: 1, duration: 0.4 });
          to(W(3, 'respuesta') - 0.3, '#nu-c3', { opacity: 1, duration: 0.4 });
          to(W(3, 'negocio') - 0.3, '#nu-c4', { opacity: 1, duration: 0.4 });
          to(W(3, 'quejan') + 0.5, '#nu-lk', { opacity: 0, duration: 0.3 });
          pop(W(3, 'quejan') + 0.5, '#nu-ul', { s: 0.8, ease: 'back.out(2)' });

          // what they refused: building their own from day one
          hide(L(4) - 0.6, '#nu-cond');
          pop(W(4, 'Construir') + 0.1, '#nu-rej', { y: 18, s: 0.98 });
          tl.fromTo('#nu-rx', { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power2.inOut', transformOrigin: '0 50%' }, W(4, 'rechazaron') - 0.1);
          pop(W(4, 'optimización') - 0.2, '#nu-st', { y: 8, s: 1.15, ease: 'back.out(2)' });

          // one piece makes the change possible: the same response format
          hide(L(5) - 0.4, ['#nu-rej', '#nu-s1', '#nu-s2', '#nu-gr', '#nu-lk', '#nu-ul']);
          hide(L(5) - 0.4, $$('.up'));
          const mA = node(layer, { x: 110, y: 210, w: 540, h: 176, icon: 'cloud', title: 'Modelo gestionado', sub: 'un servicio', tone: 'ext' });
          const mB = node(layer, { x: 110, y: 520, w: 540, h: 176, icon: 'cpu', title: 'Modelo propio', sub: 'entrenado por el equipo', tone: 'cmp' });
          const sy = node(layer, { x: 1280, y: 365, w: 540, h: 176, icon: 'boxes', title: 'Resto del sistema', sub: 'recibe siempre lo mismo', tone: 'user' });
          const w1 = wire(svg, mA.r, [750, 390], 'wire--accent');
          const w2 = wire(svg, mB.r, [750, 510], 'wire--accent');
          const w3 = wire(svg, [1170, 453], sy.l, 'wire--accent', true);
          pop(W(5, 'gestionado') - 0.3, mA.e, { y: 16 });
          pop(W(5, 'propio') - 0.3, mB.e, { y: 16 });
          pop(W(5, 'mismo') - 0.3, '#nu-js', { y: 18, s: 0.98 });
          draw(W(5, 'devuelven'), w1.p, 0.7);
          draw(W(5, 'devuelven') + 0.1, w2.p, 0.7);
          pop(W(5, 'resto') - 0.3, sy.e, { y: 16 });
          draw(W(5, 'resto'), w3.p, 0.7);
          pop(W(5, 'formato') + 0.5, ['#nu-qt', '#nu-qs'], { y: 8, st: 0.15 });
          pop(W(5, 'entera') - 0.3, '#nu-nse', { y: 8, s: 0.92 });

          // a complete condition: what is measured, the value, the time, and what stays fixed
          hide(L(6) - 0.5, [mA.e, mB.e, sy.e, '#nu-js', '#nu-qt', '#nu-qs', '#nu-nse', '#nu-w']);
          pop(L(6), '#nu-h', { y: 14 });
          pop(W(6, 'mide') - 0.4, '#nu-k1', { y: 18, s: 0.98 });
          pop(W(6, 'valor') - 0.4, '#nu-k2', { y: 18, s: 0.98 });
          pop(W(6, 'tiempo') - 0.4, '#nu-k3', { y: 18, s: 0.98 });
          pop(W(6, 'fijo') - 0.4, '#nu-k4', { y: 18, s: 0.98 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
