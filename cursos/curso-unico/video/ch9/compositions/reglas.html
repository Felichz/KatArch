<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #reglas .node__tx b { font-size: 29px; }
        #reglas .node__tx small { font-size: 24px; }
        #reglas .node__ic { width: 58px; height: 58px; }
        #reglas .node__ic svg { width: 32px; height: 32px; }
        #reglas .stmt { top: 200px; font-size: 72px; text-wrap: balance; }
        #reglas .big { position: absolute; left: 460px; top: 520px; width: 1000px; height: 270px; padding: 34px 50px; display: flex; align-items: center; gap: 40px; }
        #reglas .big__ic { flex: none; width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #reglas .big__ic svg { width: 66px; height: 66px; }
        #reglas .big__t { font-size: 66px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
        #reglas .big__s { font-family: var(--mono); font-size: 38px; font-weight: 600; color: var(--text2); margin-top: 10px; }
        #reglas .hd { top: 128px; font-size: 52px; }
        #reglas .hd.hd2 { top: 175px; }
        #reglas .mm { position: absolute; left: 360px; top: 370px; width: 1200px; height: 380px; padding: 40px 54px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
        #reglas .mm__h { display: flex; align-items: center; gap: 28px; }
        #reglas .mm__ic { flex: none; width: 112px; height: 112px; border-radius: 28px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
        #reglas .mm__ic svg { width: 62px; height: 62px; }
        #reglas .mm__k { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
        #reglas .mm__t { font-size: 76px; font-weight: 820; letter-spacing: -0.04em; line-height: 1.05; }
        #reglas .mm .chip { position: relative; height: 66px; font-size: 30px; padding: 0 28px; align-self: flex-start; }
        #reglas .mm .chip svg { width: 32px; height: 32px; }
        #reglas .msrc { top: 790px; font-size: 22px; }
        #reglas .qt { position: absolute; left: 160px; right: 160px; top: 770px; text-align: center; font-size: 38px; font-style: italic; font-weight: 620; line-height: 1.3; }
        #reglas .qsrc { top: 836px; font-size: 22px; }
        #reglas .fl { left: 1250px; top: 258px; height: 54px; font-size: 24px; }
        #reglas .two { position: absolute; top: 300px; width: 760px; height: 440px; padding: 40px 48px; justify-content: center; gap: 22px; }
        #reglas .two .tc__t { font-size: 54px; line-height: 1.05; }
        #reglas .eq { position: absolute; top: 380px; width: 700px; height: 320px; padding: 36px 44px; justify-content: center; gap: 18px; }
        #reglas .eq .tc__t { font-size: 56px; line-height: 1.05; }
        #reglas .eq .tc__b { font-size: 34px; }
        #reglas .eq .tc__ic { width: 96px; height: 96px; border-radius: 24px; }
        #reglas .eq .tc__ic svg { width: 54px; height: 54px; }
        #reglas .eqs { position: absolute; left: 910px; top: 480px; width: 100px; text-align: center; font-family: var(--mono); font-size: 90px; color: var(--text3); }
        #reglas .two .tc__ic { width: 96px; height: 96px; border-radius: 24px; }
        #reglas .two .tc__ic svg { width: 54px; height: 54px; }
        #reglas .two .tc__n { font-size: 24px; }
        #reglas .two .chip { position: relative; height: 56px; font-size: 26px; }
        #reglas .two__v { font-size: 120px; font-weight: 820; letter-spacing: -0.045em; line-height: 1; color: var(--danger); }
        #reglas .stp { position: absolute; top: 360px; width: 640px; height: 280px; padding: 36px 44px; justify-content: center; gap: 16px; }
        #reglas .stp .tc__t { font-size: 56px; }
        #reglas .stp .tc__ic { width: 96px; height: 96px; border-radius: 24px; }
        #reglas .stp .tc__ic svg { width: 54px; height: 54px; }
        #reglas .stp .tc__b { font-size: 30px; }
        #reglas .stp .tc__n { font-size: 24px; }
        #reglas .ar { position: absolute; left: 920px; top: 470px; width: 80px; text-align: center; font-family: var(--mono); font-size: 70px; color: var(--text3); }
        #reglas .hint { left: 260px; top: 670px; height: 56px; font-size: 26px; }
        #reglas .hint2 { left: 1020px; top: 670px; height: 56px; font-size: 26px; }
      </style>
      <div id="reglas" class="scene" data-composition-id="reglas" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <svg class="wires" id="rg-w" viewBox="0 0 1920 1080"></svg>
        <div class="layer" id="rg-d"></div>

        <!-- A · a condition with a number, and someone who measures it -->
        <div class="stmt pop" id="rg-st">Una condición con número sirve <span>si alguien la mide</span></div>
        <div class="card big pop" id="rg-big"><span class="big__ic" data-icon="gauge"></span><div><div class="big__t">Funciones de aptitud</div><div class="big__s">fitness functions</div></div></div>

        <!-- B · MonitorMe's rule for the second of response -->
        <div class="hd hd2 pop" id="rg-h2">Reglas sobre la arquitectura, <span>comprobadas como un test</span></div>
        <div class="tc tc--evt eq pop" id="rg-e1" style="left: 190px"><div class="tc__hd"><span class="tc__ic" data-icon="clipCheck"></span></div><span class="tc__t">Un test</span><span class="tc__b">se comprueba solo</span></div>
        <span class="eqs pop" id="rg-eq">≈</span>
        <div class="tc tc--accent eq pop" id="rg-e2" style="left: 1030px"><div class="tc__hd"><span class="tc__ic" data-icon="gauge"></span></div><span class="tc__t">Una función de aptitud</span><span class="tc__b">una regla sobre la arquitectura, que se comprueba sola</span></div>
        <div class="card mm pop" id="rg-mm">
          <div class="mm__h"><span class="mm__ic" data-icon="gauge"></span><div><div class="mm__k">MonitorMe</div><div class="mm__t">El segundo de respuesta</div></div></div>
          <span class="chip chip--accent pop" id="rg-mc"><span data-icon="calculator"></span>escrita como cálculo</span>
        </div>
        <div class="src msrc pop" id="rg-ms">Bluz Brothers · README.md</div>

        <!-- C · when one fails, treat it as a failing test -->
        <div class="hd pop" id="rg-h3">La regla de uso, <span>escrita por Farmacy Family</span></div>
        <span class="chip chip--accent fl pop" id="rg-fl"><span data-icon="alert"></span>como un test que falla</span>
        <div class="qt pop" id="rg-qt">“…in the same way as a failing test.”</div>
        <div class="src qsrc pop" id="rg-qs">Farmacy Family · 1.ProblemBackground/ArchitectureAnalysis.md</div>

        <!-- D · what the repositories hold: written or calculated by hand, none automated -->
        <div class="tc tc--evt two pop" id="rg-w1" style="left: 140px"><div class="tc__hd"><span class="tc__ic" data-icon="pencil"></span><span class="tc__n">En los repositorios que leímos</span></div><span class="tc__t">Reglas escritas</span><span class="chip chip--evt pop" id="rg-wc" style="align-self: flex-start"><span data-icon="calculator"></span>o calculadas a mano</span></div>
        <div class="tc tc--danger two pop" id="rg-w2" style="left: 1020px"><div class="tc__hd"><span class="tc__ic" data-icon="workflow"></span><span class="tc__n">En los repositorios que leímos</span></div><span class="tc__t">Reglas automatizadas</span><span class="two__v">Ninguna</span></div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('reglas');
          const { tl, W, L, LE, pop, hide, dim, to, fade, draw, IC, $, $$, el, node, wire } = K;
          const svg = $('#rg-w'), layer = $('#rg-d');

          // a condition with a number is only worth something if someone measures it
          pop(L(0), '#rg-st', { y: 16 });
          pop(W(1, 'funciones') - 0.3, '#rg-big', { y: 20, s: 0.98 });

          // rules about the architecture, checked on their own like a test
          hide(W(1, 'reglas') - 0.5, ['#rg-st', '#rg-big']);
          pop(W(1, 'reglas') - 0.1, '#rg-h2', { y: 14 });
          pop(W(1, 'comprueban') - 0.3, '#rg-e2', { y: 18, s: 0.98 });
          pop(W(1, 'test') - 0.5, ['#rg-eq', '#rg-e1'], { y: 14, s: 0.98, st: 0.15 });
          // MonitorMe's rule for the second of response
          hide(W(2, 'MonitorMe') - 0.6, ['#rg-e1', '#rg-e2', '#rg-eq']);
          pop(W(2, 'MonitorMe') - 0.3, '#rg-mm', { y: 20, s: 0.98 });
          pop(W(2, 'cálculo') - 0.4, '#rg-mc', { y: 8, s: 0.9 });
          pop(W(2, 'cálculo') + 0.2, '#rg-ms', { y: 6 });

          // Farmacy Family wrote how to use them: a failing rule is fixed like a failing test
          hide(L(3) - 0.5, ['#rg-h2', '#rg-mm', '#rg-ms']);
          const n0 = node(layer, { x: 110, y: 400, w: 400, h: 170, icon: 'alert', title: 'Una función de aptitud falla', sub: '', tone: 'user' });
          const n1 = node(layer, { x: 640, y: 200, w: 580, h: 170, icon: 'wrench', title: 'Se arregla el sistema', sub: '', tone: 'built' });
          const n2 = node(layer, { x: 640, y: 560, w: 340, h: 170, icon: 'lightbulb', title: 'Buena razón para no hacerlo', sub: '', tone: 'cmp' });
          const n3 = node(layer, { x: 1060, y: 560, w: 340, h: 170, icon: 'gavel', title: 'Se escribe una decisión', sub: '', tone: 'cmp' });
          const n4 = node(layer, { x: 1480, y: 560, w: 330, h: 170, icon: 'refresh', title: 'Se actualiza la función', sub: '', tone: 'cmp' });
          $$('.node__tx small').forEach((s) => s.remove());
          const w1 = wire(svg, n0.r, n1.l, 'wire--accent');
          const w2 = wire(svg, n0.r, n2.l, 'wire--cmp');
          const w3 = wire(svg, n2.r, n3.l, 'wire--cmp', true);
          const w4 = wire(svg, n3.r, n4.l, 'wire--cmp', true);
          pop(W(3, 'Farmacy') - 0.3, '#rg-h3', { y: 14 });
          pop(W(3, 'dejó') - 0.2, ['#rg-qt', '#rg-qs'], { y: 8, st: 0.15 });
          pop(W(3, 'función') - 0.3, n0.e, { y: 16 });
          pop(W(3, 'arregla') - 0.3, n1.e, { y: 16 });
          draw(W(3, 'arregla') - 0.1, w1.p, 0.7);
          pop(W(3, 'test') - 0.2, '#rg-fl', { y: 8, s: 0.9 });
          // and when there is a good reason, a decision and an updated function
          pop(W(4, 'razón') - 0.4, n2.e, { y: 16 });
          draw(W(4, 'razón') - 0.2, w2.p, 0.7);
          pop(W(4, 'decisión') - 0.3, n3.e, { y: 16 });
          draw(W(4, 'decisión') - 0.2, w3.p, 0.5);
          pop(W(4, 'actualiza') - 0.3, n4.e, { y: 16 });
          draw(W(4, 'actualiza') - 0.2, w4.p, 0.5);

          // in the repositories we read: written or calculated by hand, none automated
          hide(W(4, 'repositorios') - 0.8, [n0.e, n1.e, n2.e, n3.e, n4.e, '#rg-w', '#rg-h3', '#rg-fl', '#rg-qt', '#rg-qs']);
          pop(W(4, 'repositorios') - 0.2, '#rg-w1', { y: 18, s: 0.98 });
          pop(W(4, 'calculadas') - 0.3, '#rg-wc', { y: 6, s: 0.9 });
          pop(W(4, 'ninguna') - 0.5, '#rg-w2', { y: 18, s: 0.98 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
