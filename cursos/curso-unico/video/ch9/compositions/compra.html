<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #compra .node__tx b { font-size: 33px; }
        #compra .node__tx small { font-size: 24px; }
        #compra .node__ic { width: 70px; height: 70px; }
        #compra .node__ic svg { width: 38px; height: 38px; }
        #compra .hd { top: 150px; }
        #compra .qbig { position: absolute; left: 490px; top: 290px; width: 940px; height: 520px; padding: 44px 52px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
        #compra .qbig__h { display: flex; align-items: center; gap: 22px; }
        #compra .qbig__n { flex: none; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-family: var(--mono); font-size: 36px; font-weight: 800; }
        #compra .qbig__ic { flex: none; width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; background: var(--surface3); color: var(--accent-text); }
        #compra .qbig__ic svg { width: 54px; height: 54px; }
        #compra .qbig__t { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
        #compra .qbig__s { font-size: 34px; font-weight: 560; color: var(--text2); line-height: 1.3; }
        #compra .restk { position: absolute; left: 1130px; top: 290px; width: 650px; font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); line-height: 1.3; }
        #compra .qc { position: absolute; left: 1130px; width: 650px; height: 210px; display: flex; align-items: center; gap: 24px; padding: 0 32px; border-radius: 22px; background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1.5px solid var(--line-strong); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 22px 50px rgba(0, 0, 0, 0.45); }
        #compra .qc__ic { flex: none; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: var(--surface3); color: var(--text2); }
        #compra .qc__ic svg { width: 40px; height: 40px; }
        #compra .qc__t { font-size: 36px; font-weight: 680; letter-spacing: -0.015em; line-height: 1.2; }
        #compra .buy { position: absolute; left: 140px; top: 240px; width: 1040px; height: 520px; padding: 34px 40px; gap: 22px; }
        #compra .build { position: absolute; left: 1240px; top: 240px; width: 540px; height: 520px; padding: 34px 40px; align-items: center; justify-content: center; text-align: center; gap: 26px; }
        #compra .lbl { display: inline-flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        #compra .lbl svg { width: 30px; height: 30px; }
        #compra .buy .lbl { color: var(--cmd); }
        #compra .build .lbl { color: var(--accent-text); }
        #compra .it { display: flex; align-items: center; gap: 22px; height: 130px; padding: 0 26px; border-radius: 18px; background: var(--surface); border: 1.5px solid #2c4677; font-size: 46px; font-weight: 680; letter-spacing: -0.015em; }
        #compra .it svg { width: 52px; height: 52px; color: var(--cmd); flex: none; }
        #compra .build .it { height: auto; border-color: rgba(255, 122, 69, 0.6); background: var(--accent-soft); padding: 30px 40px; font-size: 54px; flex-direction: column; gap: 20px; }
        #compra .build .it svg { width: 84px; height: 84px; color: var(--accent-text); }
        #compra .idh { top: 185px; }
        #compra .opts3 { position: absolute; left: 140px; right: 140px; top: 325px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
        #compra .opt3 { position: relative; display: flex; flex-direction: column; gap: 20px; height: 400px; padding: 28px 32px; border-radius: 22px; background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1.5px solid var(--line-strong); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 22px 50px rgba(0, 0, 0, 0.45); }
        #compra .opt3 .tc__t { font-size: 38px; }
        #compra .opt3 .tc__n { font-size: 24px; }
        #compra .opt3 .tc__ic { width: 88px; height: 88px; }
        #compra .opt3 .tc__ic svg { width: 48px; height: 48px; }
        #compra .opt3 .tc__ft { margin-top: auto; }
        #compra .opt3 .tc__ft .chip { height: 48px; font-size: 24px; padding: 0 18px; }
        #compra .qt { position: absolute; left: 200px; right: 200px; top: 760px; text-align: center; font-size: 38px; font-style: italic; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: var(--text); }
        #compra .qsrc { top: 868px; font-size: 22px; }
        #compra .gh { top: 170px; }
        #compra .fk { left: 785px; top: 606px; height: 60px; font-size: 26px; }
        #compra .hid { left: 1370px; top: 606px; height: 60px; font-size: 26px; }
        #compra .talk { left: 110px; top: 606px; height: 60px; font-size: 26px; }
        #compra .notp { left: 110px; top: 686px; height: 60px; font-size: 26px; }
        #compra .qt2 { top: 790px; font-size: 48px; }
        #compra .qsrc2 { top: 856px; font-size: 22px; }
      </style>
      <div id="compra" class="scene" data-composition-id="compra" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>

        <!-- A · the six questions: the voice details only the first one, then gives two examples of the rest -->
        <div class="hd pop" id="co-h1">Seis preguntas, <span>para cada pieza del sistema</span></div>
        <div class="card qbig pop" id="co-q1">
          <div class="qbig__h"><span class="qbig__n">1</span><span class="qbig__ic" data-icon="target"></span></div>
          <span class="qbig__t">¿Qué tan cerca está del valor central del producto?</span>
          <span class="qbig__s pop" id="co-q1s">Aquello por lo que alguien usaría Spotlight y no otra cosa</span>
        </div>
        <div class="restk pop" id="co-rk">Las otras cinco son más prácticas · por ejemplo</div>
        <div class="qc pop" id="co-r1" style="top: 380px"><span class="qc__ic" data-icon="code"></span><span class="qc__t">¿El equipo sabe construirla?</span></div>
        <div class="qc pop" id="co-r2" style="top: 610px"><span class="qc__ic" data-icon="scale"></span><span class="qc__t">¿Cuánto cuesta construirla frente a comprarla?</span></div>

        <!-- B · what they decided with them -->
        <div class="tc tc--cmd buy pop" id="co-buy">
          <span class="lbl"><span data-icon="cart"></span>Se compra · entre otras cosas</span>
          <div class="it pop" id="co-i1"><span data-icon="key"></span>Autenticación</div>
          <div class="it pop" id="co-i3"><span data-icon="message"></span>Chat</div>
        </div>
        <div class="tc tc--accent build pop" id="co-build">
          <span class="lbl"><span data-icon="code"></span>Se construye</span>
          <div class="it pop" id="co-i5"><span data-icon="target"></span>El núcleo</div>
        </div>

        <!-- C · identity: three options -->
        <div class="hd idh pop" id="co-h2">Identidad: <span>tres opciones</span></div>
        <div class="opts3" id="co-opts">
          <div class="opt3 pop" id="co-o1"><div class="tc__hd"><span class="tc__ic" data-icon="code"></span><span class="tc__n">Opción 1</span></div><span class="tc__t">Servicio propio</span><div class="tc__ft"><span class="chip chip--danger pop"><span data-icon="coins"></span>caro</span><span class="chip chip--danger pop"><span data-icon="shield"></span>seguridad y cumplimiento</span></div></div>
          <div class="opt3 pop" id="co-o2"><div class="tc__hd"><span class="tc__ic" data-icon="cog"></span><span class="tc__n">Opción 2</span></div><span class="tc__t">Código abierto, operado por ellos</span><div class="tc__ft"><span class="chip chip--danger pop"><span data-icon="coins"></span>caro</span><span class="chip chip--danger pop"><span data-icon="shield"></span>seguridad y cumplimiento</span></div></div>
          <div class="opt3 pop" id="co-o3"><div class="tc__hd"><span class="tc__ic" data-icon="cloud"></span><span class="tc__n">Opción 3</span></div><span class="tc__t">Gestionado por un proveedor</span><div class="tc__ft"><span class="chip chip--evt pop" id="co-ch"><span data-icon="check"></span>elegida</span><span class="chip pop" id="co-lim" style="border-color: rgba(255,200,97,0.55); background: var(--amber-soft); color: var(--amber)"><span data-icon="ban"></span>limita lo que se puede hacer</span></div><div class="on pop" id="co-on"></div></div>
        </div>
        <div class="qt pop" id="co-qt1">“Building or managing an identity service is expensive and adds the overhead of security and compliance”</div>
        <div class="qt pop" id="co-qt2">“…will limit us to building for capabilities it does not offer”</div>
        <div class="src qsrc pop" id="co-qs">Pegasuz · ADRs/009.adr-idp.md</div>

        <!-- D · the facade -->
        <div class="hd gh pop" id="co-h3">La mitigación: <span>una pieza propia</span></div>
        <svg class="wires" id="co-w" viewBox="0 0 1920 1080"></svg>
        <div class="layer" id="co-d"></div>
        <span class="chip chip--accent fk pop" id="co-fk"><span data-icon="wrench"></span>construye lo que falte</span>
        <span class="chip hid pop" id="co-hid"><span data-icon="eyeOff"></span>oculto al resto</span>
        <span class="chip chip--accent talk pop" id="co-talk"><span data-icon="arrowRight"></span>habla con la fachada</span>
        <span class="chip chip--danger notp pop" id="co-notp"><span data-icon="ban"></span>no con el proveedor</span>
        <div class="qt qt2 pop" id="co-qt3">“…behave as an identity facade”</div>
        <div class="src qsrc2 pop" id="co-qs2">Pegasuz · ADRs/009.adr-idp.md</div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('compra');
          const { tl, W, L, LE, pop, hide, dim, to, fade, draw, IC, $, $$, node, wire } = K;

          // six questions: the voice details the first one and gives two examples of the rest
          pop(W(0, 'seis') - 0.4, '#co-h1', { y: 14 });
          pop(W(1, 'primera') - 0.3, '#co-q1', { y: 20, s: 0.98 });
          pop(W(1, 'aquello') - 0.3, '#co-q1s', { y: 8 });
          to(W(2, 'demás') - 0.3, '#co-q1', { left: 140, duration: 0.7 });
          pop(W(2, 'demás') + 0.1, '#co-rk', { y: 10 });
          pop(W(2, 'equipo') - 0.4, '#co-r1', { y: 18, s: 0.98 });
          pop(W(2, 'cuánto') - 0.3, '#co-r2', { y: 18, s: 0.98 });

          // what they decided: buy authentication and chat, among other things; build the core
          hide(W(3, 'decidieron') - 0.7, ['#co-h1', '#co-q1', '#co-rk', '#co-r1', '#co-r2']);
          pop(W(3, 'decidieron') - 0.2, '#co-buy', { y: 18, s: 0.98 });
          pop(W(3, 'autenticación') - 0.2, '#co-i1', { y: 10 });
          pop(W(3, 'chat') - 0.2, '#co-i3', { y: 10 });
          pop(W(3, 'construir') - 0.4, '#co-build', { y: 18, s: 0.98 });
          pop(W(3, 'núcleo') - 0.4, '#co-i5', { y: 14, s: 0.95 });

          // identity: three options
          hide(L(4) - 0.4, ['#co-buy', '#co-build']);
          pop(L(4), '#co-h2', { y: 14 });
          // the three cards are there from the start, with their icon, number and name, so they are never empty boxes
          pop(L(4) + 0.1, ['#co-o1', '#co-o2', '#co-o3'], { y: 20, s: 0.98, st: 0.15 });

          // they chose the managed one, because building or operating identity is expensive
          dim(W(5, 'Eligieron') - 0.1, ['#co-o1', '#co-o2'], 0.4);
          pop(W(5, 'gestionado') - 0.2, ['#co-on', '#co-ch'], { y: 0, s: 1.01, st: 0.15 });
          pop(W(5, 'porque') - 0.2, '#co-qt1', { y: 10 });
          pop(W(5, 'porque') - 0.2, '#co-qs', { y: 6 });
          to(W(5, 'caro') - 0.3, ['#co-o1', '#co-o2'], { opacity: 1 });
          pop(W(5, 'caro') - 0.2, ['#co-o1 .chip', '#co-o2 .chip'].flatMap((s) => $$(s)), { y: 6, s: 0.9, st: 0.08 });
          // the cost they admit
          hide(W(6, 'costo') - 0.5, '#co-qt1');
          dim(W(6, 'costo') - 0.4, ['#co-o1', '#co-o2'], 0.35);
          pop(W(6, 'costo') + 0.15, '#co-qt2', { y: 10 });
          pop(W(6, 'limita') - 0.3, '#co-lim', { y: 6, s: 0.9 });

          // the mitigation: a facade of their own between the system and the provider
          hide(W(6, 'mitigación') - 0.5, ['#co-h2', '#co-opts', '#co-qt2', '#co-qs']);
          const svg = $('#co-w'), layer = $('#co-d');
          const a = node(layer, { x: 110, y: 370, w: 500, h: 200, icon: 'boxes', title: 'Resto del sistema', sub: 'chat, núcleo…', tone: 'user' });
          const f = node(layer, { x: 710, y: 370, w: 500, h: 200, icon: 'shield', title: 'Fachada de identidad', sub: 'pieza propia', tone: 'built' });
          const p = node(layer, { x: 1310, y: 370, w: 500, h: 200, icon: 'cloud', title: 'Proveedor de identidad', sub: 'gestionado', tone: 'ext' });
          const w1 = wire(svg, a.r, f.l, 'wire--accent', true);
          const w2 = wire(svg, f.r, p.l, 'wire--accent', true);
          pop(W(6, 'mitigación'), '#co-h3', { y: 14 });
          pop(W(6, 'pieza') - 0.3, f.e, { y: 16 });
          pop(W(6, 'esconde') - 0.3, p.e, { y: 16 });
          draw(W(6, 'esconde') - 0.1, w2.p, 0.7);
          pop(W(6, 'resto') - 0.3, a.e, { y: 16 });
          draw(W(6, 'resto') - 0.1, w1.p, 0.7);
          dim(W(6, 'resto') + 0.4, p.e, 0.5);
          pop(W(6, 'resto') + 0.5, '#co-hid', { y: 6, s: 0.9 });
          pop(W(6, 'construye') - 0.3, '#co-fk', { y: 8, s: 0.9 });
          pop(W(6, 'fachada') + 0.2, ['#co-qt3', '#co-qs2'], { y: 8, st: 0.15 });

          // so the rest of the system talks to the facade, not to the provider
          K.stream(svg, w1, W(7, 'resto') - 0.1, LE(7), { every: 1.1, travel: 0.9, color: '#ff7a45' });
          pop(W(7, 'habla') - 0.1, '#co-talk', { y: 6, s: 0.9 });
          pop(W(7, 'no') - 0.1, '#co-notp', { y: 6, s: 0.9 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
