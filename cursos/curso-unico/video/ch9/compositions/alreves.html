<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #alreves .hd { top: 130px; }
        #alreves .cards { top: 215px; gap: 40px; }
        #alreves .tc { height: 570px; padding: 30px 44px 34px; gap: 14px; }
        #alreves .tc__ic { width: 76px; height: 76px; border-radius: 20px; }
        #alreves .tc__ic svg { width: 42px; height: 42px; }
        #alreves .tc__t { font-size: 50px; line-height: 1.1; }
        #alreves .team { font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
        #alreves .tc__b { font-size: 30px; line-height: 1.3; }
        #alreves .tc__ft { gap: 12px; }
        #alreves .tc__ft .chip { height: auto; min-height: 56px; font-size: 28px; padding: 8px 22px; white-space: normal; line-height: 1.2; border-radius: 28px; }
        #alreves .end { top: 818px; font-size: 48px; }
      </style>
      <div id="alreves" class="scene" data-composition-id="alreves" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="hd pop" id="al-h">Otros criterios <span>empujan al revés</span></div>
        <div class="cards cards--2" id="al-cards">
          <div class="tc tc--cmd pop" id="al-c1">
            <div class="tc__hd"><span class="tc__ic" data-icon="lock"></span></div>
            <span class="tc__t">Privacidad</span>
            <span class="team pop" id="al-t1">Certifiable</span>
            <span class="tc__b pop" id="al-b1">Procesa los datos sensibles de los candidatos en servidores propios. Lo general, en la nube.</span>
            <div class="tc__ft"><span class="chip chip--cmd pop" id="al-p1"><span data-icon="server"></span>sensibles: propio</span><span class="chip pop" id="al-p2"><span data-icon="cloud"></span>general: nube</span></div>
          </div>
          <div class="tc tc--cmp pop" id="al-c2">
            <div class="tc__hd"><span class="tc__ic" data-icon="puzzle"></span></div>
            <span class="tc__t">Coherencia con lo ya elegido</span>
            <span class="team pop" id="al-t2">MobilityCorp</span>
            <span class="tc__b pop" id="al-b2">Descartó servicios especializados que ya detectan daños en fotos: no encajaban con la plataforma de nube que había elegido antes.</span>
            <div class="tc__ft"><span class="chip chip--danger pop" id="al-p3"><span data-icon="ban"></span>descartados</span></div>
          </div>
        </div>
        <div class="hd end pop" id="al-end">Comprar o construir <span>se responde según qué pese más</span></div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('alreves');
          const { tl, W, L, LE, pop, hide, dim, to, $ } = K;

          pop(L(0), '#al-h', { y: 14 });
          // the two cards arrive dimmed, and the voice lights them one by one
          tl.fromTo(['#al-c1', '#al-c2'], { opacity: 0, y: 20 }, { opacity: 0.35, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.15 }, W(0, 'otros') - 0.3);
          // 1 · privacy
          to(W(0, 'privacidad') - 0.4, '#al-c1', { opacity: 1, duration: 0.4 });
          pop(W(1, 'Certifiable') - 0.2, ['#al-t1', '#al-b1'], { y: 8, st: 0.2 });
          pop(W(1, 'propios') - 0.2, '#al-p1', { y: 6, s: 0.9 });
          pop(W(1, 'nube') - 0.3, '#al-p2', { y: 6, s: 0.9 });
          // 2 · coherence with what was already chosen
          dim(W(2, 'coherencia') - 0.4, '#al-c1', 0.5);
          to(W(2, 'coherencia') - 0.4, '#al-c2', { opacity: 1, duration: 0.4 });
          pop(W(2, 'MobilityCorp') - 0.2, ['#al-t2', '#al-b2'], { y: 8, st: 0.2 });
          pop(W(2, 'descartó') + 0.2, '#al-p3', { y: 6, s: 0.9 });
          // the same question, answered differently
          to(L(3) - 0.2, '#al-c1', { opacity: 1 });
          pop(W(3, 'misma') - 0.2, '#al-end', { y: 14 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
