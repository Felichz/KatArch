<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #outro { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #outro .h2 { top: 140px; font-size: 54px; }
        #outro .idea { position: absolute; left: 260px; width: 1400px; height: 130px; padding: 0 36px; display: flex; align-items: center; gap: 28px; }
        #outro .idea i { flex: none; font-style: normal; width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-family: var(--mono); font-size: 28px; font-weight: 800; }
        #outro .idea p { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.22; }
        #outro .idea p span { color: var(--text2); font-weight: 560; }
        #outro .idea > span { flex: none; margin-left: auto; color: var(--text3); }
        #outro .idea > span svg { width: 40px; height: 40px; }
        #outro .next__ic { width: 120px; height: 120px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); border: 2px solid rgba(255, 122, 69, 0.55); color: var(--accent-text); }
        #outro .next__ic svg { width: 62px; height: 62px; }
        #outro .next { top: 220px; }
      </style>
      <div id="outro" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="ou-a">
          <div class="h2 pop" id="ou-h">Para llevarte</div>
          <div class="card idea pop" id="ou-i0" style="top: 270px"><i>1</i><p>Dos pruebas, corregidas a mano por expertos. <span>3 h y 8 h por candidato.</span></p><span data-icon="pencil"></span></div>
          <div class="card idea pop" id="ou-i1" style="top: 425px"><i>2</i><p>La demanda crece de 5 a 10 veces. <span>El precio queda fijo en 800 USD.</span></p><span data-icon="trending"></span></div>
          <div class="card idea pop" id="ou-i2" style="top: 580px"><i>3</i><p>La exactitud no se negocia. <span>El jurado pide validar a la IA y evitar antipatrones.</span></p><span data-icon="scale"></span></div>
        </div>
        <div class="next">
          <span class="next__ic pop" id="ou-ni" data-icon="hourglass"></span>
          <span class="next__k pop" id="ou-nk">Próximo · Capítulo 2</span>
          <span class="next__t pop" id="ou-nt">La cuenta de horas</span>
          <span class="next__q pop" id="ou-nq">Cuántas horas de experto hacen falta, y por qué ese número decide todo</span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('outro');
          const { W, L, pop, to } = K;
          // the three ideas, one at a time
          pop(L(0) - 0.1, '#ou-h', { y: 18 });
          pop(L(1) - 0.1, '#ou-i0', { y: 18, s: 0.97 });
          pop(L(2) - 0.1, '#ou-i1', { y: 18, s: 0.97 });
          pop(L(3) - 0.1, '#ou-i2', { y: 18, s: 0.97 });
          // next chapter
          to(L(4) - 0.35, '#ou-a', { opacity: 0, y: -30, duration: 0.5 });
          pop(L(4), ['#ou-ni', '#ou-nk'], { st: 0.12, y: 16 });
          pop(W(4, 'horas') - 0.2, '#ou-nt', { y: 36, d: 0.9, ease: 'expo.out' });
          pop(W(4, 'número') - 0.2, '#ou-nq', { y: 16 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
