<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #piensalo { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #piensalo .zask { top: 200px; gap: 40px; }
        #piensalo .tasks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
        #piensalo .tk { position: relative; height: 330px; padding: 30px 30px; display: flex; flex-direction: column; gap: 16px; }
        #piensalo .tk > svg { width: 50px; height: 50px; color: var(--text2); }
        #piensalo .tk b { font-size: 36px; font-weight: 790; letter-spacing: -0.02em; line-height: 1.12; }
        #piensalo .tk__d { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 25px; font-weight: 620; color: var(--text2); line-height: 1.3; }
        #piensalo .tk__d strong { font-family: var(--mono); font-size: 34px; font-weight: 800; color: var(--accent); }
      </style>
      <div id="piensalo" data-composition-id="piensalo" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="zask">
          <div class="question pop" id="pi-q">
            <div class="ring">
              <svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="49" fill="none" stroke="#242d3a" stroke-width="6" /><circle id="pi-arc" cx="55" cy="55" r="49" fill="none" stroke="#ff7a45" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" /></svg>
              <span class="ring__ic" data-icon="hourglass"></span>
            </div>
            <div class="question__t">De las tareas de los expertos, ¿cuál se lleva más horas?</div>
          </div>
          <div class="tasks">
            <div class="card tk pop" id="pi-t0"><span data-icon="pencil"></span><b>Corregir exámenes</b><span class="tk__d pop" id="pi-d0"><strong>3 h + 8 h</strong>por candidato que llega al final · los 300 expertos</span><span class="zon pop" id="pi-on"></span></div>
            <div class="card tk pop" id="pi-t1"><span data-icon="file"></span><b>Escribir preguntas nuevas</b><span class="tk__d pop" id="pi-d1">sobre todo los 5 designados</span></div>
            <div class="card tk pop" id="pi-t2"><span data-icon="refresh"></span><b>Rotar casos de estudio</b><span class="tk__d pop" id="pi-d2">sobre todo los 5 designados</span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('piensalo');
          const { W, L, LE, pop, fade, to, ring } = K;
          pop(W(0, 'Piénsalo') - 0.1, '#pi-q', { y: 18 });
          pop(W(0, 'Corregir') - 0.15, '#pi-t0', { y: 16, s: 0.97 });
          pop(W(0, 'escribir') - 0.15, '#pi-t1', { y: 16, s: 0.97 });
          pop(W(0, 'rotar') - 0.15, '#pi-t2', { y: 16, s: 0.97 });
          // the pause: the ring empties while the viewer decides
          ring(LE(0), '#pi-arc', Math.max(1, L(1) - LE(0) - 0.4));
          // grading: 3 + 8 hours per candidate, and every expert does it
          fade(L(1) - 0.1, '#pi-on', 0.3);
          pop(W(1, '3') - 0.1, '#pi-d0', { y: 8 });
          to(W(1, 'otras') - 0.1, ['#pi-t1', '#pi-t2'], { opacity: 0.55, duration: 0.4 });
          pop(W(1, 'designados') - 0.3, ['#pi-d1', '#pi-d2'], { st: 0.1, y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
