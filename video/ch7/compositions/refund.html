<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #refund { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #refund .node { gap: 14px; padding: 0 18px; }
        #refund .node__ic { width: 48px; height: 48px; }
        #refund .node__ic svg { width: 26px; height: 26px; }
        #refund .node__tx b { font-size: 24px; }
        #refund .msg { position: absolute; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; font-weight: 700; white-space: nowrap; }
        #refund .msg--cmd { background: var(--cmd-soft); border: 1.5px solid #2c4677; color: var(--cmd); }
        #refund .msg--evt { background: var(--evt-soft); border: 1.5px solid #1f5b45; color: var(--evt); }
        #refund .msg--plain { font-family: var(--sans); font-size: 20px; font-weight: 650; }
        #refund .gl { position: absolute; font-size: 19px; font-weight: 560; color: var(--text2); white-space: nowrap; }
        #refund .gl i { font-style: normal; font-family: var(--mono); font-size: 17px; margin-right: 8px; }
        #refund .gl--cmd i { color: var(--cmd); }
        #refund .gl--evt i { color: var(--evt); }
        #refund .divider { position: absolute; left: 580px; top: 290px; width: 0; height: 300px; border-left: 2px dashed var(--line-strong); }
        #refund .side { position: absolute; top: 560px; font-family: var(--mono); font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
        #refund .ch { height: 44px; font-size: 20px; }
      </style>
      <div id="refund" data-composition-id="refund" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="divider pop" id="rf-div"></div>
        <span class="side pop" id="rf-cl" style="left: 470px">cliente</span>
        <span class="side pop" id="rf-sv" style="left: 600px">servidor</span>
        <svg class="wires" id="rf-wires" viewBox="0 0 1920 1080"></svg>
        <div class="layer" id="rf-nodes"></div>
        <div class="msg msg--cmd msg--plain pop" id="rf-cxl" style="left: 476px; top: 404px; width: 210px">cancela el jueves</div>
        <div class="msg msg--evt pop" id="rf-msc" style="left: 1066px; top: 402px; width: 290px">MealStockCanceled</div>
        <span class="gl gl--evt pop" id="rf-mscg" style="left: 1068px; top: 488px"><i>evento</i>esa comida se canceló</span>
        <div class="msg msg--cmd pop" id="rf-cr" style="left: 960px; top: 184px; width: 240px">ClaimRefund</div>
        <span class="gl gl--cmd pop" id="rf-crg" style="left: 962px; top: 262px"><i>comando</i>reclama el reembolso</span>
        <span class="chip chip--cmd ch pop" id="rf-why" style="left: 900px; top: 296px" data-icon="arrowRight"></span>
        <span class="chip ch pop" id="rf-o1" style="left: 900px; top: 348px" data-icon="card"></span>
        <span class="chip ch pop" id="rf-o2" style="left: 1086px; top: 348px" data-icon="coins"></span>
        <div class="msg msg--evt pop" id="rf-rs" style="left: 380px; top: 166px; width: 290px">RefundSuccessful</div>
        <span class="gl gl--evt pop" id="rf-rsg" style="left: 382px; top: 222px"><i>evento</i>reembolso exitoso</span>
        <span class="chip chip--cmd pop" id="rf-f1" style="left: 160px; top: 640px"></span>
        <span class="chip chip--evt pop" id="rf-f2" style="left: 600px; top: 640px"></span>
        <span class="chip chip--accent pop" id="rf-sup" style="left: 160px; top: 706px" data-icon="help"></span>
      </div>
      <script>
        (() => {
          const K = KIT.scene('refund');
          const { tl, W, L, END, pop, to, draw, sv, $, node, wire, stream } = K;
          const txt = (sel, s) => $(sel).insertAdjacentHTML('beforeend', s);
          txt('#rf-why', 'un pedido: el negocio decide cómo');
          txt('#rf-o1', 'a la tarjeta');
          txt('#rf-o2', 'a una cuenta virtual');
          txt('#rf-f1', 'hecho 1 · se pidió el dinero');
          txt('#rf-f2', 'hecho 2 · el dinero volvió');
          txt('#rf-sup', 'soporte: “¿se lo devolvimos o no?” siempre tiene respuesta');
          const svg = $('#rf-wires');
          /** An orthogonal wire through points, drawn like the kit's wires, with a point-at-t for packets. */
          const ew = (P, cls) => {
            const p = sv('path', { d: 'M' + P.map((q) => q.join(' ')).join(' L'), class: `wire ${cls}`, pathLength: 1, 'stroke-dasharray': '1', 'stroke-dashoffset': 1 }, svg);
            const seg = P.slice(1).map((q, i) => Math.hypot(q[0] - P[i][0], q[1] - P[i][1]));
            const total = seg.reduce((a, b) => a + b, 0);
            const at = (t) => { let d = t * total; for (let i = 0; i < seg.length; i++) { if (d <= seg[i] || i === seg.length - 1) { const k = seg[i] ? Math.min(1, d / seg[i]) : 0; return [P[i][0] + (P[i + 1][0] - P[i][0]) * k, P[i][1] + (P[i + 1][1] - P[i][1]) * k]; } d -= seg[i]; } return P.at(-1); };
            return { p, at };
          };
          const app = node($('#rf-nodes'), { x: 160, y: 420, w: 300, h: 104, tone: 'user', icon: 'phone', title: 'App', sub: 'del suscriptor' });
          const ord = node($('#rf-nodes'), { x: 700, y: 420, w: 340, h: 104, tone: 'cmp', icon: 'inbox', title: 'Orden' });
          const pay = node($('#rf-nodes'), { x: 1380, y: 200, w: 340, h: 100, tone: 'ext', icon: 'card', title: 'Pagos', sub: 'tiene el dinero' });
          const rep = node($('#rf-nodes'), { x: 1380, y: 420, w: 340, h: 104, tone: 'cmp', icon: 'chart', title: 'Reporting', sub: 'lleva los números' });
          const cat = node($('#rf-nodes'), { x: 1380, y: 610, w: 340, h: 96, tone: 'cmp', icon: 'book', title: 'Catálogo', sub: 'no se entera' });
          const wC = ew([app.r, ord.l], 'wire--cmd');
          const wM = ew([ord.r, rep.l], 'wire--evt');
          const wR = ew([ord.t, [870, 250], pay.l], 'wire--cmd');
          const wS = ew([pay.t, [1550, 150], [310, 150], app.t], 'wire--evt');
          const glow = (rgb) => ({ borderColor: `rgb(${rgb})`, boxShadow: `0 0 0 1px rgba(${rgb}, 0.35), 0 0 50px rgba(${rgb}, 0.35), 0 22px 50px rgba(0, 0, 0, 0.45)` });
          const CMD = '#6ea2ff', EVT = '#3fd694';
          const ring = (rgb) => ({ boxShadow: `0 0 0 2px rgba(${rgb}, 0.8), 0 0 40px rgba(${rgb}, 0.45)`, duration: 0.35 });

          // the app tells the order; the other three hear about it
          pop(L(0) - 0.4, ['#rf-div', '#rf-cl', '#rf-sv'], { st: 0.08, y: 0 });
          pop(W(0, 'app') - 0.2, app.e, { y: 12 });
          pop(W(0, 'orden') - 0.2, ord.e, { y: 12 });
          draw(W(0, 'orden') - 0.1, wC.p, 0.4);
          pop(W(0, 'orden') + 0.1, '#rf-cxl', { y: 8 });
          stream(svg, wC, W(0, 'orden'), W(0, 'orden') + 2.4, { every: 1.2, travel: 0.6, color: CMD });
          pop(W(0, 'tres') - 0.2, [pay.e, rep.e, cat.e], { st: 0.12, y: 12 });
          to(W(0, 'tres') + 0.6, cat.e, { opacity: 0.4, duration: 0.4 });
          // to reporting: an event, a fact
          tl.to(ord.e, { ...glow('182, 155, 255'), duration: 0.4 }, L(1));
          draw(W(1, 'evento') - 0.1, wM.p, 0.4);
          pop(W(1, 'evento') + 0.1, '#rf-msc', { y: 8 });
          pop(W(1, 'canceló') - 0.3, '#rf-mscg', { y: 6 });
          stream(svg, wM, W(1, 'evento') + 0.3, END, { every: 2.8, travel: 0.7, color: EVT });
          tl.to(rep.e, { ...glow('63, 214, 148'), duration: 0.4 }, W(1, 'canceló'));
          // to payments: a command, a request
          draw(W(2, 'comando') - 0.2, wR.p, 0.5);
          pop(W(2, 'comando') + 0.1, '#rf-cr', { y: 8 });
          pop(W(2, 'reembolso') - 0.2, '#rf-crg', { y: 6 });
          stream(svg, wR, W(2, 'comando') + 0.3, END, { every: 2.8, travel: 0.8, color: CMD });
          tl.to(pay.e, { ...glow('110, 162, 255'), duration: 0.4 }, W(2, 'reembolso'));
          // why a command: the business decides how
          pop(W(3, 'pedido') - 0.1, '#rf-why', { s: 0.9, ease: 'back.out(2)' });
          pop(W(3, 'tarjeta') - 0.1, '#rf-o1', { s: 0.85, ease: 'back.out(2)' });
          pop(W(3, 'cuenta') - 0.1, '#rf-o2', { s: 0.85, ease: 'back.out(2)' });
          // payments closes the circle with the fact
          to(L(4) - 0.2, ['#rf-why', '#rf-o1', '#rf-o2'], { opacity: 0.35, duration: 0.4 });
          draw(W(4, 'anuncia') - 0.1, wS.p, 0.9);
          pop(W(4, 'anuncia') + 0.3, '#rf-rs', { y: 8 });
          pop(W(4, 'RefundSuccessful'), '#rf-rsg', { y: 6 });
          stream(svg, wS, W(4, 'anuncia') + 0.4, END, { every: 3, travel: 1.4, color: EVT });
          tl.to(app.e, { ...glow('63, 214, 148'), duration: 0.4 }, W(4, 'app'));
          // two facts, recorded apart
          to(L(5) - 0.2, ['#rf-why', '#rf-o1', '#rf-o2', '#rf-cxl', wC.p], { opacity: 0, duration: 0.4 });
          tl.to('#rf-cr', ring('110, 162, 255'), W(5, 'Pedir'));
          pop(W(5, 'Pedir'), '#rf-f1', { y: 10 });
          tl.to('#rf-rs', ring('63, 214, 148'), W(5, 'vuelva') - 0.1);
          pop(W(5, 'vuelva'), '#rf-f2', { y: 10 });
          pop(W(6, 'soporte') - 0.1, '#rf-sup', { s: 0.9, ease: 'back.out(1.8)' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
