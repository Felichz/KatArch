<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #aduana { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); --warn: #f2c14e; }
        #aduana .svc { position: absolute; left: 500px; top: 170px; width: 1280px; height: 590px; border-radius: 24px; border: 2px solid var(--line-strong); background: rgba(17, 22, 29, 0.55); }
        #aduana .svc b { position: absolute; left: 28px; top: 16px; font-family: var(--mono); font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-weight: 700; }
        #aduana .acl { position: absolute; left: 540px; top: 226px; width: 320px; height: 400px; border-radius: 18px; border: 2px dashed var(--warn); background: rgba(58, 48, 22, 0.35); }
        #aduana .acl b { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-family: var(--mono); font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); font-weight: 700; }
        #aduana .node { gap: 14px; padding: 0 18px; border-radius: 16px; }
        #aduana .node__ic { width: 46px; height: 46px; border-radius: 12px; }
        #aduana .node__ic svg { width: 26px; height: 26px; }
        #aduana .node__tx b { font-size: 24px; }
        #aduana .node__tx small { font-size: 17px; }
        #aduana .node--acl { border-color: #6b5a2a; padding-left: 22px; }
        #aduana .node--danger { border-color: #6b2a33; background: linear-gradient(180deg, #2a161a, #1c1013); }
        #aduana .node--danger .node__ic { background: var(--danger-soft); color: var(--danger); }
        #aduana .hl { position: absolute; inset: -1.5px; border-radius: 16px; border: 2.5px solid var(--cmd); background: rgba(110, 162, 255, 0.12); box-shadow: 0 0 40px rgba(110, 162, 255, 0.4); opacity: 0; }
        #aduana .hl--evt { border-color: var(--evt); background: rgba(63, 214, 148, 0.12); box-shadow: 0 0 40px rgba(63, 214, 148, 0.4); }
        #aduana .vs-h { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-size: 56px; font-weight: 800; letter-spacing: -0.03em; }
        #aduana .vs { position: absolute; top: 300px; width: 780px; height: 380px; padding: 34px 38px; display: flex; flex-direction: column; gap: 22px; }
        #aduana .vs__k { font-family: var(--mono); font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
        #aduana .vs__t { font-size: 36px; font-weight: 780; letter-spacing: -0.02em; }
        #aduana .vs .flow { display: flex; align-items: center; gap: 14px; }
        #aduana .vs .flow .chip { position: relative; }
        #aduana .vs .arr { font-family: var(--mono); font-size: 26px; color: var(--text3); }
        #aduana .vs__n { margin-top: auto; font-family: var(--mono); font-size: 19px; color: var(--text3); }
        #aduana .vs--a { left: 160px; border-color: rgba(255, 122, 69, 0.55); }
        #aduana .vs--a .vs__k { color: var(--accent-text); }
        #aduana .vs--b { left: 980px; border-color: #4a3f73; }
        #aduana .vs--b .vs__k { color: var(--cmp); }
      </style>
      <div id="aduana" data-composition-id="aduana" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="ad-dia">
          <div class="svc pop" id="ad-svc"><b>Menu Catalog · servicio</b></div>
          <div class="acl pop" id="ad-acl"><b>capa anticorrupción</b></div>
          <svg class="wires" id="ad-wires" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="ad-nodes"></div>
          <span class="chip pop" id="ad-c40" style="left: 140px; top: 214px" data-icon="utensils"></span>
          <span class="chip chip--cmd pop" id="ad-cint" style="left: 960px; top: 290px" data-icon="check"></span>
          <span class="chip chip--evt pop" id="ad-cstk" style="left: 990px; top: 494px" data-icon="radio"></span>
          <span class="chip chip--evt pop" id="ad-cfab" style="left: 560px; top: 664px" data-icon="sparkles"></span>
          <span class="chip chip--evt pop" id="ad-clean" style="left: 960px; top: 290px" data-icon="shield"></span>
          <span class="chip chip--cmd pop" id="ad-lcmd" style="left: 980px; top: 696px">— comandos</span>
          <span class="chip chip--evt pop" id="ad-levt" style="left: 1200px; top: 696px">— eventos</span>
        </div>
        <div class="layer" id="ad-cmp">
          <div class="vs-h pop" id="ad-vh">Mismo instinto, dos formas</div>
          <div class="card vs vs--a pop" id="ad-va">
            <span class="vs__k">ArchColider</span>
            <span class="vs__t">Una capa dentro del módulo</span>
            <div class="flow"><span class="chip" data-icon="chef" data-label="Cocina"></span><span class="arr">→</span><span class="chip" style="border-color: #6b5a2a; color: #f2c14e" data-icon="shield" data-label="Capa de traducción"></span><span class="arr">→</span><span class="chip chip--accent" data-icon="layers" data-label="Dominio"></span></div>
            <span class="vs__n">La aduana vive dentro del monolito</span>
          </div>
          <div class="card vs vs--b pop" id="ad-vb">
            <span class="vs__k">Myagis-Forest · ADR 004</span>
            <span class="vs__t">Un wrapper por tercero</span>
            <div class="flow"><span class="chip" data-icon="chef" data-label="Cocina"></span><span class="arr">→</span><span class="chip chip--cmp" data-icon="package" data-label="Wrapper cocina"></span></div>
            <div class="flow"><span class="chip" data-icon="fridge" data-label="Refrigeradores"></span><span class="arr">→</span><span class="chip chip--cmp" data-icon="package" data-label="Wrapper refrigeradores"></span></div>
            <div class="flow"><span class="arr">→</span><span class="chip chip--cmp" data-icon="server" data-label="Servicios de negocio · estándar interno"></span></div>
            <span class="vs__n">Un microservicio por cada tercero</span>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('aduana');
          const { tl, W, L, pop, to, fade, draw, el, $, $$, node, wire, stream } = K;
          // data-icon chips get their icon first; the label goes after it
          [['#ad-c40', '40 lasañas · formato ajeno'], ['#ad-cint', 'formato interno'], ['#ad-cstk', 'stock actualizado'], ['#ad-cfab', 'la capa fabrica el evento'], ['#ad-clean', 'ni un dato crudo adentro']].forEach(([s, t]) => $(s).insertAdjacentHTML('beforeend', t));
          $$('#ad-cmp .chip[data-icon]').forEach((c) => c.insertAdjacentHTML('beforeend', c.dataset.label ?? ''));
          const P = $('#ad-nodes'), S = $('#ad-wires');
          const hl = (n, cls = '') => { const s = el('span', 'hl ' + cls, null, n.e); return s; };

          const EXT = [['chef', 'Cocina', 'Ghost Kitchen', 280], ['heart2', 'Lealtad', 'Loyalty Management', 400], ['phone', 'App y kioscos', 'Front End + PoS', 520]];
          const ACL = [['Meals Offer', 280], ['Loyalty', 400], ['Menu Catalog API', 520]];
          const CONS = [['cart', 'Carrito', 220], ['sparkles', 'Recomendaciones', 320], ['star', 'Reviews', 420], ['filter', 'Filtrado', 520]];
          const ext = EXT.map(([icon, title, sub, y]) => node(P, { x: 140, y, w: 300, h: 84, tone: 'ext', icon, title, sub }));
          const acl = ACL.map(([title, y]) => { const n = node(P, { x: 560, y, w: 280, h: 84, tone: 'acl', icon: 'shield', title, sub: 'traduce' }); return n; });
          const dom = node(P, { x: 960, y: 352, w: 330, h: 120, tone: 'built', icon: 'book', title: 'Menu Catalog', sub: 'el dominio puro' });
          const cons = CONS.map(([icon, title, y]) => node(P, { x: 1420, y, w: 320, h: 76, tone: 'cmp', icon, title }));
          const byte = node(P, { x: 140, y: 650, w: 300, h: 84, tone: 'danger', icon: 'fridge', title: 'Refrigeradores Byte', sub: 'API cruda, sin eventos' });
          acl.forEach((n) => { const ic = n.e.querySelector('.node__ic'); ic.style.cssText = 'background:#3a3016;color:#f2c14e'; });

          const wExt = ext.map((n, i) => wire(S, n.r, acl[i].l, '', true));
          const wCmd = acl.map((n) => wire(S, n.r, [dom.l[0], dom.l[1] + (n.c[1] - dom.c[1]) / 5], 'wire--cmd'));
          const wEvt = cons.map((n) => wire(S, [dom.r[0], dom.r[1] + (n.c[1] - dom.c[1]) / 5], n.l, 'wire--evt'));
          const wByte = wire(S, byte.r, [acl[2].l[0], acl[2].l[1] + 22], 'wire--danger');
          const hMo = hl(acl[0]), hApi = hl(acl[2], 'hl--evt'), hDom = hl(dom, 'hl--evt');

          // the service and its customs office
          pop(L(0), '#ad-svc', { y: 16, s: 0.98, d: 0.7 });
          pop(W(0, 'catálogo') - 0.1, dom.e, { s: 0.9, ease: 'back.out(1.6)' });
          pop(W(0, 'protegerlo') - 0.1, '#ad-acl', { y: 0, s: 0.97 });
          pop(W(1, 'anticorrupción') - 0.2, acl.map((n) => n.e), { st: 0.12, y: 10 });
          wCmd.forEach((w, k) => draw(W(1, 'anticorrupción') + 0.3 + k * 0.1, w.p, 0.5));
          [['cocina', 0], ['lealtad', 1], ['app', 2]].forEach(([cue, i]) => { pop(W(1, cue) - 0.15, ext[i].e, { y: 10 }); draw(W(1, cue) + 0.1, wExt[i].p, 0.5); });
          pop(W(1, 'kioscos'), cons.map((n) => n.e), { st: 0.1, y: 10 });
          wEvt.forEach((w, k) => draw(W(1, 'kioscos') + 0.2 + k * 0.1, w.p, 0.5));
          pop(W(1, 'ahí'), ['#ad-lcmd', '#ad-levt'], { st: 0.12, s: 0.9 });

          // one datum crosses the border
          pop(W(2, 'dato') - 0.1, '#ad-c40', { s: 0.85, ease: 'back.out(2)' });
          stream(S, wExt[0], W(2, 'cocinó'), W(2, 'cocinó') + 1.31, { travel: 1.3, color: '#aab3c2', r: 10 });
          fade(W(3, 'Meals') - 0.1, hMo, 0.3);
          stream(S, wCmd[0], W(3, 'traduce'), W(3, 'traduce') + 1.11, { travel: 1.1, color: '#6ea2ff', r: 10 });
          pop(W(3, 'traduce') + 0.4, '#ad-cint', { s: 0.85, ease: 'back.out(2)' });
          wEvt.forEach((w) => stream(S, w, W(3, 'emite'), W(3, 'emite') + 1.11, { travel: 1.1, color: '#3fd694', r: 10 }));
          pop(W(3, 'stock') - 0.1, '#ad-cstk', { s: 0.85, ease: 'back.out(2)' });

          // a provider that publishes no events: the layer makes them
          to(L(4) - 0.3, ['#ad-c40', '#ad-cint', '#ad-cstk', hMo], { opacity: 0, duration: 0.4 });
          pop(W(4, 'refrigeradores') - 0.2, byte.e, { y: 10 });
          fade(W(4, 'Byte'), wByte.p, 0.4);
          stream(S, wByte, W(4, 'Byte') + 0.3, W(4, 'fabrica') + 0.5, { travel: 1.3, every: 1.1, color: '#ff6b7a', r: 10 });
          fade(W(4, 'fabrica') - 0.1, hApi, 0.3);
          stream(S, wCmd[2], W(4, 'fabrica') + 0.2, W(4, 'fabrica') + 1.31, { travel: 1.1, color: '#3fd694', r: 10 });
          pop(W(4, 'fabrica'), '#ad-cfab', { s: 0.85, ease: 'back.out(2)' });

          // nothing raw got in; another team reached the same idea
          to(L(5) - 0.2, ['#ad-cfab', hApi], { opacity: 0, duration: 0.4 });
          fade(W(5, 'crudo'), hDom, 0.4);
          pop(W(5, 'dominio'), '#ad-clean', { s: 0.85, ease: 'back.out(2)' });
          to(W(5, 'Myagis') - 0.3, '#ad-dia', { opacity: 0, y: -20, duration: 0.5 });
          pop(W(5, 'Myagis') - 0.1, '#ad-vh', { y: 16 });
          pop(W(5, 'Myagis') + 0.1, '#ad-va', { y: 18, s: 0.97 });
          pop(W(5, 'wrapper') - 0.2, '#ad-vb', { y: 18, s: 0.97 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
