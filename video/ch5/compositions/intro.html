<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #intro { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #intro .mono-app { position: absolute; left: 330px; width: 1260px; top: 190px; height: 430px; padding: 34px 40px; display: flex; flex-direction: column; gap: 26px; }
        #intro .mono-app__h { display: flex; align-items: center; gap: 14px; height: 26px; font-family: var(--mono); font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
        #intro .mono-app__h svg { width: 26px; height: 26px; color: var(--accent-text); }
        #intro .mods { display: grid; grid-template-columns: repeat(4, 280px); gap: 20px; }
        #intro .mod { position: relative; height: 130px; border-radius: 18px; background: var(--surface3); border: 1.5px solid var(--line-strong); display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 20px; }
        #intro .mod__t { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 680; letter-spacing: -0.015em; }
        #intro .mod__t svg { flex: none; width: 30px; height: 30px; color: var(--text2); }
        #intro .mod__on { position: absolute; inset: -1.5px; border-radius: 18px; border: 2px solid var(--evt); background: rgba(63, 214, 148, 0.08); box-shadow: 0 0 30px rgba(63, 214, 148, 0.25); opacity: 0; }
        #intro .legend { top: 670px; }
        #intro .legend .chip { height: 56px; font-size: 25px; padding: 0 26px; }
        #intro .title { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
        #intro .title__k { font-family: var(--mono); font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-text); }
        #intro .title__h { font-size: 116px; font-weight: 820; letter-spacing: -0.045em; line-height: 1.02; max-width: 1500px; }
        #intro .title__s { font-size: 30px; color: var(--text2); font-weight: 500; }
      </style>
      <div id="intro" data-composition-id="intro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="in-a">
          <div class="card mono-app pop" id="in-app">
            <span class="mono-app__h"><span data-icon="box"></span>Un monolito modular · una aplicación, ocho módulos</span>
            <div class="mods" id="in-mods"></div>
          </div>
          <svg class="wires" id="in-mud" viewBox="0 0 1920 1080"></svg>
          <div class="row legend">
            <span class="chip chip--evt pop" id="in-good" data-icon="check"></span>
          </div>
          <div class="row legend">
            <span class="chip chip--danger pop" id="in-mudc" data-icon="alert"></span>
          </div>
        </div>
        <div class="title">
          <span class="title__k pop" id="in-tk">Capítulo 5</span>
          <span class="title__h pop" id="in-th">Qué se construye y qué se alquila</span>
          <span class="title__s pop" id="in-ts">Dónde poner el mejor esfuerzo, y cómo protegerlo</span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('intro');
          const { tl, W, L, pop, to, fade, el, sv, IC, $ } = K;
          $('#in-good').insertAdjacentHTML('beforeend', 'módulos bien cortados: fronteras claras');
          $('#in-mudc').insertAdjacentHTML('beforeend', 'bola de lodo: todo depende de todo');
          // the eight capabilities this chapter classifies
          const MODS = [['book', 'Catálogo'], ['inbox', 'Órdenes'], ['heart2', 'Lealtad'], ['message', 'Opiniones'], ['calClock', 'Agenda'], ['chart', 'Reportes'], ['bell', 'Notificaciones'], ['card', 'Pagos']];
          const mods = MODS.map(([ic, t]) => el('div', 'mod pop', `<span class="mod__on"></span><span class="mod__t">${IC[ic]}${t}</span>`, $('#in-mods')));
          // module centres in the card's grid (4 columns of 280px, 20px gap; rows of 130px)
          const C = (i) => [510 + (i % 4) * 300, 341 + Math.floor(i / 4) * 150];
          const PAIRS = [[0, 6], [1, 4], [2, 7], [3, 5], [0, 5], [4, 2], [6, 3], [1, 7], [5, 2], [7, 0]];
          const mud = PAIRS.map(([a, b]) => { const [x1, y1] = C(a), [x2, y2] = C(b); return sv('path', { d: `M${x1} ${y1} Q ${(x1 + x2) / 2 + 60} ${(y1 + y2) / 2 - 90} ${x2} ${y2}`, class: 'wire wire--danger', opacity: 0 }, $('#in-mud')); });

          pop(L(0), '#in-app', { y: 24, s: 0.97, d: 0.8 });
          pop(W(0, 'dividida') - 0.1, mods, { st: 0.07, y: 12, s: 0.94 });
          // well cut: each module has a clean border
          tl.to(mods.map((m) => m.querySelector('.mod__on')), { opacity: 1, duration: 0.4, stagger: 0.05 }, W(1, 'cortados') - 0.2);
          pop(W(1, 'cortados'), '#in-good', { s: 0.85, ease: 'back.out(2)' });
          // badly cut: everything depends on everything
          to(W(1, 'si', 1) - 0.1, mods.map((m) => m.querySelector('.mod__on')), { opacity: 0, duration: 0.4 });
          to(W(1, 'si', 1) - 0.1, '#in-good', { opacity: 0, duration: 0.3 });
          tl.to(mud, { opacity: 1, duration: 0.3, stagger: 0.12 }, W(1, 'lodo') - 0.3);
          pop(W(1, 'lodo') + 0.1, '#in-mudc', { s: 0.85, ease: 'back.out(2)' });
          to(L(2) - 0.4, '#in-a', { opacity: 0, y: -30, duration: 0.6 });
          pop(L(2), '#in-tk', { y: 18 });
          pop(L(2) + 0.12, '#in-th', { y: 40, d: 0.9, ease: 'expo.out' });
          pop(W(2, 'alquila') + 0.3, '#in-ts', { y: 14 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
