<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #outro { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #outro .four { position: absolute; left: 220px; width: 1480px; top: 180px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
        #outro .tk { position: relative; height: 230px; padding: 30px 34px; display: flex; flex-direction: column; gap: 12px; }
        #outro .tk__h { display: flex; align-items: center; gap: 16px; }
        #outro .tk__h i { flex: none; font-style: normal; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--surface3); font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--text2); }
        #outro .tk__h svg { width: 36px; height: 36px; }
        #outro .tk b { font-size: 40px; font-weight: 820; letter-spacing: -0.03em; line-height: 1.1; }
        #outro .tk span.tk__s { font-size: 27px; font-weight: 580; color: var(--text2); line-height: 1.3; }
        #outro .tk--a { border-color: rgba(110, 162, 255, 0.5); }
        #outro .tk--a .tk__h svg { color: var(--cmd); }
        #outro .tk--b { border-color: rgba(255, 122, 69, 0.55); }
        #outro .tk--b .tk__h svg { color: var(--accent-text); }
        #outro .tk--c { border-color: #6b5a2a; }
        #outro .tk--c .tk__h svg { color: #f2c14e; }
        #outro .tk--d { border-color: #1f5b45; }
        #outro .tk--d .tk__h svg { color: var(--evt); }
        #outro .world { position: absolute; left: 260px; right: 260px; top: 300px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
        #outro .wd { position: relative; height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; font-size: 34px; font-weight: 720; letter-spacing: -0.02em; }
        #outro .wd svg { width: 64px; height: 64px; color: var(--danger); }
      </style>
      <div id="outro" data-composition-id="outro" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="ou-a">
          <div class="four">
            <div class="card tk tk--a pop" id="ou-c1"><span class="tk__h"><i>1</i><span data-icon="help"></span><b>Dos preguntas</b></span><span class="tk__s">¿Diferencia al negocio? ¿Ya existe, hecho y probado?</span></div>
            <div class="card tk tk--b pop" id="ou-c2"><span class="tk__h"><i>2</i><span data-icon="hammer"></span><b>Construir · adaptar · alquilar</b></span><span class="tk__s">Core, soporte y genérico</span></div>
            <div class="card tk tk--c pop" id="ou-c3"><span class="tk__h"><i>3</i><span data-icon="shield"></span><b>Capa anticorrupción</b></span><span class="tk__s">Una frontera que traduce lo de afuera y protege el core</span></div>
            <div class="card tk tk--d pop" id="ou-c4"><span class="tk__h"><i>4</i><span data-icon="door"></span><b>Una pieza propia delante</b></span><span class="tk__s">Lo alquilado se puede cambiar sin tocar el resto</span></div>
          </div>
        </div>
        <div class="layer" id="ou-b">
          <div class="world">
            <div class="card wd pop" id="ou-w1"><span data-icon="wifiOff"></span>Refrigeradores sin señal</div>
            <div class="card wd pop" id="ou-w2"><span data-icon="utensils"></span>Dos personas, el último plato</div>
          </div>
        </div>
        <div class="next">
          <span class="next__k pop" id="ou-nk">Próximo · Capítulo 6</span>
          <span class="next__t pop" id="ou-nt">El mundo físico</span>
          <span class="next__q pop" id="ou-nq">Donde el software limpio choca con la realidad</span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('outro');
          const { W, L, pop, to } = K;
          pop(W(0, 'preguntas') - 0.2, '#ou-c1', { y: 18 });
          pop(W(1, 'construye') - 0.2, '#ou-c2', { y: 18 });
          pop(W(2, 'anticorrupción') - 0.3, '#ou-c3', { y: 18 });
          pop(W(3, 'pieza') - 0.3, '#ou-c4', { y: 18 });
          to(L(4) - 0.4, '#ou-a', { opacity: 0, y: -30, duration: 0.45 });
          pop(W(4, 'refrigeradores') - 0.15, '#ou-w1', { y: 16, s: 0.95 });
          pop(W(4, 'personas') - 0.15, '#ou-w2', { y: 16, s: 0.95 });
          to(L(5) - 0.3, '#ou-b', { opacity: 0, y: -30, duration: 0.6 });
          pop(L(5), '#ou-nk', { y: 16 });
          pop(W(5, 'capítulo'), '#ou-nt', { y: 36, d: 0.9, ease: 'expo.out' });
          pop(W(5, 'capítulo') + 0.5, '#ou-nq', { y: 16 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
