<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #puerta { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #puerta .qlbl { position: absolute; left: 140px; top: 150px; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); }
        #puerta .qlbl i { font-style: normal; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-weight: 800; }
        #puerta .ask { position: absolute; left: 300px; right: 300px; top: 190px; display: flex; flex-direction: column; gap: 18px; }
        #puerta .ask .question { position: relative; left: 0; right: 0; margin-bottom: 12px; }
        #puerta .opt { height: 128px; align-items: center; }
        #puerta .opt__k { color: var(--text2); }
        #puerta .opt__t { display: flex; flex-direction: column; gap: 8px; }
        #puerta .opt__t small { font-size: 22px; font-weight: 520; color: var(--text2); line-height: 1.25; }
        #puerta .opt__on { position: absolute; inset: -1.5px; border-radius: 18px; border: 2px solid var(--evt); background: rgba(63, 214, 148, 0.12); box-shadow: 0 0 40px rgba(63, 214, 148, 0.3); }
        #puerta .opt__x { position: absolute; inset: -1.5px; border-radius: 18px; border: 2px solid #6b2a33; background: rgba(61, 26, 32, 0.35); }
      </style>
      <div id="puerta" data-composition-id="puerta" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="pt-d" data-layout-allow-occlusion>
          <div class="qlbl pop" id="pt-q2"><i>2</i>¿Quién es cada visitante?</div>
          <svg class="wires" id="pt-wires" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="pt-nodes" data-layout-allow-occlusion></div>
        </div>
        <div class="ask" id="pt-ask">
          <div class="question pop" id="pt-q">
            <div class="ring">
              <svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="49" fill="none" stroke="#242d3a" stroke-width="6" /><circle id="pt-arc" cx="55" cy="55" r="49" fill="none" stroke="#ff7a45" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" /></svg>
              <span class="ring__ic" data-icon="pause"></span>
            </div>
            <div class="question__t">¿Dónde validarías quién es?</div>
          </div>
          <div class="opt pop" id="pt-o1"><span class="opt__x pop" id="pt-o1x"></span><span class="opt__k">A</span><span class="opt__t">En cada servidor<small class="pop" id="pt-o1s">el mismo control, copiado muchas veces: cada copia puede desfasarse</small></span></div>
          <div class="opt pop" id="pt-o2"><span class="opt__x pop" id="pt-o2x"></span><span class="opt__k">B</span><span class="opt__t">En la app del teléfono<small class="pop" id="pt-o2s">no lo controlas: lo que verifica se puede falsificar</small></span></div>
          <div class="opt pop" id="pt-o3"><span class="opt__on pop" id="pt-o3on"></span><span class="opt__k">C</span><span class="opt__t">En el balanceador<small class="pop" id="pt-o3s">una sola vez, antes de tocar un servidor</small></span></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('puerta');
          const { tl, W, L, LE, END, pop, fade, to, draw, $, node, chip, wire, stream, ring } = K;
          const P = $('#pt-nodes'), svg = $('#pt-wires');
          const user = node(P, { x: 140, y: 440, w: 330, h: 104, tone: 'user', icon: 'phone', title: 'Petición', sub: 'desde un teléfono' });
          const lb = node(P, { x: 640, y: 440, w: 460, h: 104, tone: 'built', icon: 'network', title: 'Balanceador de carga', sub: 'la única puerta' });
          const srv = [310, 450, 590].map((y, k) => node(P, { x: 1330, y, w: 450, h: 96, tone: 'cmp', icon: 'server', title: `Servidor ${k + 1}`, sub: 'copia idéntica' }));
          const who = chip(P, { x: 160, y: 370, icon: 'help', text: '¿quién eres?', tone: 'cmd' });
          const mine = chip(P, { x: 140, y: 580, icon: 'lock', text: 'las comidas de un suscriptor: solo para él', tone: 'accent' });
          const share = chip(P, { x: 780, y: 372, icon: 'split', text: 'reparte' });
          const wIn = wire(svg, user.r, lb.l, 'wire--cmd', true);
          const wOut = srv.map((n) => wire(svg, lb.r, n.l, 'wire--cmd'));

          // every request goes through the load balancer first: the only door
          pop(L(0), user.e, { y: 12 });
          pop(W(0, 'balanceador') - 0.3, lb.e, { y: 12 });
          draw(W(0, 'balanceador'), wIn.p, 0.5);
          stream(svg, wIn, W(0, 'balanceador') + 0.4, L(3), { every: 1.4, travel: 0.7, color: '#6ea2ff' });
          // it spreads them across identical copies
          pop(W(1, 'reparte') - 0.3, srv.map((n) => n.e), { st: 0.12, y: 10 });
          wOut.forEach((w, k) => draw(W(1, 'reparte') + k * 0.1, w.p, 0.5));
          pop(W(1, 'reparte'), share, { s: 0.85, ease: 'back.out(2)' });
          for (let t = W(1, 'reparte') + 0.6, n = 0; t < L(3) - 0.8; t += 1.4, n++) stream(svg, wOut[n % 3], t, t + 0.8, { travel: 0.8, every: 9, color: '#6ea2ff' });
          // and every request carries a question
          pop(W(2, 'quién') - 0.2, who, { s: 0.85, ease: 'back.out(2)' });
          pop(W(2, 'suscriptor') - 0.2, mine, { s: 0.85, ease: 'back.out(2)' });
          // think about it: the diagram steps back, three options, the ring empties in the pause
          to(L(3) - 0.3, '#pt-d', { opacity: 0.07, duration: 0.6 });
          pop(W(3, 'dónde') - 0.2, '#pt-q', { y: 18 });
          pop(W(4, 'servidor') - 0.2, '#pt-o1', { y: 12, s: 0.98 });
          pop(W(4, 'app') - 0.2, '#pt-o2', { y: 12, s: 0.98 });
          pop(W(4, 'balanceador') - 0.2, '#pt-o3', { y: 12, s: 0.98 });
          ring(LE(4), '#pt-arc', Math.max(1, L(5) - LE(4) - 0.4));
          // the answer, and why the other two fail
          fade(W(5, 'balanceador') - 0.1, '#pt-o3on', 0.3);
          fade(W(6, 'servidor') - 0.1, '#pt-o1x', 0.3);
          pop(W(6, 'copiado') - 0.3, '#pt-o1s', { y: 6 });
          fade(W(7, 'teléfono') - 0.1, '#pt-o2x', 0.3);
          pop(W(7, 'controlas') - 0.3, '#pt-o2s', { y: 6 });
          pop(W(8, 'sola') - 0.4, '#pt-o3s', { y: 6 });
          to(W(8, 'puerta'), ['#pt-o1', '#pt-o2'], { opacity: 0.45, duration: 0.5 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
