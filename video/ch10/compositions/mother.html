<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #mother { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #mother .ask { position: absolute; left: 300px; right: 300px; top: 210px; display: flex; flex-direction: column; gap: 22px; }
        #mother .ask .question { position: relative; left: 0; right: 0; }
        #mother .ask .question__t { font-size: 46px; }
        #mother .ask .opt { height: 96px; }
        #mother .ask .opt svg { width: 32px; height: 32px; color: var(--text3); flex: none; }
        #mother .opt__on { position: absolute; inset: -1.5px; border-radius: 18px; border: 2px solid var(--evt); background: rgba(63, 214, 148, 0.12); box-shadow: 0 0 40px rgba(63, 214, 148, 0.3); }
        #mother .why { position: absolute; left: 700px; top: 342px; width: 520px; display: flex; justify-content: center; }
        #mother .why .chip { position: relative; }
      </style>
      <div id="mother" data-composition-id="mother" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="mo-map" data-layout-allow-overlap></div>
        <div class="why" data-layout-allow-overlap><span class="chip chip--accent pop" id="mo-c1" data-icon="boxes"></span></div>
        <div class="why" data-layout-allow-overlap><span class="chip chip--danger pop" id="mo-c2" data-icon="alert"></span></div>
        <div class="why" data-layout-allow-overlap><span class="chip chip--evt pop" id="mo-c3" data-icon="activity"></span></div>
        <div class="why" data-layout-allow-overlap><span class="chip chip--evt pop" id="mo-c4" data-icon="activity"></span></div>
        <div class="ask" id="mo-ask" data-layout-allow-overlap>
          <div class="question pop" id="mo-q">
            <div class="ring">
              <svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="49" fill="none" stroke="#242d3a" stroke-width="6" /><circle id="mo-arc" cx="55" cy="55" r="49" fill="none" stroke="#ff7a45" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" /></svg>
              <span class="ring__ic" data-icon="pause"></span>
            </div>
            <div class="question__t">Riesgo: la bola de lodo. Contrapeso: medir cada módulo. ¿Qué decisión lo paga?</div>
          </div>
          <div class="opt pop" id="mo-o1"><span class="opt__k">A</span>El PIN offline<span data-icon="key" style="margin-left: auto"></span></div>
          <div class="opt pop" id="mo-o2"><span class="opt__on pop" id="mo-o2on"></span><span class="opt__k">B</span>El monitoreo alquilado<span data-icon="activity" style="margin-left: auto"></span></div>
          <div class="opt pop" id="mo-o3"><span class="opt__k">C</span>El feedback propio<span data-icon="shieldCheck" style="margin-left: auto"></span></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('mother');
          const { tl, W, L, LE, pop, fade, to, draw, $, $$ } = K;
          const why = $$('.why');
          $('#mo-c1').insertAdjacentHTML('beforeend', 'la decisión madre: tres flechas');
          $('#mo-c2').insertAdjacentHTML('beforeend', 'su renuncia: la bola de lodo');
          $('#mo-c3').insertAdjacentHTML('beforeend', 'contrapeso: medir cada módulo');
          $('#mo-c4').insertAdjacentHTML('beforeend', 'cuál carga más, cuándo separarlo');
          const M = MAP.build(K, $('#mo-map'), 'mo');
          const n = (id) => M.N[id].e;
          const on = (t, id) => tl.fromTo(M.N[id].on, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t);
          const BY = { 2: ['privacy', 'pin-offline', 'catalog-cache'], 1: ['monolith', 'event-sourcing', 'rabbitmq'], 3: ['datadog', 'edge-auth', 'scale-up', 'payment'] };

          // the three pillars together: the whole map, pillar by pillar
          [2, 1, 3].forEach((p, k) => {
            pop(W(0, 'pilares') - 0.3 + k * 0.35, M.zones[p], { y: 12, s: 0.98 });
            pop(W(0, 'mapa') - 0.4 + k * 0.3, BY[p].map(n), { st: 0.08, y: 10 });
          });
          // what an arrow means: first the two that are not the monolith's
          draw(W(1, 'flecha') - 0.1, M.W['cc-rmq'].p, 0.6);
          draw(W(1, 'llevó') - 0.2, M.W['rmq-pay'].p, 0.6);
          // three leave the monolith, and they arrive lit
          ['m-dd', 'm-ea', 'm-su'].forEach((k) => M.W[k].p.setAttribute('class', 'wire wire--hot'));
          on(W(1, 'monolito') - 0.1, 'monolith');
          ['m-dd', 'm-ea', 'm-su'].forEach((k, i) => draw(W(1, 'tres') - 0.3 + i * 0.25, M.W[k].p, 0.6));
          pop(W(2, 'madre') - 0.3, '#mo-c1', { s: 0.85, ease: 'back.out(2)' });
          // the first arrow answers the monolith's own trade-off
          const rest = Object.keys(M.N).filter((id) => !['monolith', 'datadog'].includes(id)).map(n);
          to(W(3, 'primera') - 0.2, [...rest, M.W['cc-rmq'].p, M.W['rmq-pay'].p, M.W['m-ea'].p, M.W['m-su'].p], { opacity: 0.25, duration: 0.6 });
          to(W(3, 'renuncia') - 0.2, '#mo-c1', { opacity: 0, duration: 0.3 });
          pop(W(3, 'renuncia'), '#mo-c2', { s: 0.85, ease: 'back.out(2)' });
          // piénsalo tú
          to(L(4) - 0.3, ['#mo-map', ...why], { opacity: 0.07, duration: 0.6 });
          pop(W(4, 'Piénsalo') - 0.1, '#mo-q', { y: 18 });
          pop(W(4, 'decisión') - 0.1, ['#mo-o1', '#mo-o2', '#mo-o3'], { st: 0.18, y: 12, s: 0.98 });
          K.ring(LE(4), '#mo-arc', Math.max(1, L(5) - LE(4) - 0.4));
          fade(W(5, 'monitoreo') - 0.2, '#mo-o2on', 0.3);
          to(W(5, 'monitoreo') - 0.2, ['#mo-o1', '#mo-o3'], { opacity: 0.3, duration: 0.4 });
          // back to the map: the monitoring pays for measuring every module
          to(W(5, 'contrapeso') - 0.3, '#mo-ask', { opacity: 0, y: -20, duration: 0.5 });
          to(W(5, 'contrapeso') - 0.3, ['#mo-map', ...why], { opacity: 1, duration: 0.6 });
          to(W(5, 'contrapeso') - 0.3, '#mo-c2', { opacity: 0, duration: 0.3 });
          pop(W(5, 'medir') - 0.2, '#mo-c3', { s: 0.85, ease: 'back.out(2)' });
          on(W(5, 'pagar') - 0.2, 'datadog');
          to(W(6, 'medido') - 0.2, '#mo-c3', { opacity: 0, duration: 0.3 });
          pop(W(6, 'medido'), '#mo-c4', { s: 0.85, ease: 'back.out(2)' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
