<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #anatomy { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #anatomy .hd { position: absolute; left: 180px; right: 180px; top: 150px; height: 104px; display: flex; align-items: center; gap: 22px; padding: 0 30px; border-color: #4a3f73; }
        #anatomy .hd__ic { flex: none; width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; background: var(--cmp-soft); color: var(--cmp); }
        #anatomy .hd__ic svg { width: 32px; height: 32px; }
        #anatomy .hd__t { display: flex; flex-direction: column; gap: 6px; }
        #anatomy .hd__t i { font-style: normal; font-family: var(--mono); font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
        #anatomy .hd__t b { font-size: 34px; font-weight: 780; letter-spacing: -0.02em; }
        #anatomy .col { position: absolute; top: 290px; width: 480px; height: 410px; padding: 30px 32px; display: flex; flex-direction: column; gap: 16px; }
        #anatomy .col h4 { font-family: var(--mono); font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
        #anatomy .col .q { font-size: 30px; font-weight: 720; line-height: 1.2; letter-spacing: -0.02em; color: var(--text); }
        #anatomy .col p { font-size: 26px; font-weight: 540; line-height: 1.32; color: var(--text2); }
        #anatomy .col--p { border-color: #2c4677; }
        #anatomy .col--p h4 { color: var(--cmd); }
        #anatomy .col--d { border-color: #4a3f73; }
        #anatomy .col--d h4 { color: var(--cmp); }
        #anatomy .col--t { border-color: #6b2a33; background: linear-gradient(180deg, #24161a, #181013); }
        #anatomy .col--t h4 { color: var(--danger); }
        #anatomy .cw { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--evt-soft); border: 1.5px solid #1f5b45; color: var(--evt); font-size: 21px; font-weight: 640; line-height: 1.25; }
        #anatomy .cw svg { flex: none; width: 24px; height: 24px; }
        #anatomy .arw { position: absolute; top: 470px; width: 60px; text-align: center; font-family: var(--mono); font-size: 36px; color: var(--text3); }
        #anatomy .col__on { position: absolute; inset: -1.5px; border-radius: 22px; border: 2px solid var(--danger); box-shadow: 0 0 44px rgba(255, 107, 122, 0.3); }
      </style>
      <div id="anatomy" data-composition-id="anatomy" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="card hd pop" id="an-hd">
          <span class="hd__ic" data-icon="boxes"></span>
          <span class="hd__t"><i>Capítulo 4 · ADR 002</i><b>El monolito modular</b></span>
        </div>
        <div class="card col col--p pop" id="an-c1" style="left: 180px">
          <h4>El problema</h4>
          <span class="q">¿Qué problema la forzó?</span>
          <p class="pop" id="an-p1">Unas 42 comidas al día, un equipo pequeño, y la meta de crecer a 68 locaciones.</p>
        </div>
        <span class="arw pop" id="an-a1" style="left: 660px">→</span>
        <div class="card col col--d pop" id="an-c2" style="left: 720px">
          <h4>La decisión</h4>
          <span class="q">¿Qué se decidió?</span>
          <p class="pop" id="an-p2">Una sola aplicación, dividida por dentro en módulos con fronteras estrictas.</p>
        </div>
        <span class="arw pop" id="an-a2" style="left: 1200px">→</span>
        <div class="card col col--t pop" id="an-c3" style="left: 1260px">
          <span class="col__on pop" id="an-on"></span>
          <h4>La renuncia</h4>
          <span class="q">¿A qué se renunció?</span>
          <p class="pop" id="an-p3">Que las fronteras se relajen: una bola de lodo, donde todo depende de todo.</p>
          <span class="cw pop" id="an-cw" data-icon="activity"></span>
        </div>
        <div class="row" style="top: 726px"><span class="chip chip--danger pop" id="an-stamp" style="height: 56px; font-size: 25px; padding: 0 26px" data-icon="alert"></span></div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('anatomy');
          const { W, L, pop, fade, $ } = K;
          $('#an-stamp').insertAdjacentHTML('beforeend', 'sin su renuncia escrita, una decisión es propaganda');
          $('#an-cw').insertAdjacentHTML('beforeend', 'Contrapeso: medir cada módulo, con telemetría');

          // three questions, one card each
          pop(W(0, 'tres') - 0.1, '#an-c1', { y: 18, s: 0.97 });
          pop(W(1, 'decidió') - 0.3, ['#an-a1', '#an-c2'], { st: 0.1, y: 18, s: 0.97 });
          pop(W(1, 'renunció') - 0.3, ['#an-a2', '#an-c3'], { st: 0.1, y: 18, s: 0.97 });
          // the example: the modular monolith, filled in as it is said
          pop(W(2, 'monolito') - 0.2, '#an-hd', { y: -14, s: 0.98 });
          pop(W(3, 'comidas') - 0.3, '#an-p1', { y: 10, s: 1 });
          pop(W(4, 'aplicación') - 0.3, '#an-p2', { y: 10, s: 1 });
          pop(W(5, 'relajen') - 0.3, '#an-p3', { y: 10, s: 1 });
          pop(W(6, 'contrapeso') - 0.2, '#an-cw', { y: 8, s: 0.97 });
          fade(W(7, 'renuncia') - 0.1, '#an-on', 0.35);
          pop(W(7, 'propaganda') - 0.3, '#an-stamp', { s: 0.85, ease: 'back.out(2)' });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
