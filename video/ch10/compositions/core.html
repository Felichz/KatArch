<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #core { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
      </style>
      <div id="core" data-composition-id="core" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="layer" id="co-map" data-layout-allow-overlap></div>
        <div class="layer" id="co-cards" data-layout-allow-overlap></div>
        <div class="card synth pop" id="co-syn" style="left: 760px; top: 222px; width: 1030px" data-layout-allow-overlap>
          <span class="synth__h">La forma del sistema</span>
          <span class="synth__r pop"><span>Cómo se organiza</span><em>→</em><b>Monolito modular</b></span>
          <span class="synth__r pop"><span>Cómo guarda</span><em>→</em><b>Event sourcing</b></span>
          <span class="synth__r pop"><span>Cómo se habla</span><em>→</em><b>Cola con acuse</b></span>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('core');
          const { tl, W, L, pop, to, $, $$ } = K;
          const M = MAP.build(K, $('#co-map'), 'co');
          const IDS = ['monolith', 'event-sourcing', 'rabbitmq'];
          const F = MAP.fichas(K, $('#co-cards'), 'co', IDS);
          const on = (t, id) => tl.fromTo(M.N[id].on, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t);
          const offn = (t, id) => tl.to(M.N[id].on, { opacity: 0, duration: 0.4 }, t);
          // a decision card arrives with its problem, then its answer; it leaves when the next one comes
          const card = (t, id, tAns) => { pop(t, F[id].c, { y: 16, s: 0.98 }); pop(t + 0.5, F[id].p, { y: 8, s: 1 }); pop(tAns, F[id].a, { y: 8, s: 1 }); };
          const leave = (t, id) => to(t, F[id].c, { opacity: 0, duration: 0.35 });

          // the three pillars, empty, where they sit on the map
          pop(W(0, 'tres') - 0.2, [M.zones[2], M.zones[1], M.zones[3]], { st: 0.18, y: 12, s: 0.98 });
          // the first one: the core moves to the left, the others step out
          to(W(1, 'primero') - 0.2, [M.zones[2], M.zones[3]], { opacity: 0, duration: 0.5 });
          to(W(1, 'núcleo') - 0.3, [M.zones[1], ...IDS.map((id) => M.N[id].e)], { x: -570, duration: 0.9, ease: 'power3.inOut' });
          tl.fromTo(M.zones[1].querySelector('.mzone__on'), { opacity: 0 }, { opacity: 1, duration: 0.4 }, W(1, 'forma'));
          // each decision, with its problem and its answer
          pop(W(2, 'monolito') - 0.2, M.N.monolith.e, { y: 12 });
          on(W(2, 'monolito'), 'monolith');
          card(W(2, 'monolito'), 'monolith', W(2, 'organiza') - 0.2);
          leave(L(3) - 0.2, 'monolith');
          offn(L(3) - 0.2, 'monolith');
          pop(W(3, 'Event') - 0.1, M.N['event-sourcing'].e, { y: 12 });
          on(W(3, 'Event'), 'event-sourcing');
          card(W(3, 'Event'), 'event-sourcing', W(3, 'orden') - 0.2);
          leave(L(4) - 0.2, 'event-sourcing');
          offn(L(4) - 0.2, 'event-sourcing');
          pop(W(4, 'cola') - 0.2, M.N.rabbitmq.e, { y: 12 });
          on(W(4, 'cola'), 'rabbitmq');
          card(W(4, 'cola'), 'rabbitmq', W(4, 'mensaje') - 0.2);
          leave(L(5) - 0.2, 'rabbitmq');
          offn(L(5) - 0.2, 'rabbitmq');
          // the synthesis: three questions, three answers
          pop(L(5), '#co-syn', { y: 16, s: 0.98 });
          const rows = $$('#co-syn .synth__r');
          pop(W(5, 'Organizarse') - 0.1, rows[0], { y: 8 });
          pop(W(5, 'guardar') - 0.1, rows[1], { y: 8 });
          pop(W(5, 'hablarse') - 0.1, rows[2], { y: 8 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
