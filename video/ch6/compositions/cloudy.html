<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #cloudy { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }
        #cloudy .sun { position: absolute; left: 0; right: 0; top: 360px; display: flex; justify-content: center; align-items: center; gap: 22px; }
        #cloudy .sun__b { position: relative; display: flex; align-items: center; gap: 14px; height: 84px; padding: 0 30px; border-radius: 18px; background: linear-gradient(180deg, #2a2412, #1a160e); border: 1.5px solid rgba(255, 196, 87, 0.5); color: #ffd27a; font-size: 30px; font-weight: 760; }
        #cloudy .sun__b svg { width: 34px; height: 34px; }
        #cloudy .step { position: relative; display: flex; align-items: center; gap: 12px; height: 84px; padding: 0 28px; border-radius: 18px; background: var(--surface2); border: 1.5px solid var(--line-strong); font-size: 30px; font-weight: 680; }
        #cloudy .step svg { width: 28px; height: 28px; color: var(--evt); }
        #cloudy .arrow { font-family: var(--mono); font-size: 32px; color: var(--text3); }
        #cloudy .lane { position: absolute; left: 120px; width: 1680px; height: 104px; border-radius: 16px; background: rgba(23, 29, 38, 0.55); border: 1.5px solid var(--line); }
        #cloudy .lane b { position: absolute; left: 22px; top: 38px; font-family: var(--mono); font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-weight: 600; }
        #cloudy .js { position: absolute; width: 186px; height: 84px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 19px; font-weight: 650; line-height: 1.18; border-radius: 14px; }
        #cloudy .js svg { flex: none; width: 24px; height: 24px; color: var(--cmd); }
        #cloudy .js--bad { border-color: #6b2a33; background: linear-gradient(180deg, #2a161a, #1c1013); }
        #cloudy .js--bad svg { color: var(--danger); }
        #cloudy .js--human { border-color: rgba(255, 122, 69, 0.6); background: linear-gradient(180deg, #2a1a12, #1a120e); }
        #cloudy .js--human svg { color: var(--accent-text); }
        #cloudy .js--ok svg { color: var(--evt); }
        #cloudy .lbl { position: absolute; }
        #cloudy .half-h { position: absolute; left: 0; right: 0; top: 220px; }
        #cloudy .half { position: absolute; top: 360px; width: 620px; height: 230px; padding: 32px 36px; display: flex; flex-direction: column; gap: 14px; }
        #cloudy .half__k { display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; }
        #cloudy .half__k svg { width: 40px; height: 40px; }
        #cloudy .half__s { font-size: 26px; font-weight: 540; color: var(--text2); line-height: 1.3; }
        #cloudy .half--sun { border-color: rgba(255, 196, 87, 0.45); }
        #cloudy .half--sun .half__k svg { color: #ffd27a; }
        #cloudy .half--rain { border-color: rgba(110, 162, 255, 0.5); }
        #cloudy .half--rain .half__k svg { color: var(--cmd); }
      </style>
      <div id="cloudy" data-composition-id="cloudy" data-width="1920" data-height="1080">
        <div class="scene-bg"></div>
        <div class="sun" id="cl-sun">
          <span class="sun__b pop" id="cl-sb" data-icon="sun"></span>
          <span class="step pop" id="cl-s1"><span data-icon="phone"></span>pide</span>
          <span class="arrow pop" id="cl-a1">→</span>
          <span class="step pop" id="cl-s2"><span data-icon="card"></span>paga</span>
          <span class="arrow pop" id="cl-a2">→</span>
          <span class="step pop" id="cl-s3"><span data-icon="check"></span>retira</span>
        </div>
        <div class="layer" id="cl-j">
          <div class="layer" id="cl-lanes"></div>
          <svg class="wires" id="cl-wires" viewBox="0 0 1920 1080"></svg>
          <div class="layer" id="cl-steps"></div>
          <span class="chip chip--danger lbl pop" id="cl-phys" data-icon="alert"></span>
          <span class="chip chip--accent lbl pop" id="cl-hum" data-icon="users"></span>
        </div>
        <div class="layer" id="cl-c">
          <div class="h2 half-h pop" id="cl-h">El camino feliz es solo la mitad</div>
          <div class="card half half--sun pop" id="cl-h1" style="left: 300px"><span class="half__k"><span data-icon="sun"></span>Día de sol</span><span class="half__s">pide, paga, retira: el diagrama de siempre</span></div>
          <div class="card half half--rain pop" id="cl-h2" style="left: 1000px"><span class="half__k"><span data-icon="cloudRain"></span>Día nublado</span><span class="half__s">el hardware falla: un camino humano, diseñado de antemano</span></div>
        </div>
      </div>
      <script>
        (() => {
          const K = KIT.scene('cloudy');
          const { tl, W, L, pop, fade, to, draw, el, IC, wire, $ } = K;
          $('#cl-sb').insertAdjacentHTML('beforeend', 'Día de sol');
          $('#cl-phys').insertAdjacentHTML('beforeend', 'falla física');
          $('#cl-hum').insertAdjacentHTML('beforeend', 'decisión humana');

          // the sunny day
          pop(W(0, 'sol') - 0.2, '#cl-sb', { s: 0.85, ease: 'back.out(2)' });
          pop(W(0, 'pide') - 0.1, '#cl-s1', { y: 14 });
          pop(W(0, 'paga') - 0.1, ['#cl-a1', '#cl-s2'], { st: 0.1, y: 14 });
          pop(W(0, 'retira') - 0.1, ['#cl-a2', '#cl-s3'], { st: 0.1, y: 14 });

          // the cloudy day, in lanes: the meal gets stuck, a person decides
          const LANES = ['Suscriptor', 'Refrigerador', 'Reclamos', 'Órdenes', 'Notificaciones'];
          const LY = (i) => 160 + i * 124;
          const lanes = LANES.map((t, i) => { const e = el('div', 'lane pop', `<b>${t}</b>`, $('#cl-lanes')); e.style.top = LY(i) + 'px'; return e; });
          const STEPS = [
            [0, 'keypad', 'Ingresa su código', ''],
            [1, 'check', '¿Código válido? Sí', ''],
            [1, 'alert', 'La comida se atasca', 'js--bad'],
            [2, 'camera', 'Foto + reclamo desde la app', ''],
            [2, 'userCog', 'Un admin aprueba', 'js--human'],
            [3, 'ticket', 'Orden nueva o cupón', 'js--ok'],
            [4, 'bell', 'Aviso: reclamo aprobado', 'js--ok'],
          ];
          const SX = (k) => 360 + k * 205;
          const st = STEPS.map(([ln, ic, t, cls], k) => { const e = el('div', `card js ${cls} pop`, `${IC[ic]}<span>${t}</span>`, $('#cl-steps')); e.style.left = SX(k) + 'px'; e.style.top = LY(ln) + 10 + 'px'; return e; });
          const ws = STEPS.slice(1).map(([ln], k) => { const [pl] = STEPS[k]; return wire($('#cl-wires'), [SX(k) + 186, LY(pl) + 52], [SX(k + 1), LY(ln) + 52], k === 1 ? 'wire--danger' : 'wire--cmd'); });
          ws[1].p.style.opacity = 0;
          const phys = $('#cl-phys'), hum = $('#cl-hum');
          phys.style.left = SX(3) + 20 + 'px'; phys.style.top = LY(1) + 29 + 'px';
          hum.style.left = SX(5) + 20 + 'px'; hum.style.top = LY(2) + 29 + 'px';

          to(L(1) - 0.3, '#cl-sun', { opacity: 0, y: -30, duration: 0.5 });
          pop(W(1, 'nublado') - 0.4, lanes, { st: 0.06, y: 0, s: 1 });
          pop(W(1, 'código') - 0.2, st[0], { y: 10 });
          draw(W(1, 'válido') - 0.3, ws[0].p, 0.4);
          pop(W(1, 'válido') - 0.1, st[1], { y: 10 });
          to(W(1, 'atascada') - 0.5, ws[1].p, { opacity: 1, duration: 0.3 });
          pop(W(1, 'atascada') - 0.4, st[2], { y: 10, s: 0.9, ease: 'back.out(2)' });
          pop(W(1, 'atascada') + 0.1, phys, { s: 0.85, ease: 'back.out(2)' });
          draw(W(2, 'foto') - 0.3, ws[2].p, 0.4);
          pop(W(2, 'foto') - 0.1, st[3], { y: 10 });
          draw(W(2, 'administrador') - 0.3, ws[3].p, 0.4);
          pop(W(2, 'administrador') - 0.1, st[4], { y: 10 });
          pop(W(2, 'aprueba'), hum, { s: 0.85, ease: 'back.out(2)' });
          draw(W(2, 'orden') - 0.3, ws[4].p, 0.4);
          pop(W(2, 'orden') - 0.1, st[5], { y: 10 });
          draw(W(2, 'cupón') + 0.2, ws[5].p, 0.4);
          pop(W(2, 'cupón') + 0.4, st[6], { y: 10 });

          // half of the design
          to(L(3) - 0.3, '#cl-j', { opacity: 0, duration: 0.5 });
          pop(L(3) - 0.1, '#cl-h', { y: 20 });
          pop(W(3, 'feliz') - 0.1, '#cl-h1', { y: 20, s: 0.97 });
          pop(W(3, 'mitad') - 0.1, '#cl-h2', { y: 20, s: 0.97 });
          K.done();
        })();
      </script>
    </template>
  </body>
</html>
